(function () {

	var files = ["he", "en", "lease", "triage"].map(function (l) { return fetch(base + l + ".json").then(function (r) { return r.json(); }); });

		NLRM.TRIAGE = j[3];
		NLRM.setStrings(lang, strings[lang]);
		TodayLab.install(q, lang);
		var ad = NLRM.DemoAdapter(lang);
		TodayLab.attach(ad);
		if (q.get("empty")) { var b0 = ad.boot; ad.boot = function () { return b0().then(function (d) { ["properties", "units", "contacts", "leases", "ledger", "tickets", "docs", "events"].forEach(function (k) { d[k] = []; }); d.demo = false; return d; }); }; }

})();
