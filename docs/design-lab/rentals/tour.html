<script>
(function () {
	var q = new URLSearchParams(location.search), lang = q.get("lang") || "he", base = "../../../plugins/nadlan-config/assets/rentals/i18n/", s1 = "../../../docs/rentals/build/slice1/";
	var files = ["he", "en", "lease", "triage"].map(function (l) { return fetch(base + l + ".json").then(function (r) { return r.json(); }); });
	/* slice 1: the new strings are merged here, never written into he.json / en.json */
	files.push(fetch(s1 + "strings-he.json").then(function (r) { return r.json(); }), fetch(s1 + "strings-en.json").then(function (r) { return r.json(); }));
	Promise.all(files).then(function (j) {
		Object.assign(j[0].ui, j[4]); Object.assign(j[1].ui, j[5]);
		var strings = { he: j[0].ui, en: j[1].ui }, msg = { he: j[0].msg, en: j[1].msg };
		NLRM.LEASE = j[2];
		NLRM.TRIAGE = j[3];
		NLRM.setStrings(lang, strings[lang]);
		TodayLab.install(q, lang);
		var ad = NLRM.DemoAdapter(lang);
		TodayLab.attach(ad);
		if (q.get("empty")) { var b0 = ad.boot; ad.boot = function () { return b0().then(function (d) { ["properties", "units", "contacts", "leases", "ledger", "tickets", "docs", "events"].forEach(function (k) { d[k] = []; }); d.demo = false; return d; }); }; }
		var root = document.getElementById("app");
		NLRM.mountToday(root, { urls: { designer: "/tour/designer/" }, today2: true });
		NLRM.mount(root, { lang: lang, strings: strings, msg: msg, adapter: ad, inPlaceLang: true, brand: lang === "he" ? "השכרות נדל״ן" : "NadLan Rentals", leaseMaker: false, assets: "../../../plugins/nadlan-config/assets/rentals/", me: { display: lang === "he" ? "דני כהן (דוגמה)" : "Dan Cohen (example)", phone: "", pay: {} }, urls: { pros: "https://nad-lan.co.il/professionals/", wizard: "https://nad-lan.co.il/post-listing/" } });
	});
})();
</script>
