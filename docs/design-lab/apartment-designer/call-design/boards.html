<title>לוחות שיחת הדירה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: a drafting set. Each board is one 1760x1240 sheet with a sheet number, a title block and phones drawn at 1:1.
   Ink is the surface behind video and model; blueprint white and paper are the panels; blueprint blue is action and live;
   dimension red is only for leaving and for measurements; every person draws with one technical-pen colour. */
:root{
  --ink:#0F2233; --ink-2:#16304A; --ink-3:#22405C; --graph:#46596A; --mute:#7A8B98;
  --sheet:#F2F5F7; --paper:#FFFFFF; --rule:#C9D4DC; --grid:#E2E8EC;
  --blue:#1F5FA8; --blue-2:#D6E5F6; --red:#B5302A;
  --p1:#1F5FA8; --p2:#1C7A4E; --p3:#B0307A; --p4:#0F7C8A; --p5:#5B4BB7; --p6:#46596A;
  --sans:"IBM Plex Sans Hebrew","Arial Hebrew",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:#D5DDE3;color:var(--ink)}
body{font-family:var(--sans);margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.top{max-width:1760px;margin:0 auto 18px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:baseline;justify-content:space-between;direction:rtl}
.top h1{font-size:22px;margin:0;font-weight:700}
.top p{margin:0;color:var(--graph);font-size:14px}
.toc{display:flex;flex-wrap:wrap;gap:6px;direction:rtl;max-width:1760px;margin:0 auto 22px}
.toc a{font:500 13px var(--sans);color:var(--ink);text-decoration:none;border:2px solid var(--ink);padding:6px 10px;background:var(--paper)}
.toc a:hover,.toc a:focus-visible{background:var(--ink);color:#fff;outline:none}
.wrap{max-width:1760px;margin:0 auto 28px;overflow:hidden}
.shot .wrap{max-width:none;margin:0;overflow:visible}
.shot body,body.shot{padding:0;background:#D5DDE3}

/* the sheet */
.board{position:relative;width:1760px;height:1240px;direction:rtl;transform-origin:top right;
  background-color:var(--sheet);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:40px 40px;background-position:-1px -1px;border:2px solid var(--ink);overflow:hidden}
.board::after{content:"";position:absolute;inset:14px;border:1px solid var(--ink);pointer-events:none}
.bh{position:absolute;top:44px;right:52px;left:52px;display:flex;gap:22px;align-items:flex-start}
.bn{flex:none;width:76px;height:76px;border:2px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--paper)}
.bn b{font:600 34px/1 var(--mono)}
.bn small{font:500 10px/1 var(--mono);color:var(--graph);margin-top:6px}
.bh h2{font-size:40px;line-height:1.05;margin:2px 0 8px;font-weight:700;letter-spacing:-.2px;text-wrap:balance}
.bh p{margin:0;font-size:17px;line-height:1.45;color:var(--graph);max-width:1100px}
.tb{position:absolute;left:28px;bottom:28px;display:flex;border:2px solid var(--ink);background:var(--paper);font-size:11.5px;direction:rtl}
.tb div{padding:7px 12px;border-inline-start:1px solid var(--ink);display:flex;flex-direction:column;gap:2px;justify-content:center}
.tb div:first-child{border-inline-start:0}
.tb small{font:500 9px/1 var(--mono);color:var(--mute);letter-spacing:.6px;text-transform:uppercase}
.tb b{font-weight:600}
.body{position:absolute;top:160px;right:52px;left:52px;bottom:90px;display:flex;gap:40px;align-items:flex-start}

/* phones */
.ph{margin:0;flex:none;display:flex;flex-direction:column;gap:12px;width:406px}
.ph.z{zoom:.9}
.dev{width:406px;height:860px;padding:8px;background:var(--ink);position:relative}
.dev::before{content:"";position:absolute;top:-2px;left:50%;width:120px;height:6px;margin-left:-60px;background:var(--ink)}
.scr{position:relative;width:390px;height:844px;overflow:hidden;background:var(--ink);color:#fff;direction:rtl;font-size:14px}
.ph figcaption{font-size:14px;line-height:1.45;color:var(--ink)}
.ph figcaption>b{display:flex;gap:8px;align-items:baseline;font-size:16px;margin-bottom:4px}
.ph figcaption>b i{font:600 12px var(--mono);font-style:normal;color:var(--graph)}
.ph ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.ph ol li{display:flex;gap:8px}
.ph ol li span.n{flex:none;width:18px;height:18px;border:1.5px solid var(--ink);font:600 11px/15px var(--mono);text-align:center;margin-top:2px;background:var(--paper)}
.mk{position:absolute;z-index:60;width:22px;height:22px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);font:600 12px/18px var(--mono);text-align:center;box-shadow:0 0 0 2px rgba(255,255,255,.7)}

/* status bar + home */
.sb{position:absolute;top:0;inset-inline:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;direction:ltr;font:600 15px var(--mono);z-index:40}
.sb .r{display:flex;gap:6px;align-items:center}
.sb.l{color:var(--ink)}
.home{position:absolute;bottom:0;inset-inline:0;height:34px;z-index:40;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;background:var(--paper)}
.home i{width:134px;height:5px;background:var(--ink);display:block}
.home.d{background:var(--ink)} .home.d i{background:#fff}
.home.t{background:transparent}

/* call header */
.hdr{position:absolute;top:44px;inset-inline:0;height:56px;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;z-index:30;background:var(--ink);border-bottom:1px solid var(--ink-3)}
.hdr .bk{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.hdr .tt{flex:1;min-width:0}
.hdr .tt b{display:block;font-size:15px;font-weight:600;line-height:1.2}
.hdr .tt small{display:block;font-size:12px;color:#A9B8C4;line-height:1.3}
.live{display:flex;align-items:center;gap:8px;border:1.5px solid #3A5874;height:32px;padding:0 10px;font-size:13px}
.live i{width:8px;height:8px;background:#5B9BE6;display:block;box-shadow:0 0 0 3px rgba(91,155,230,.25)}
.live .mono{font-size:13px;font-weight:500}
.live .pp{display:flex;gap:4px;align-items:center;border-inline-start:1px solid #3A5874;padding-inline-start:8px;font-family:var(--mono)}

/* stage */
.stage{position:absolute;top:100px;inset-inline:0;bottom:110px;overflow:hidden;background-color:var(--ink);
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:24px 24px}
.stage.full{bottom:34px}
.stage.paper{background-color:var(--sheet);background-image:none}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.follow{position:absolute;inset:0;border:3px solid var(--c);pointer-events:none;z-index:20}
.ftab{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:21;background:var(--c);color:#fff;height:34px;display:flex;align-items:center;gap:8px;padding:0 12px 0 14px;font-size:13.5px;font-weight:600;white-space:nowrap}
.ftab .x{border-inline-start:1px solid rgba(255,255,255,.45);padding-inline-start:8px;font-weight:500}

/* control bar */
.bar{position:absolute;bottom:34px;inset-inline:0;height:76px;background:var(--paper);border-top:2px solid var(--ink);display:flex;align-items:center;padding:0 8px;gap:0;z-index:35;color:var(--ink)}
.cells{flex:1;display:flex;height:60px}
.cell{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;font-weight:500;white-space:nowrap;position:relative}
.cell svg{width:24px;height:24px}
.cell.on{background:var(--ink);color:#fff}
.cell.act{background:var(--blue);color:#fff}
.cell.blk{background:repeating-linear-gradient(-45deg,#fff 0 4px,#E3E9ED 4px 8px);color:var(--graph)}
.cell .dot{position:absolute;top:2px;inset-inline-end:4px;min-width:16px;height:16px;padding:0 3px;background:var(--blue);color:#fff;font:600 10px/16px var(--mono);text-align:center}
.cell .lv{position:absolute;bottom:22px;inset-inline-end:calc(50% - 16px);width:3px;height:14px;background:var(--rule)}
.cell .lv i{position:absolute;bottom:0;left:0;right:0;background:var(--p2);display:block}
.sep{width:2px;height:44px;background:var(--rule);margin:0 8px}
.leave{width:56px;height:56px;background:var(--red);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;flex:none}
.leave svg{width:24px;height:24px}
.bar.hidden{transform:translateY(110px)}

/* discs */
.disc{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;flex:none}
.dc{position:relative;border-radius:50%;overflow:hidden;background:#2A4256;box-shadow:0 0 0 2px var(--c),0 0 0 4px var(--ink)}
.dc svg{width:100%;height:100%;display:block}
.dc.sp{box-shadow:0 0 0 3px var(--c),0 0 0 6px var(--ink),0 0 0 8px color-mix(in srgb,var(--c) 55%,transparent)}
.dc.off{background:#fff;display:flex;align-items:center;justify-content:center;color:var(--c);font-weight:700}
.dc.dim{filter:grayscale(1) brightness(.75)}
.dtag{display:flex;align-items:stretch;height:17px;font-size:10.5px;line-height:17px;font-weight:600;background:var(--ink);color:#fff;border:1px solid #3A5874;white-space:nowrap}
.dtag i{width:4px;background:var(--c);display:block;font-style:normal}
.dtag span{padding:0 5px}
.badge{position:absolute;width:20px;height:20px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;border:1.5px solid var(--ink)}
.badge svg{width:13px;height:13px}
.badge.q{background:var(--ink);color:#fff;border-color:#fff}
.strip{position:absolute;top:12px;inset-inline:12px;display:flex;gap:14px;z-index:15;align-items:flex-start}
.selfp{position:absolute;z-index:16}

/* stamp: name + role as a drawing stamp */
.stamp{display:inline-flex;border:1.5px solid currentColor;font-size:11px;line-height:1;white-space:nowrap;background:var(--ink);color:#fff}
.stamp b{padding:5px 7px;border-inline-start:3px solid var(--c);font-weight:600}
.stamp span{padding:5px 7px;border-inline-start:1px solid rgba(255,255,255,.4);font:500 10px/1 var(--sans);color:#C8D3DB}
.stamp.lt{background:#fff;color:var(--ink)}
.stamp.lt span{border-color:var(--ink);color:var(--graph)}

/* chips, banners, sheets */
.chip{position:absolute;z-index:22;display:flex;align-items:center;gap:7px;height:32px;padding:0 10px 0 4px;background:var(--c);color:#fff;font-size:13px;font-weight:600;white-space:nowrap}
.chip .mini{width:24px;height:24px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px #fff;flex:none}
.chip.lt{background:#fff;color:var(--ink);border:2px solid var(--c);padding-inline-start:4px}
.pill{position:absolute;z-index:22;display:flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 12px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);font-size:13px;font-weight:600;white-space:nowrap}
.pill .stack{display:flex}
.pill .stack .mini{width:24px;height:24px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--c);margin-inline-start:-6px}
.pill .stack .mini:first-child{margin-inline-start:0}
.inset{position:absolute;z-index:21;background:var(--ink);border:2px solid var(--ink);box-shadow:0 0 0 2px #fff}
.inset svg{width:100%;height:100%;display:block}
.inset .sw{position:absolute;top:4px;inset-inline-start:4px;width:30px;height:30px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center}
.inset .sw svg{width:18px;height:18px}
.inset .lb{position:absolute;bottom:4px;inset-inline-end:4px;background:rgba(15,34,51,.85);color:#fff;font-size:10.5px;padding:2px 6px}
.seg{position:absolute;z-index:22;display:flex;border:2px solid var(--ink);background:#fff;color:var(--ink)}
.seg span{height:40px;min-width:56px;padding:0 10px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12.5px;font-weight:600;border-inline-start:1px solid var(--rule)}
.seg span:first-child{border:0}
.seg span.on{background:var(--ink);color:#fff}
.seg svg{width:16px;height:16px}
.banner{position:absolute;z-index:36;inset-inline:0;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:14px;font-weight:600}
.toast{position:absolute;z-index:37;display:flex;align-items:center;gap:10px;background:#fff;color:var(--ink);border:2px solid var(--ink);padding:10px 12px;font-size:14px;font-weight:600;box-shadow:0 0 0 2px rgba(15,34,51,.25)}
.toast.dk{background:var(--ink);color:#fff;border-color:#fff}
.sheet{position:absolute;z-index:50;inset-inline:0;bottom:0;background:var(--paper);color:var(--ink);border-top:2px solid var(--ink);padding:18px 16px 48px}
.sheet h3{margin:0 0 4px;font-size:20px;line-height:1.25}
.sheet .sub{margin:0 0 14px;color:var(--graph);font-size:14px;line-height:1.45}
.scrim{position:absolute;inset:0;z-index:45;background:rgba(15,34,51,.55)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;border:2px solid var(--ink);background:#fff;color:var(--ink);font-size:16px;font-weight:600;padding:0 14px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.dk{background:var(--ink);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{min-height:44px;font-size:14px;width:auto}
.btn svg{width:22px;height:22px}
.row{display:flex;gap:8px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600}
.field .in{height:52px;border:2px solid var(--ink);display:flex;align-items:center;padding:0 12px;font-size:17px;background:#fff}
.field .in.f{outline:3px solid var(--blue);outline-offset:1px}
.tg{display:flex;align-items:center;gap:10px;height:56px;border-top:1px solid var(--rule);font-size:15px}
.tg:last-of-type{border-bottom:1px solid var(--rule)}
.tg svg{width:22px;height:22px}
.tg .t{flex:1}
.tg small{display:block;font-size:12px;color:var(--graph)}
.sw2{width:48px;height:28px;border:2px solid var(--ink);position:relative;background:#fff;flex:none}
.sw2::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;background:var(--ink)}
.sw2.on{background:var(--blue);border-color:var(--blue)}
.sw2.on::after{inset-inline-start:auto;inset-inline-end:3px;background:#fff}
.fine{font-size:12.5px;color:var(--graph);line-height:1.45;margin:10px 0 0}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;align-items:center;gap:12px;min-height:60px;border-bottom:1px solid var(--rule)}
.list li .t{flex:1;min-width:0}
.list li .t b{display:block;font-size:15px}
.list li .t small{display:block;font-size:12.5px;color:var(--graph)}
.list svg{width:22px;height:22px;flex:none}
.ico{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);flex:none}

/* notes column */
.notes{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px;padding-top:4px}
.notes h4{margin:0;font-size:13px;font-weight:600;color:var(--graph);letter-spacing:.3px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.notes .blk{display:flex;flex-direction:column;gap:8px}
.notes p{margin:0;font-size:15px;line-height:1.55}
.notes dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;line-height:1.45}
.notes dt{font-weight:600}
.notes dd{margin:0;color:var(--ink)}
.rule{font:500 12.5px var(--mono);color:var(--red)}
.kv{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--rule);padding:6px 0;font-size:14px}
.kv .mono{color:var(--graph)}
.dimh{position:absolute;height:14px;border-left:1.5px solid var(--red);border-right:1.5px solid var(--red);z-index:61}
.dimh::before{content:"";position:absolute;top:6px;left:0;right:0;border-top:1.5px solid var(--red)}
.dimh b{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font:600 11px var(--mono);color:var(--red);background:var(--sheet);padding:0 3px}
.dimv{position:absolute;width:14px;border-top:1.5px solid var(--red);border-bottom:1.5px solid var(--red);z-index:61}
.dimv::before{content:"";position:absolute;left:6px;top:0;bottom:0;border-left:1.5px solid var(--red)}
.dimv b{position:absolute;left:18px;top:50%;transform:translateY(-50%);font:600 11px var(--mono);color:var(--red);background:var(--sheet);padding:0 3px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- faces: neutral drawn figures, never photos ---------- */
function faceSVG(p, o={}){
  const hair = [
    '<path d="M33 40c0-14 8-21 17-21s17 7 17 21c-4-7-10-10-17-10s-13 3-17 10z" fill="#5B6E7D"/>',
    '<path d="M30 70V42c0-16 9-24 20-24s20 8 20 24v28l-8-2V44H38v24z" fill="#4A5D6C"/>',
    '<circle cx="50" cy="20" r="8" fill="#4A5D6C"/><path d="M34 40c0-13 7-19 16-19s16 6 16 19c-5-6-10-8-16-8s-11 2-16 8z" fill="#4A5D6C"/>',
    '<path d="M34 38c0-12 7-18 16-18s16 6 16 18c-3-5-9-7-16-7s-13 2-16 7z" fill="#6B7E8C"/><path d="M38 54c3 7 8 10 12 10s9-3 12-10v6c-3 6-8 9-12 9s-9-3-12-9z" fill="#6B7E8C"/>',

  ][p.v % 5];
  const back = o.light ? '#C9D4DC' : '#2A4256', win = o.light ? '#E3E9ED' : '#3E5A70';
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="${back}"/><rect x="62" y="8" width="26" height="40" fill="${win}"/><path d="M62 28h26M75 8v40" stroke="${back}" stroke-width="1.5"/>${p.v===1?hair:''}<path d="M12 104c2-22 18-33 38-33s36 11 38 33z" fill="${p.shirt}"/><rect x="44" y="56" width="12" height="16" fill="#C3CED6"/><ellipse cx="50" cy="44" rx="14.5" ry="17" fill="#D6DEE4"/>${p.v!==1?hair:''}</svg>`;
}
function disc(p, o={}){
  const s = o.size||52;
  const inner = o.off ? `<span style="font-size:${Math.round(s*.42)}px">${p.ini}</span>` : faceSVG(p, o);
  let b = '';
  if (o.mute) b += `<span class="badge" style="bottom:${o.tag===false?-2:20}px;inset-inline-start:-4px">${ic('micoff',13)}</span>`;
  if (o.weak) b += `<span class="badge q" style="top:-4px;inset-inline-start:-4px">${ic('signal',13)}</span>`;
  if (o.host) b += `<span class="badge" style="top:-4px;inset-inline-end:-4px;font:600 9px var(--mono)">מארח</span>`.replace('font:600 9px var(--mono)','font:700 8px var(--sans);width:auto;padding:0 3px');
  const tag = o.tag===false ? '' : `<span class="dtag"><i></i><span>${o.label||p.n}</span></span>`;
  return `<div class="disc" style="--c:${p.c}"><div class="dc ${o.sp?'sp':''} ${o.off?'off':''} ${o.dim?'dim':''}" style="width:${s}px;height:${s}px">${inner}</div>${tag}${b}</div>`;
}
const mini = (p) => `<span class="mini" style="--c:${p.c}">${faceSVG(p)}</span>`;
const stamp = (p, lt) => `<span class="stamp ${lt?'lt':''}" style="--c:${p.c}"><b>${p.n}</b><span>${p.role}</span></span>`;

  [640,620,680,620,I],[760,620,900,620,I],[980,620,1140,620,I],[1140,620,1180,620,M],[1260,620,1420,620,M],

];
const ROOMS = [

const BALC = [0,-180,640,180];
function furniture(state){

/* fit a viewBox into a WxH stage, return map */
function fitter(vb, W, H, mode){
  const sc = mode==='slice' ? Math.max(W/vb[2], H/vb[3]) : Math.min(W/vb[2], H/vb[3]);
  const ox = (W - vb[2]*sc)/2, oy = (H - vb[3]*sc)/2;
  return (sx, sy) => [ox + (sx - vb[0])*sc, oy + (sy - vb[1])*sc];
}

/* ---------- 3D: axonometric massing model on ink ---------- */
function iso(o){
  const W=o.w, H=o.h, WH=o.wallH||130, CS=.866, SN=.5;
  const pr = (x,y,z=0) => [(x-y)*CS, (x+y)*SN - z];
  const pts = a => a.map(p => pr(...p).map(v=>v.toFixed(1)).join(',')).join(' ');
  const items = [];
  const F = furniture(o.state);
  WALLS.forEach(([x1,y1,x2,y2,t]) => {
    const hz = y1===y2, len = hz ? Math.abs(x2-x1) : Math.abs(y2-y1), n = Math.max(1, Math.ceil(len/40));
    for (let i=0;i<n;i++){
      const a = (hz?Math.min(x1,x2):Math.min(y1,y2)) + len*i/n, L = len/n;
      const b = hz ? {x:a-(i===0?t/2:0), y:y1-t/2, w:L+(i===0?t/2:0)+(i===n-1?t/2:0), d:t} : {x:x1-t/2, y:a-(i===0?t/2:0), w:t, d:L+(i===0?t/2:0)+(i===n-1?t/2:0)};
      items.push({...b, h:WH, wall:true});
    }
  });
  F.forEach(f => { if (f.k!=='rug') items.push({...f}); });
  items.sort((a,b) => (a.x+a.w/2 + a.y+a.d/2) - (b.x+b.w/2 + b.y+b.d/2));
  const hold = o.hold, holdC = o.holdC;
  let s = '';
  // floors
  s += `<polygon points="${pts([[BALC[0],BALC[1],0],[BALC[0]+BALC[2],BALC[1],0],[BALC[2],0,0],[0,0,0]])}" fill="#3A5874" stroke="#5E7A92" stroke-width=".8" vector-effect="non-scaling-stroke"/>`;
  ROOMS.forEach(([id,,x,y,w,d]) => {
    const fill = id==='bath'?'#B9C7D2':id==='kitchen'||id==='entry'||id==='hall'?'#CAD5DD':'#DCE4EA';
    s += `<polygon points="${pts([[x,y,0],[x+w,y,0],[x+w,y+d,0],[x,y+d,0]])}" fill="${fill}"/>`;
  });
  // floor boards hint in living
  for (let x=40;x<640;x+=40) s += `<polyline points="${pts([[x,0,0],[x,540,0]])}" stroke="#CFD9E0" stroke-width=".6" vector-effect="non-scaling-stroke"/>`;
  F.filter(f=>f.k==='rug').forEach(f => s += `<polygon points="${pts([[f.x,f.y,1],[f.x+f.w,f.y,1],[f.x+f.w,f.y+f.d,1],[f.x,f.y+f.d,1]])}" fill="#BFCBD4"/>`);
  // ghost of committed position
  if (o.ghost){ const g=o.ghost; s += `<polygon points="${pts([[g.x,g.y,1],[g.x+g.w,g.y,1],[g.x+g.w,g.y+g.d,1],[g.x,g.y+g.d,1]])}" fill="none" stroke="${holdC}" stroke-width="1.6" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>`; }
  // cones (where others look from)
  (o.cones||[]).forEach(c => {
    const a = c.a*Math.PI/180, L = c.L||170, sp = .5;
    const p1=[c.x+Math.cos(a-sp)*L, c.y+Math.sin(a-sp)*L, 3], p2=[c.x+Math.cos(a+sp)*L, c.y+Math.sin(a+sp)*L, 3];
    s += `<polygon points="${pts([[c.x,c.y,3],p1,p2])}" fill="${c.c}" fill-opacity=".28" stroke="${c.c}" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
    const q = pr(c.x,c.y,3); s += `<rect x="${q[0]-9}" y="${q[1]-9}" width="18" height="18" fill="${c.c}" stroke="#fff" stroke-width="3" vector-effect="non-scaling-stroke"/>`;
  });
  items.forEach(b => {
    const {x,y,w,d,h} = b, held = hold && b.id===hold;
    let top='#C7D2DA', fy='#9FB1BE', fx='#8299AA';
    if (b.wall){ top='#FFFFFF'; fy='#B4C3CE'; fx='#93A7B6'; }
    if (b.k==='bed'){ top='#E9EEF2'; }
    if (held){ top=`color-mix(in srgb, ${holdC} 30%, #fff)`; fy=`color-mix(in srgb, ${holdC} 45%, #9FB1BE)`; fx=`color-mix(in srgb, ${holdC} 55%, #8299AA)`; }
    const st = `stroke="#0F2233" stroke-width=".7" vector-effect="non-scaling-stroke" stroke-linejoin="round"`;
    const ws = c => `stroke="${c}" stroke-width=".9" vector-effect="non-scaling-stroke" stroke-linejoin="round"`;
    if (held) s += `<polygon points="${pts([[x-14,y-14,1],[x+w+14,y-14,1],[x+w+14,y+d+14,1],[x-14,y+d+14,1]])}" fill="${holdC}" fill-opacity=".22" stroke="${holdC}" stroke-width="3" vector-effect="non-scaling-stroke"/>`;
    s += `<polygon points="${pts([[x,y+d,0],[x+w,y+d,0],[x+w,y+d,h],[x,y+d,h]])}" fill="${fy}" ${b.wall?ws(fy):st}/>`;
    s += `<polygon points="${pts([[x+w,y,0],[x+w,y+d,0],[x+w,y+d,h],[x+w,y,h]])}" fill="${fx}" ${b.wall?ws(fx):st}/>`;
    s += `<polygon points="${pts([[x,y,h],[x+w,y,h],[x+w,y+d,h],[x,y+d,h]])}" fill="${top}" ${b.wall?ws(top):st}/>`;
    if (b.k==='sofa'){ const bx = b.w<b.d ? [[x,y,h],[x+22,y,h],[x+22,y+d,h],[x,y+d,h]] : [[x,y,h],[x+w,y,h],[x+w,y+22,h],[x,y+22,h]]; s += `<polygon points="${pts(bx.map(p=>[p[0],p[1],h+16]))}" fill="${held?`color-mix(in srgb, ${holdC} 20%, #fff)`:'#DCE4EA'}" ${st}/>`; }
    if (b.k==='bed'){ s += `<polygon points="${pts([[x+12,y+10,h+6],[x+w-12,y+10,h+6],[x+w-12,y+50,h+6],[x+12,y+50,h+6]])}" fill="#FFFFFF" ${st}/>`; }
    if (held && (o.focusPulse!==false)) s += `<polygon points="${pts([[x-14,y-14,h+2],[x+w+14,y-14,h+2],[x+w+14,y+d+14,h+2],[x-14,y+d+14,h+2]])}" fill="none" stroke="${holdC}" stroke-width="2" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>`;
  });
  // crisp wall outlines drawn once per whole wall (nothing in the model is taller than the walls)
  WALLS.forEach(([x1,y1,x2,y2,t]) => {
    const a = y1===y2 ? [Math.min(x1,x2)-t/2, y1-t/2, Math.abs(x2-x1)+t, t] : [x1-t/2, Math.min(y1,y2)-t/2, t, Math.abs(y2-y1)+t];
    const [x,y,w,d] = a;
    s += `<polygon points="${pts([[x,y,WH],[x+w,y,WH],[x+w,y+d,WH],[x,y+d,WH]])}" fill="none" stroke="#0F2233" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
    s += `<polyline points="${pts([[x,y+d,WH],[x,y+d,0],[x+w,y+d,0],[x+w,y,0],[x+w,y,WH]])}" fill="none" stroke="#0F2233" stroke-width=".8" stroke-opacity=".55" vector-effect="non-scaling-stroke"/>`;
    s += `<polyline points="${pts([[x+w,y+d,WH],[x+w,y+d,0]])}" fill="none" stroke="#0F2233" stroke-width=".8" vector-effect="non-scaling-stroke"/>`;
  });
  if (o.center){
    const c = pr(...o.center), vw = W/o.scale, vh = H/o.scale;
    const vb = [c[0]-vw/2, c[1]-vh/2, vw, vh], f = fitter(vb, W, H, 'meet');
    return {svg:`<svg viewBox="${vb.map(v=>v.toFixed(1)).join(' ')}" preserveAspectRatio="xMidYMid meet">${s}</svg>`, at:(x,y,z=0)=>f(...pr(x,y,z))};
  }
  // view bounds
  let bx = o.focus || [-20,-200,1440,980];
  const cs = [[bx[0],bx[1],0],[bx[2],bx[1],0],[bx[2],bx[3],0],[bx[0],bx[3],0],[bx[0],bx[1],WH],[bx[2],bx[1],WH]].map(p=>pr(...p));
  const xs = cs.map(c=>c[0]), ys = cs.map(c=>c[1]);
  const pad = o.pad==null?40:o.pad;
  const vb = [Math.min(...xs)-pad, Math.min(...ys)-pad, Math.max(...xs)-Math.min(...xs)+pad*2, Math.max(...ys)-Math.min(...ys)+pad*2];
  const mode = o.fit||'meet';
  const f = fitter(vb, W, H, mode);
  return {svg:`<svg viewBox="${vb.map(v=>v.toFixed(1)).join(' ')}" preserveAspectRatio="xMidYMid ${mode}">${s}</svg>`, at:(x,y,z=0)=>f(...pr(x,y,z))};
}

/* ---------- plan: drafting sheet ---------- */
function plan(o){
  const W=o.w, H=o.h, F = furniture(o.state), hc = o.holdC;
  let s = `<defs><pattern id="g${o.uid}" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#DCE4EA" stroke-width="1.2"/></pattern><pattern id="h${o.uid}" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V14" stroke="#9FB1BE" stroke-width="2"/></pattern></defs>`;
  s += `<rect x="-2000" y="-2000" width="5000" height="5000" fill="#F2F5F7"/><rect x="-2000" y="-2000" width="5000" height="5000" fill="url(#g${o.uid})"/>`;
  s += `<rect x="${BALC[0]}" y="${BALC[1]}" width="${BALC[2]}" height="${BALC[3]}" fill="url(#h${o.uid})" stroke="#46596A" stroke-width="3"/>`;
  ROOMS.forEach(([id,,x,y,w,d]) => s += `<rect x="${x}" y="${y}" width="${w}" height="${d}" fill="${id==='bath'?'#E6ECF0':'#FFFFFF'}"/>`);
  if (o.ghost){ const g=o.ghost; s += `<rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.d}" fill="none" stroke="${hc}" stroke-width="3" stroke-dasharray="10 8"/>`; }
  F.forEach(f => {
    const held = o.hold===f.id, other = o.held2===f.id;
    const stc = held?hc:other?o.held2C:'#0F2233', fill = held?`color-mix(in srgb, ${hc} 14%, #fff)`:other?`color-mix(in srgb, ${o.held2C} 14%, #fff)`:'#F7F9FA';
    if (f.k==='rug'){ s += `<rect x="${f.x}" y="${f.y}" width="${f.w}" height="${f.d}" fill="none" stroke="#9FB1BE" stroke-width="2" stroke-dasharray="4 6"/>`; return; }
    if (held||other) s += `<rect x="${f.x-16}" y="${f.y-16}" width="${f.w+32}" height="${f.d+32}" fill="${stc}" fill-opacity=".12" stroke="${stc}" stroke-width="4"/>`;
    s += `<rect x="${f.x}" y="${f.y}" width="${f.w}" height="${f.d}" fill="${fill}" stroke="${stc}" stroke-width="${held?4:2.5}"/>`;
    if (f.k==='sofa'){ s += f.w<f.d ? `<path d="M${f.x+24} ${f.y}V${f.y+f.d}M${f.x+24} ${f.y+f.d/2}H${f.x+f.w}" stroke="${stc}" stroke-width="2" fill="none"/>` : `<path d="M${f.x} ${f.y+24}H${f.x+f.w}M${f.x+f.w/2} ${f.y+24}V${f.y+f.d}" stroke="${stc}" stroke-width="2" fill="none"/>`; }
    if (f.k==='bed'){ s += `<rect x="${f.x+12}" y="${f.y+10}" width="${f.w/2-18}" height="36" fill="#fff" stroke="${stc}" stroke-width="2"/><rect x="${f.x+f.w/2+6}" y="${f.y+10}" width="${f.w/2-18}" height="36" fill="#fff" stroke="${stc}" stroke-width="2"/><path d="M${f.x} ${f.y+62}H${f.x+f.w}" stroke="${stc}" stroke-width="2"/>`; }
    if (held){ const cx=f.x+f.w/2; s += `<path d="M${cx} ${f.y-16}V${f.y-56}" stroke="${hc}" stroke-width="3"/><circle cx="${cx}" cy="${f.y-66}" r="11" fill="#fff" stroke="${hc}" stroke-width="4"/>`; }
  });
  WALLS.forEach(([x1,y1,x2,y2,t]) => s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#0F2233" stroke-width="${t}" stroke-linecap="square"/>`);
  s += `<line x1="120" y1="0" x2="520" y2="0" stroke="#1F5FA8" stroke-width="5"/>`;
  // door swings
  [[700,480,90,1],[680,620,80,0],[900,620,80,0],[1180,620,80,0],[1060,500,90,2],[480,960,90,3]].forEach(([x,y,r,k])=>{

function fit(){
  if (SHOT) return;
  document.querySelectorAll('.wrap').forEach(w => {
    const b = w.querySelector('.board'); const s = Math.min(1, w.clientWidth/1760);
    b.style.transform = `scale(${s})`; b.style.transformOrigin = 'top right'; w.style.height = (1240*s)+'px';

}
fit(); addEventListener('resize', fit);
