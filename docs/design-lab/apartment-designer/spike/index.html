<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ניסוי מעצב הדירה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Hebrew:wght@400;600;700&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
/* HAD-703 spike. Identity: the architect's working drawing. Drafting film white, plan ink navy, blueprint blue = what you
   hold or may move, dimension red = every measurement. Faces: IBM Plex Sans Hebrew + IBM Plex Mono (drawing lettering).
   Deliberately not the default look: no cream, no gold, no gradient, no rounded shadow cards, no emoji. */
:root{--sheet:#F2F5F7;--grid:#DCE4E9;--ink:#0F2233;--ink2:#46596A;--blue:#1F5FA8;--blue2:#D6E5F6;--dim:#B5302A;--line:#B9C6CF;--card:#fff;--ok:#1C7A4E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--sheet)}
body{font-family:"IBM Plex Sans Hebrew",Arial,sans-serif;color:var(--ink);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.mono{font-family:"IBM Plex Mono",monospace;direction:ltr;unicode-bidi:isolate}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,var(--split,42%)) 14px minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:2px solid var(--ink);background:var(--card)}
header h1{font-size:15px;font-weight:700;line-height:1.15}
header p{font-size:11.5px;color:var(--ink2);white-space:nowrap}
header>div{min-width:0}
header .sp{flex:1}
.hb{min-width:44px;min-height:44px;border:2px solid var(--ink);padding:0 8px;font-weight:600;font-size:13px;background:var(--card)}
.hb:disabled{opacity:.35}
.space{position:relative;background:#E6ECF0;overflow:hidden}
.space canvas{display:block;width:100%;height:100%;touch-action:none}
.chips{position:absolute;top:8px;right:8px;display:flex;border:2px solid var(--ink);background:var(--card)}
.chips button{min-height:40px;padding:0 12px;font-size:13px;font-weight:600}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff}
.lat{position:absolute;top:8px;left:8px;background:rgba(15,34,51,.86);color:#fff;font-size:11px;padding:4px 7px;line-height:1.35;border:0;min-height:40px;cursor:pointer}
.bench{position:fixed;inset:60px 10px auto 10px;z-index:20;background:#0F2233;color:#fff;border:2px solid #fff;padding:12px}
.bench[hidden]{display:none}
.bench h2{font-size:15px;margin-bottom:6px}.bench pre{font:12px/1.5 "IBM Plex Mono",monospace;white-space:pre-wrap;direction:ltr;text-align:left;unicode-bidi:isolate}
.bench button{margin-top:10px;min-height:44px;width:100%;border:1.5px solid #fff;color:#fff;font-weight:700}
.note{position:absolute;bottom:6px;right:8px;left:8px;font-size:11px;color:var(--ink2);text-align:center;pointer-events:none}
.bar{background:var(--ink);cursor:row-resize;touch-action:none;display:flex;align-items:center;justify-content:center}
.bar i{width:44px;height:3px;background:#fff;opacity:.8}
.plan{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr);background-color:var(--sheet);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;overflow:hidden}
.nd-plan{width:100%;height:100%;min-height:0;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.room{stroke:none;cursor:pointer}.room.on{fill:var(--blue2)!important;fill-opacity:1}
.wall{fill:var(--ink);stroke:var(--ink);stroke-width:1}
.wall.mamad{fill:url(#nd-mamad)}
.wall.partition{fill:#fff;stroke:var(--ink);stroke-width:3}
.wall.partition.free{stroke:var(--blue);fill:var(--blue2)}
.wall.partition.on{fill:var(--blue2);stroke:var(--blue);stroke-width:5}
.wall.rail{fill:#9FB2C0;stroke:none}
.wall.divider{stroke:var(--ink2);stroke-width:3;stroke-dasharray:14 12;fill:none}
.gap{fill:var(--sheet);stroke:none}
.door{fill:none;stroke:var(--ink);stroke-width:3}
.glass{stroke:var(--blue);stroke-width:7}.glass.wide{stroke-width:10}
.jamb{stroke:var(--ink);stroke-width:2}
.hit{stroke:transparent;stroke-width:46;fill:transparent;cursor:not-allowed}.hit.free{stroke-width:90;cursor:grab}
.grip rect{fill:var(--blue);stroke:#fff;stroke-width:3;cursor:grab}.grip path{stroke:#fff;stroke-width:3;fill:none;pointer-events:none}
.rl,.ra,.rd{paint-order:stroke;stroke:#F2F5F7;stroke-width:9px;stroke-linejoin:round;stroke-opacity:.9}
.rl{font:700 44px "IBM Plex Sans Hebrew";fill:var(--ink);text-anchor:middle;pointer-events:none}
.ra{font:500 39px "IBM Plex Sans Hebrew";fill:var(--ink2);text-anchor:middle;pointer-events:none}
.rl.s{font-size:40px}.ra.s{font-size:36px}
.rd{font:600 34px "IBM Plex Mono";fill:var(--dim);text-anchor:middle;pointer-events:none;direction:ltr;unicode-bidi:isolate}
.item rect{fill:#fff;fill-opacity:.82;stroke:var(--ink2);stroke-width:2.5;cursor:grab}
.item .back{stroke:var(--ink2);stroke-width:6}
.item.rug rect{fill:none;stroke-dasharray:10 8;stroke-width:2}
.item.on rect{stroke:var(--blue);stroke-width:7;fill:var(--blue2)}
.cam .dot{fill:var(--dim);stroke:#fff;stroke-width:5}.cam .cone{fill:rgba(181,48,42,.16);stroke:var(--dim);stroke-width:2.5;stroke-dasharray:9 7}
.cam .hit{cursor:default;pointer-events:none}.cam.walk .hit{pointer-events:auto;cursor:grab}
.hint{font-size:12px;color:var(--ink2);text-align:center;padding:3px 8px 0;background:var(--sheet)}
nav{display:flex;border-top:2px solid var(--ink);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:54px;font-weight:600;font-size:14px;border-inline-start:1px solid var(--line)}
nav button:first-child{border:0}
nav button[aria-expanded=true]{background:var(--ink);color:#fff}
.sheet{position:fixed;inset-inline:0;bottom:calc(56px + env(safe-area-inset-bottom));max-height:46dvh;overflow:auto;background:var(--card);border-top:2px solid var(--ink);padding:10px 12px 14px;z-index:5}
.sheet[hidden]{display:none}
.sheet h2{font-size:13px;color:var(--ink2);font-weight:600;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{border:2px solid var(--ink);min-height:48px;padding:6px 10px;text-align:right;display:flex;flex-direction:column;justify-content:center}
.opt small{color:var(--ink2);font-size:11px}
.opt[aria-pressed=true]{background:var(--blue2);border-color:var(--blue)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border:1.5px solid currentColor}
.tag.base{color:var(--ok)}.tag.upgrade{color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
td.n,th.n{text-align:left}
.selbar{position:fixed;inset-inline:8px;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;background:var(--ink);color:#fff;padding:6px 8px 6px 10px;z-index:4}
.selbar[hidden]{display:none}
.selbar b{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selbar button{min-height:40px;padding:0 12px;border:1.5px solid #fff;font-size:13px;font-weight:600}
.toast{position:fixed;inset-inline:10px;top:62px;background:var(--dim);color:#fff;padding:10px 12px;font-weight:600;font-size:14px;z-index:9;border:2px solid #fff}
.toast[hidden]{display:none}
@media (min-width:900px){
  .app{grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1.25fr) 14px minmax(0,1fr)}
  header,nav{grid-column:1/-1}
  .bar{cursor:col-resize}.bar i{width:3px;height:44px}
  .sheet{inset-inline:auto 16px;width:420px}.selbar{inset-inline:auto 16px;width:420px}.toast{inset-inline:auto 16px;width:420px}
  .rl{font-size:30px}.ra{font-size:25px}.rl.s{font-size:26px}.ra.s{font-size:22px}.rd{font-size:24px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div><h1>מעצבים את הדירה</h1><p><span id="sub">דירה לדוגמה</span></p></div>
    <span class="sp"></span>
    <button class="hb" id="undo" disabled>בטל</button>
    <button class="hb" id="redo" disabled>החזר</button>
  </header>
  <section class="space" id="space" aria-label="הדירה בתלת ממד">
    <div class="chips" role="group" aria-label="סוג המבט">
      <button id="m-doll" aria-pressed="true">מלמעלה</button><button id="m-walk" aria-pressed="false">הליכה בדירה</button>
    </div>
    <button class="lat mono" id="lat" aria-label="מדידת מהירות במכשיר הזה">מדידה · 2D→3D — ms</button>
    <p class="note" id="snote">הדמיה להמחשה. דירה לדוגמה, לא תוכנית של פרויקט.</p>
  </section>
  <div class="bar" id="bar" role="separator" aria-label="שינוי גודל בין התלת ממד לתוכנית" tabindex="0"><i></i></div>
  <section class="plan" id="plan" aria-label="תוכנית הדירה"><p class="hint" id="hint">גררו רהיט או מחיצה כחולה. התלת ממד מתעדכן מיד.</p></section>
  <nav aria-label="כלים">
    <button data-sheet="items" aria-expanded="false">רהיטים</button>
    <button data-sheet="floor" aria-expanded="false">ריצוף</button>
    <button data-sheet="boq" aria-expanded="false">כתב כמויות</button>
  </nav>
</div>
<div class="sheet" id="sheet" hidden></div>
<div class="selbar" id="selbar" hidden><b id="selname"></b><button id="rot">סיבוב</button><button id="del">הסרה</button></div>
<div class="toast" id="toast" role="alert" hidden></div>
<div class="bench" id="bench" role="dialog" aria-label="תוצאות המדידה" hidden><h2>מדידה במכשיר הזה. צלמו מסך ושלחו.</h2><pre></pre><button id="bench-x">סגירה</button></div>

<script type="module">
import { createStore, emptyDesign, quantities, WALL_KINDS } from './model.js';
import { mountPlan } from './plan2d.js';
import * as cat from './catalog.js';

const $ = (id) => document.getElementById(id);
const apt = await (await fetch('./example-4r.json')).json();
const design = emptyDesign(apt); design.items = cat.STARTER.map((i) => ({ ...i }));
const store = createStore(apt, design);
let sel = null, sheet = null, space = null;
const lat = [], work_ms = []; // lat: change to frame shown (includes waiting for the display); work_ms: the CPU work only

const select = (s) => { sel = s; plan.setSelection(s); space && space.setSelection(s); paintSel(); if (s && s.type === 'room' && sheet !== 'floor') open('floor'); else if (sheet) open(sheet, true); };
const plan = mountPlan($('plan'), store, cat, {
  select, blocked: (r) => toast(r.reason),
  camMove: (p) => space && space.walkTo(p),
});
const tPlan = performance.now();
const { mountSpace } = await import('./space3d.js');
space = mountSpace($('space'), store, cat, {
  select,
  camera: (v) => plan.setCamera(v),
  frame: (dt, rms) => { const work = store.lastApplyMs + rms; lat.push(dt); work_ms.push(work); if (lat.length > 400) { lat.shift(); work_ms.shift(); } $('lat').textContent = 'מדידה · 2D→3D ' + work.toFixed(1) + ' ms'; },
});
const tSpace = performance.now();

function paintSel() {
  const it = sel && sel.type === 'item' && store.item(sel.id);
  $('selbar').hidden = !it;
  if (it) $('selname').textContent = cat.ITEMS[it.sku].he;
  $('hint').textContent = sel && sel.type === 'wall' ? WALL_KINDS[store.derived.wallBy[sel.id].kind].he + (store.slides(sel.id) ? ': גררו כדי להזיז' : ': קבוע') : space && space.mode === 'walk' ? 'געו ברצפה כדי ללכת. גררו את הנקודה האדומה בתוכנית.' : 'גררו רהיט או מחיצה כחולה. התלת ממד מתעדכן מיד.';
}
let toastT = 0;
function toast(msg) { $('toast').textContent = msg; $('toast').hidden = false; clearTimeout(toastT); toastT = setTimeout(() => ($('toast').hidden = true), 3200); }
function head() {
  const q = quantities(store);
  $('sub').textContent = 'דירה לדוגמה · ' + apt.unit.rooms + ' חדרים · ' + q.net.toFixed(1) + ' מ״ר + מרפסת ' + q.balcony.toFixed(1) + ' מ״ר';
  $('undo').disabled = !store.canUndo(); $('redo').disabled = !store.canRedo();
}

function open(name, keep) {
  if (sheet === name && !keep) name = null;
  sheet = name;
  document.querySelectorAll('nav button').forEach((b) => b.setAttribute('aria-expanded', b.dataset.sheet === name));
  const el = $('sheet'); el.hidden = !name; el.textContent = '';
  if (!name) return;
  const h = document.createElement('h2'); el.appendChild(h);
  if (name === 'items') {
    h.textContent = 'רהיטים בגודל אמיתי. בחרו, והרהיט יופיע בסלון.';
    const g = document.createElement('div'); g.className = 'grid'; el.appendChild(g);
    for (const sku in cat.ITEMS) {
      const c = cat.ITEMS[sku], b = document.createElement('button'); b.className = 'opt';
      b.innerHTML = '<span>' + c.he + '</span><small class="mono">' + c.w + '×' + c.d + ' cm</small>';
      b.onclick = () => { const id = 'i' + Date.now().toString(36); const at = sel && sel.type === 'room' && store.derived.faceBy[sel.id] ? store.derived.faceBy[sel.id].bb : store.derived.faceBy.living.bb; const r = store.apply({ op: 'item.add', item: { id, sku, x: Math.round((at.x0 + at.x1) / 2), y: Math.round((at.y0 + at.y1) / 2), rot: 0, status: 'decor' } }); if (r.ok) { open(null); select({ type: 'item', id }); } };
      g.appendChild(b);
    }
  }
  if (name === 'floor') {
    const room = sel && sel.type === 'room' ? store.derived.faceBy[sel.id] : null;
    h.textContent = room ? 'ריצוף: ' + room.room.name_he + ' · ' + room.net.toFixed(1) + ' מ״ר' : 'געו בחדר בתוכנית או בתלת ממד, ואז בחרו ריצוף.';
    if (!room) return;
    const g = document.createElement('div'); g.className = 'grid'; el.appendChild(g);
    for (const key of cat.FLOOR_CHOICES) {
      const f = cat.FINISHES[key], b = document.createElement('button'); b.className = 'opt'; b.setAttribute('aria-pressed', store.floorOf(room.id) === key);
      b.innerHTML = '<span>' + f.he + '</span><small><span class="tag ' + f.status + '">' + (f.status === 'base' ? 'כלול במפרט לדוגמה' : 'שינוי מהמפרט') + '</span></small>';
      b.onclick = () => store.apply({ op: 'finish.set', key: 'floor:' + room.id, value: key === room.room.floor ? null : key });
      g.appendChild(b);
    }
  }
  if (name === 'boq') {
    const q = quantities(store);
    h.textContent = 'כתב כמויות: מחושב מאותה תוכנית, מתעדכן עם כל שינוי.';
    let html = '<table><thead><tr><th>ריצוף</th><th class="n">שטח</th></tr></thead><tbody>';
    for (const k in q.floors) html += '<tr><td>' + cat.FINISHES[k].he + ' <span class="tag ' + cat.FINISHES[k].status + '">' + (cat.FINISHES[k].status === 'base' ? 'מפרט' : 'שינוי') + '</span></td><td class="n mono">' + q.floors[k].toFixed(1) + ' m²</td></tr>';
    html += '</tbody></table><table style="margin-top:10px"><thead><tr><th>חדר</th><th class="n">מידות נטו</th><th class="n">שטח</th></tr></thead><tbody>';
    for (const r of q.rooms) html += '<tr><td>' + r.name + '</td><td class="n mono">' + r.w + '×' + r.d + '</td><td class="n mono">' + r.net.toFixed(1) + '</td></tr>';
    html += '</tbody></table><table style="margin-top:10px"><thead><tr><th>רהיטים להמחשה (לא כלולים)</th><th class="n">כמות</th></tr></thead><tbody>';
    for (const k in q.items) html += '<tr><td>' + cat.ITEMS[k].he + '</td><td class="n mono">' + q.items[k] + '</td></tr>';
    html += '</tbody></table><p style="font-size:12px;color:var(--ink2);margin-top:10px">שטחים בקירוב, נמדדים בין הקירות. מחירים יופיעו רק עם מקור, תאריך ומע״מ.</p>';
    el.insertAdjacentHTML('beforeend', html);
  }
}
document.querySelectorAll('nav button').forEach((b) => (b.onclick = () => open(b.dataset.sheet)));
$('undo').onclick = () => store.undo(); $('redo').onclick = () => store.redo();
$('rot').onclick = () => { const it = sel && store.item(sel.id); if (it) store.apply({ op: 'item.rot', id: it.id, rot: it.rot + 90 }); };
$('del').onclick = () => { if (sel) { store.apply({ op: 'item.remove', id: sel.id }); select(null); } };
const setMode = (m) => { space.setMode(m); $('m-doll').setAttribute('aria-pressed', m === 'doll'); $('m-walk').setAttribute('aria-pressed', m === 'walk'); paintSel(); };
$('m-doll').onclick = () => setMode('doll'); $('m-walk').onclick = () => setMode('walk');
store.on((e) => { if (e.type === 'change') { head(); if (sheet) open(sheet, true); } });

// the divider between the two views: drag it, or use the arrow keys
const wide = () => matchMedia('(min-width:900px)').matches;
let barDrag = false;
const setSplit = (pct) => { const v = Math.max(25, Math.min(75, pct)); if (wide()) $('app').style.gridTemplateColumns = 'minmax(0,' + v + 'fr) 14px minmax(0,' + (100 - v) + 'fr)'; else $('app').style.setProperty('--split', v + '%'); };
$('bar').addEventListener('pointerdown', (ev) => { barDrag = true; try { $('bar').setPointerCapture(ev.pointerId); } catch (e) { /* synthetic pointer */ } });
$('bar').addEventListener('pointermove', (ev) => { if (!barDrag) return; const r = $('app').getBoundingClientRect(); setSplit(wide() ? ((r.right - ev.clientX) / r.width) * 100 : ((ev.clientY - r.top - 60) / (r.height - 120)) * 100); });
$('bar').addEventListener('pointerup', () => (barDrag = false));
$('bar').addEventListener('keydown', (ev) => { const cur = parseFloat(getComputedStyle($('app')).getPropertyValue('--split')) || 54; if (ev.key === 'ArrowUp') setSplit(cur - 5); if (ev.key === 'ArrowDown') setSplit(cur + 5); });

head(); paintSel();

// ---- the measurement a person runs on their own phone: tap the dark readout on the 3D view ----
const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s.length ? s[Math.min(s.length - 1, Math.floor(s.length * p))] : 0; };
async function measure() {
  const box = $('bench'); box.hidden = false; box.querySelector('pre').textContent = 'מודד, כ-8 שניות...';
  if (space.mode !== 'doll') setMode('doll');
  const frame = () => new Promise((r) => requestAnimationFrame(r));
  lat.length = 0; work_ms.length = 0;
  const it = store.item('i2'), x0 = it.x, y0 = it.y;
  for (let i = 0; i < 120; i++) { store.apply({ op: 'item.move', id: 'i2', x: x0 + (i % 40), y: y0 + (i % 25) }, { gesture: 'bench' }); await frame(); }
  store.apply({ op: 'item.move', id: 'i2', x: x0, y: y0 }, { gesture: 'bench' }); await frame();
  const wall = [];
  for (let i = 0; i < 24; i++) { const t = performance.now(); store.apply({ op: 'wall.shift', id: 'p6', d: (i % 8) * 5 }, { gesture: 'benchw' }); wall.push(performance.now() - t); await frame(); }
  store.apply({ op: 'wall.shift', id: 'p6', d: 0 }, { gesture: 'benchw' });
  const spin = await space.spin(4000);
  const nav = performance.getEntriesByType('resource'), kb = Math.round(nav.reduce((a, r) => a + (r.transferSize || 0), 0) / 1024);
  const gap = q(spin.gaps, 0.5), st = space.stats();
  const out = {
    when: new Date().toISOString().slice(0, 16).replace('T', ' '),
    screen: innerWidth + 'x' + innerHeight + ' @' + (window.devicePixelRatio || 1).toFixed(2),
    gpu: space.gl(),
    plan_drawn_s: (__nd.timings.plan_ms / 1000).toFixed(2),
    first_3d_frame_s: (__nd.timings.first_3d_frame_ms / 1000).toFixed(2),
    downloaded: nav.length + 1 + ' files, ' + kb + ' KB (0 = from cache)',
    change_work_ms: 'p50 ' + q(work_ms, 0.5).toFixed(1) + ' / p95 ' + q(work_ms, 0.95).toFixed(1),
    wall_move_ms: 'p50 ' + q(wall, 0.5).toFixed(1) + ' / p95 ' + q(wall, 0.95).toFixed(1),
    frames_per_second: gap ? (1000 / gap).toFixed(0) + ' (slowest 5%: ' + (1000 / q(spin.gaps, 0.95)).toFixed(0) + ')' : 'n/a',
    render_work_ms: 'p50 ' + q(spin.renders, 0.5).toFixed(1) + ' / p95 ' + q(spin.renders, 0.95).toFixed(1),
    draw_calls: st.calls, ua: navigator.userAgent.replace(/^Mozilla\/5\.0 /, '').slice(0, 90),
  };
  window.__nd.bench = out;
  box.querySelector('pre').textContent = Object.entries(out).map(([k, v]) => k + ': ' + v).join('\n');
}
$('lat').addEventListener('click', measure);
