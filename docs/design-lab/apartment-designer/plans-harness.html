<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>בדיקת תוכניות המעצב</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
html,body{margin:0;height:100%;background:#F2F5F7}
#d{position:fixed;inset:0}
</style>
</head>
<body>
<!-- Local check page (HAD-701/HAD-708): opens the designer module on one plan file. ?plan=ashira/E-4A.json (relative to the
     plugin's designer/plans folder). Serve the repo root: python -m http.server 47961 --bind 127.0.0.1 -->
<div id="d"></div>
<script type="module">
import { mount } from '../../../plugins/nadlan-config/assets/designer/designer.js';
const q = new URLSearchParams(location.search);
const plan = (q.get('plan') || 'example-4r.json').replace(/[^A-Za-z0-9._/-]/g, '');
window.__d = await mount(document.getElementById('d'), {
  planUrl: '../../../plugins/nadlan-config/assets/designer/plans/' + plan,
  lang: q.get('lang') || 'he', save: false, models: q.get('models') !== '0',
});
await window.__d.ready3d;
window.__ready = true;
</script>
</body>
</html>
