<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>הצטרפות בעל מקצוע</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F6F86}a:hover{color:#1F4B5C}
button,input{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 1240px; box-sizing: border-box; background: #F2F4F5; color: #101820; font-family: Assistant, 'Segoe UI', Arial, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <header style="background: #101820; color: #FFFFFF; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; color: #C9D3DA; font-weight: 700">הצטרפות · צעד 1 מתוך 2</span>
    <h1 style="margin: 0; font-family: Rubik, Arial, sans-serif; font-weight: 800; font-size: 24px; line-height: 1.2">קבלו בקשות מהאזור שלכם</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #DCE3E8">חינם. אתם בוחרים מה מוצג עליכם, ואפשר לעזוב בלחיצה.</p>
    <div aria-hidden="true" style="height: 4px; background: #3A4650; border-radius: 2px"><div style="width: 50%; height: 4px; background: #FF5C93; border-radius: 2px"></div></div>
  </header>

  <main style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 14px; flex-grow: 1">

    <section style="display: flex; flex-direction: column; gap: 8px">
      <label for="trade" style="font-family: Rubik, Arial, sans-serif; font-weight: 700; font-size: 17px">מה המקצוע שלכם?</label>
      <input id="trade" type="text" value="קרקע" style="height: 52px; border-radius: 12px; border: 2px solid #2F6F86; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #101820">
      <div style="background: #FFFFFF; border: 1px solid #D5DBDF; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column">
        <button style="min-height: 48px; border: 0; border-bottom: 1px solid #D5DBDF; background: #EAF4EF; text-align: right; padding: 0 14px; font-size: 16px; font-weight: 700; color: #1B4D33">✓ יועץ קרקע וביסוס <span style="font-weight: 400; color: #3A4650; font-size: 13px">· תכנון ובנייה</span></button>
        <button style="min-height: 48px; border: 0; border-bottom: 1px solid #D5DBDF; background: #FFFFFF; text-align: right; padding: 0 14px; font-size: 16px; color: #101820">מעבדת קרקע ובדיקות חומרים</button>
        <button style="min-height: 48px; border: 0; background: #FFFFFF; text-align: right; padding: 0 14px; font-size: 16px; color: #101820">קבלן עבודות עפר וקידוחים</button>
      </div>
      <span style="font-size: 13px; color: #3A4650">יותר מ-70 מקצועות, מתכנון ועד מסירת מפתח. לא מצאתם? כתבו אותו.</span>
    </section>

    <section style="display: flex; flex-direction: column; gap: 6px">
      <label for="lic" style="font-family: Rubik, Arial, sans-serif; font-weight: 700; font-size: 17px">מספר רישיון או רישום <span style="font-weight: 400; font-size: 14px; color: #3A4650">(אם יש)</span></label>
      <input id="lic" type="text" inputmode="numeric" dir="ltr" value="21841" style="height: 52px; border-radius: 12px; border: 1px solid #AAB4BC; background: #FFFFFF; padding: 0 14px; font-size: 16px; text-align: left; color: #101820">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #1B4D33; font-weight: 700"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1B4D33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"></path></svg>נמצא בפנקס הקבלנים. תקבלו סימון "מאומת".</span>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #D5DBDF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0 0 6px; font-family: Rubik, Arial, sans-serif; font-weight: 700; font-size: 17px">איך יפנו אליכם</h2>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 48px"><span style="flex-grow: 1; font-size: 15px; font-weight: 700">הודעה דרך הפורום</span><input type="checkbox" checked disabled aria-label="הודעה דרך הפורום, תמיד פעיל" style="width: 24px; height: 24px; accent-color: #2F6F86; margin: 0"></label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-top: 1px solid #D5DBDF"><span style="flex-grow: 1; font-size: 15px; font-weight: 700">שיחת וידאו בלחיצה</span><input type="checkbox" checked style="width: 24px; height: 24px; accent-color: #2F6F86; margin: 0"></label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-top: 1px solid #D5DBDF"><span style="flex-grow: 1; font-size: 15px; font-weight: 700">וואטסאפ וטלפון גלויים</span><input type="checkbox" style="width: 24px; height: 24px; accent-color: #2F6F86; margin: 0"></label>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-family: Rubik, Arial, sans-serif; font-weight: 700; font-size: 17px">בקשות מאילו אזורים?</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button aria-pressed="true" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 0; background: #101820; color: #FFFFFF; font-size: 14px; font-weight: 700">גוש דן</button>
        <button aria-pressed="true" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 0; background: #101820; color: #FFFFFF; font-size: 14px; font-weight: 700">השרון</button>
        <button style="height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #D5DBDF; background: #FFFFFF; color: #101820; font-size: 14px">ירושלים</button>
        <button style="height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #D5DBDF; background: #FFFFFF; color: #101820; font-size: 14px">חיפה והקריות</button>
        <button style="height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #D5DBDF; background: #FFFFFF; color: #101820; font-size: 14px">כל הארץ</button>
      </div>
    </section>

    <a href="Profile.dc.html" style="height: 56px; border-radius: 14px; background: #B0144F; color: #FFFFFF; text-decoration: none; font-family: Rubik, Arial, sans-serif; font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center">המשך</a>
  </main>
  <span style="position: absolute; top: 1px; left: 8px; line-height: 12px; font-size: 10px; color: #DCE3E8">דוגמה לעיצוב</span>
  <div style="height: 16px"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
