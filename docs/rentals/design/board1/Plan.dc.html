var layer = this.props.layer || 'all';
var cb = this.props.pick;
var PARTS = [
['acLiving', 'מזגן סלון', 30, 30, ['e', 'ac'], 'soon'],
['shutter', 'תריס סלון', 100, 30, ['e'], 'ok'],
['cooktop', 'כיריים ותנור', 218, 30, ['g', 'e'], 'ok'],

['sink', 'כיור וברז ראשי', 264, 126, ['w'], 'ok'],

['mamad', 'דלת וחלון הממ"ד', 156, 230, [], 'ok'],

['boiler', 'דוד שמש', 306, 226, ['w', 'e'], 'fault'],
['washer', 'מכונת כביסה', 306, 298, ['w', 'e'], 'ok']
];

var out = {};
var tags = [];
PARTS.forEach(function (p) {
var id = p[0], isSel = sel === id, inLayer = layer === 'all' || p[4].indexOf(layer) >= 0 || isSel;
var border = p[5] === 'fault' ? '2.5px solid #a11616' : (p[5] === 'soon' ? '2px solid #14212b' : '1.5px solid #5b6b7a');
var dyn = 'opacity:' + (inLayer ? 1 : 0.3) + '; background-color:' + (isSel ? '#2f6f86' : '#ffffff') + '; color:' + (isSel ? '#ffffff' : '#14212b') +
'; border:' + (isSel ? '2px solid #1f4b5c' : border) + '; transform:scale(' + (isSel ? 1.12 : 1) + '); box-shadow:' + (isSel ? '0 0 0 5px rgba(47,111,134,.22)' : 'none') + '; z-index:' + (isSel ? 3 : 2);
out[id] = { dyn: dyn, aria: p[1] + ', ' + LABEL[p[5]], pick: function () { if (cb) { cb(id); } } };
if (p[5] !== 'ok' || isSel) {
var left = Math.max(0, Math.min(258, p[2] - 42));
var bg = isSel ? '#1f4b5c' : (p[5] === 'fault' ? '#a11616' : '#ffffff');
var fg = (isSel || p[5] === 'fault') ? '#ffffff' : '#14212b';
tags.push({ text: p[1], st: 'position:absolute; left:' + left + 'px; top:' + (p[3] + 25) + 'px; width:84px; height:17px; line-height:17px; text-align:center; font-size:11px; font-weight:600; border-radius:9px; direction:rtl; white-space:nowrap; overflow:hidden; z-index:4; background:' + bg + '; color:' + fg + '; border:' + ((isSel || p[5] === 'fault') ? '0' : '1px solid #14212b') + '; box-sizing:border-box; opacity:' + (inLayer ? 1 : 0.3) });
}
});
var SEG = [
['w', '#1565c0', 255, 126, 3, 66, 0], ['w', '#1565c0', 228, 191, 89, 3, 0], ['w', '#1565c0', 227, 192, 3, 38, 0], ['w', '#1565c0', 313, 192, 3, 106, 0],
['w', '#c62828', 297, 226, 0, 44, 1], ['w', '#c62828', 244, 270, 56, 0, 1], ['w', '#c62828', 243, 230, 0, 40, 1], ['w', '#c62828', 275, 126, 0, 144, 1],
['g', '#f5b800', 268, 0, 4, 44, 0], ['g', '#f5b800', 236, 42, 36, 4, 0],
['e', '#6a3fc8', 30, 170, 292, 2, 0], ['e', '#6a3fc8', 29, 30, 2, 200, 0], ['e', '#6a3fc8', 99, 30, 2, 141, 0], ['e', '#6a3fc8', 205, 30, 2, 141, 0], ['e', '#6a3fc8', 321, 30, 2, 268, 0]
];
var lines = SEG.map(function (s) {
var on = layer === 'all' ? 0.55 : (s[0] === layer ? 1 : 0.06);
var box = s[6] ? ('width:' + s[4] + 'px; height:' + s[5] + 'px; ' + (s[4] === 0 ? 'border-left:3px dashed ' + s[1] : 'border-top:3px dashed ' + s[1])) : ('width:' + s[4] + 'px; height:' + s[5] + 'px; background:' + s[1]);
return { st: 'position:absolute; left:' + s[2] + 'px; top:' + s[3] + 'px; ' + box + '; opacity:' + on + '; transition:opacity .16s linear; z-index:1' };
});
out.lines = lines;

return out;
}
