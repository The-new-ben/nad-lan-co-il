<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
      <title id="title">תל אביב מתכננת</title><desc id="desc">איור קונספטואלי מקורי. אינו מפה או תכנית סטטוטורית.</desc><defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f4f8"/><stop offset="1" stop-color="#f3efe6"/></linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="15" flood-opacity=".14"/></filter>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#14213d" stroke-opacity=".06"/></pattern>
    </defs>
      <rect width="1600" height="900" fill="url(#sky)"/><circle cx="1430" cy="120" r="70" fill="#f4d35e" opacity=".8"/>
      <rect x="130" y="230" width="1340" height="520" rx="42" fill="url(#grid)" stroke="#14213d" stroke-opacity=".08"/><g filter="url(#shadow)"><rect x="205" y="350" width="155" height="320" rx="18" fill="#e76f51"/><rect x="455" y="280" width="155" height="390" rx="18" fill="#ffffff"/><rect x="705" y="210" width="155" height="460" rx="18" fill="#e76f51"/><rect x="955" y="350" width="155" height="320" rx="18" fill="#ffffff"/><rect x="1205" y="280" width="155" height="390" rx="18" fill="#e76f51"/></g><path d="M125 720 C380 560 630 800 860 650 C1080 510 1290 670 1480 550" fill="none" stroke="#2a9d8f" stroke-width="25" stroke-linecap="round"/>
      <rect x="70" y="55" width="760" height="122" rx="24" fill="#ffffff" opacity=".94"/>
      <text x="105" y="108" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#14213d" direction="rtl" unicode-bidi="bidi-override">תל אביב מתכננת</text>
      <text x="105" y="148" font-family="Arial, sans-serif" font-size="23" fill="#5f6b7a" direction="rtl" unicode-bidi="bidi-override">עיר אחת, תהליכי תכנון בקצבים שונים</text>
      <text x="1510" y="842" text-anchor="end" font-family="Arial, sans-serif" font-size="20" fill="#14213d" opacity=".7" direction="rtl" unicode-bidi="bidi-override">איור קונספטואלי, לא מסמך תכנון</text>
    </svg>