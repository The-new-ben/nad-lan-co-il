      <text x="105" y="108" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#14213d" direction="rtl" unicode-bidi="bidi-override">קירוי איילון: פארק עירוני מעל התשתית שמחלקת את העיר</text>
      <text x="105" y="148" font-family="Arial, sans-serif" font-size="23" fill="#5f6b7a" direction="rtl" unicode-bidi="bidi-override">חיבור עירוני מעל כביש, רכבת ונחל</text>
      <text x="1510" y="842" text-anchor="end" font-family="Arial, sans-serif" font-size="20" fill="#14213d" opacity=".7" direction="rtl" unicode-bidi="bidi-override">איור קונספטואלי, לא מסמך תכנון</text>
