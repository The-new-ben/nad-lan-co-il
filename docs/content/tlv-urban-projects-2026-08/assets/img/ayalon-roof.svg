<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
      <title id="title">קירוי איילון: פארק עירוני מעל התשתית שמחלקת את העיר</title><desc id="desc">איור קונספטואלי מקורי. אינו מפה או תכנית סטטוטורית.</desc><defs>
