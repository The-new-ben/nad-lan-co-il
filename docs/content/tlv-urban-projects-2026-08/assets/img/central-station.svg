<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
      <title id="title">התחנה המרכזית החדשה: לתכנן את היום שאחרי, עוד לפני שהוא מגיע</title><desc id="desc">איור קונספטואלי מקורי. אינו מפה או תכנית סטטוטורית.</desc><defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f4f8"/><stop offset="1" stop-color="#f3efe6"/></linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="15" flood-opacity=".14"/></filter>
