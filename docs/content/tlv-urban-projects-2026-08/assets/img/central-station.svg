    </defs>
      <rect width="1600" height="900" fill="url(#sky)"/><circle cx="1430" cy="120" r="70" fill="#f4d35e" opacity=".8"/>
      <path d="M215 255 H1385 V710 H215Z" fill="#fff" filter="url(#shadow)"/><path d="M215 360 H1385 M215 470 H1385 M215 580 H1385" stroke="#14213d" stroke-opacity=".16" stroke-width="18"/><g fill="#e76f51"><rect x="300" y="285" width="140" height="48" rx="24"/><rect x="525" y="285" width="140" height="48" rx="24"/><rect x="750" y="285" width="140" height="48" rx="24"/><rect x="975" y="285" width="140" height="48" rx="24"/><rect x="1200" y="285" width="140" height="48" rx="24"/></g><g fill="#2a9d8f"><rect x="320" y="620" width="160" height="58" rx="14"/><rect x="570" y="620" width="160" height="58" rx="14"/><rect x="820" y="620" width="160" height="58" rx="14"/><rect x="1070" y="620" width="160" height="58" rx="14"/></g><path d="M110 745 C390 610 610 800 840 675 C1080 545 1290 700 1510 570" fill="none" stroke="#e9c46a" stroke-width="28" stroke-linecap="round"/>
      <rect x="70" y="55" width="760" height="122" rx="24" fill="#ffffff" opacity=".94"/>
      <text x="105" y="108" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#14213d" direction="rtl" unicode-bidi="bidi-override">התחנה המרכזית החדשה: לתכנן את היום שאחרי, עוד לפני שהוא מגיע</text>
      <text x="105" y="148" font-family="Arial, sans-serif" font-size="23" fill="#5f6b7a" direction="rtl" unicode-bidi="bidi-override">פתיחת מתחם סגור לרחובות, ירק ושימושים חדשים</text>
      <text x="1510" y="842" text-anchor="end" font-family="Arial, sans-serif" font-size="20" fill="#14213d" opacity=".7" direction="rtl" unicode-bidi="bidi-override">איור קונספטואלי, לא מסמך תכנון</text>
    </svg>