<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
      <title id="title">מבני ציבור בעיר מתחדשת: מה צריך להגיע לפני המפתח לדירה</title><desc id="desc">איור קונספטואלי מקורי. אינו מפה או תכנית סטטוטורית.</desc><defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f4f8"/><stop offset="1" stop-color="#f3efe6"/></linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="15" flood-opacity=".14"/></filter>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#14213d" stroke-opacity=".06"/></pattern>
    </defs>
      <rect width="1600" height="900" fill="url(#sky)"/><circle cx="1430" cy="120" r="70" fill="#f4d35e" opacity=".8"/>
      <rect x="180" y="270" width="1240" height="470" rx="40" fill="#fff" filter="url(#shadow)"/><path d="M270 420 H1330" stroke="#e9c46a" stroke-width="46" stroke-linecap="round"/><g fill="#2a9d8f"><rect x="270" y="500" width="170" height="150" rx="25"/><rect x="520" y="500" width="170" height="150" rx="25"/><rect x="770" y="500" width="170" height="150" rx="25"/><rect x="1020" y="500" width="170" height="150" rx="25"/></g><g fill="#e76f51"><circle cx="355" cy="355" r="45"/><circle cx="605" cy="355" r="45"/><circle cx="855" cy="355" r="45"/><circle cx="1105" cy="355" r="45"/></g>
      <rect x="70" y="55" width="760" height="122" rx="24" fill="#ffffff" opacity=".94"/>
      <text x="105" y="108" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#14213d" direction="rtl" unicode-bidi="bidi-override">מבני ציבור בעיר מתחדשת: מה צריך להגיע לפני המפתח לדירה</text>
      <text x="105" y="148" font-family="Arial, sans-serif" font-size="23" fill="#5f6b7a" direction="rtl" unicode-bidi="bidi-override">בתי ספר, קהילה וספורט כרשת אחת בתוך השכונה</text>
      <text x="1510" y="842" text-anchor="end" font-family="Arial, sans-serif" font-size="20" fill="#14213d" opacity=".7" direction="rtl" unicode-bidi="bidi-override">איור קונספטואלי, לא מסמך תכנון</text>
    </svg>