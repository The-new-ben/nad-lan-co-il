<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
      <title id="title">איך קוראים תכנית עירונית בלי להתבלבל בין חזון להיתר</title><desc id="desc">איור קונספטואלי מקורי. אינו מפה או תכנית סטטוטורית.</desc><defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f4f8"/><stop offset="1" stop-color="#f3efe6"/></linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="15" flood-opacity=".14"/></filter>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#14213d" stroke-opacity=".06"/></pattern>
    </defs>
      <rect width="1600" height="900" fill="url(#sky)"/><circle cx="1430" cy="120" r="70" fill="#f4d35e" opacity=".8"/>
      <g filter="url(#shadow)"><path d="M300 600 L800 330 L1300 600 L800 870Z" fill="#dce9ef"/><path d="M300 480 L800 210 L1300 480 L800 750Z" fill="#f1d8a1" opacity=".88"/><path d="M300 360 L800 90 L1300 360 L800 630Z" fill="#8bc6b8" opacity=".86"/></g><g fill="#fff" opacity=".9"><circle cx="800" cy="210" r="38"/><circle cx="550" cy="360" r="30"/><circle cx="1050" cy="360" r="30"/><circle cx="800" cy="570" r="33"/></g>
      <rect x="70" y="55" width="760" height="122" rx="24" fill="#ffffff" opacity=".94"/>
      <text x="105" y="108" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#14213d" direction="rtl" unicode-bidi="bidi-override">איך קוראים תכנית עירונית בלי להתבלבל בין חזון להיתר</text>
      <text x="105" y="148" font-family="Arial, sans-serif" font-size="23" fill="#5f6b7a" direction="rtl" unicode-bidi="bidi-override">שכבות החלטה מן החזון ועד לעבודות בשטח</text>
      <text x="1510" y="842" text-anchor="end" font-family="Arial, sans-serif" font-size="20" fill="#14213d" opacity=".7" direction="rtl" unicode-bidi="bidi-override">איור קונספטואלי, לא מסמך תכנון</text>
    </svg>