<p><strong>הקרקע במגרש:</strong> מאז פברואר 2026 נבדקת הקרקע ברובע לחומרי PFAS, שלפי ההערכה קשורים לשנות הפעילות של שדה התעופה. מה פורסם על כל מגרש, עם הדו״חות עצמם, מרוכז ב<a href="/sde-dov/contamination/">מפת בדיקות הקרקע בשדה דב</a>. כדאי לשאול את היזם בכתב אם המגרש נבדק, ואם המשרד להגנת הסביבה אימץ את הממצאים.</p>
