<p><strong>הקרקע במגרש:</strong> מאז פברואר 2026 נבדקת ברובע הקרקע לזיהום בחומרי PFAS, שלפי החשד מקורם בשנות הפעילות של שדה התעופה. מה פורסם על כל מגרש, עם הדו״חות עצמם, מרוכז ב<a href="/sde-dov/contamination/">מפת זיהום הקרקע בשדה דב</a>. כדאי לשאול את היזם בכתב אם המגרש נדגם, ואם המשרד להגנת הסביבה אימץ את הממצאים.</p>
