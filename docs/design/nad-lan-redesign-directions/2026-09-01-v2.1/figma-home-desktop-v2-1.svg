<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc">
  <title id="title">דף הבית של nad-lan בתצוגת מחשב</title>
  <desc id="desc">דף בית של פורטל נדל״ן ישראלי עם חיפוש, תמונת SIX8 וכניסה לעמוד הפרויקט ולסיור.</desc>
  <defs>
