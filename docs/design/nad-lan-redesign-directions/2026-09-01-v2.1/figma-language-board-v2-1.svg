<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1800" viewBox="0 0 1440 1800" role="img" aria-labelledby="title desc">
  <title id="title">Nad-Lan שפה חזותית V2.1</title>
  <desc id="desc">לוח שפה עריכתי לפורטל נדל״ן ישראלי עם צילום SIX8, טיפוגרפיה עברית, חיפוש, כרטיס פרויקט, תוכנית קומה וכניסה לסיור.</desc>
