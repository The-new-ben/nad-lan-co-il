    <text x="566" y="428" text-anchor="start" class="section">הרברט סמואל, תל אביב</text>
    <text x="566" y="472" text-anchor="start" class="body">מקום, דירה והמידע שצריך לפני שפונים</text>
    <text x="566" y="510" text-anchor="start" class="caption muted">מקור תמונה: SIX8</text>
    <text x="566" y="568" text-anchor="start" font-size="38" font-weight="700">1282 × 607</text>
    <text x="566" y="598" text-anchor="start" class="small muted">נתון קצר נשאר קריא בתוך הקצב העריכתי</text>
