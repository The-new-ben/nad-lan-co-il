<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nad-Lan Premium Portal Direction</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; background: #d7d4cc; color: #171a18; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; max-width: 1500px; margin: 0 auto 24px; }
    h1 { margin: 0; font-family: Georgia, serif; font-size: 32px; font-weight: 400; }
    p { margin: 6px 0 0; color: #5e625e; }
    .proof { direction: ltr; font-size: 13px; color: #5e625e; }
    main { direction: ltr; display: grid; grid-template-columns: minmax(320px, 1fr) minmax(320px, 1fr) minmax(120px, .28fr); gap: 22px; max-width: 1500px; margin: auto; align-items: start; }
    figure { margin: 0; background: #ece9e0; border: 1px solid #b9b4a9; padding: 12px; box-shadow: 0 18px 50px rgba(23,26,24,.10); }
    figcaption { direction: rtl; display: flex; justify-content: space-between; gap: 12px; padding: 2px 2px 12px; font-weight: 700; font-size: 14px; }
    figcaption span { direction: ltr; color: #5e625e; font-weight: 400; }
    img { display: block; width: 100%; height: auto; background: #f2eee3; }
    @media (max-width: 900px) { body { padding: 16px; } header { display: block; } main { grid-template-columns: 1fr; } figure.mobile { max-width: 390px; justify-self: center; width: 100%; } }
  </style>
</head>
<body>
  <header>
    <div><h1>כיוון לפורטל נדל״ן פרימיום</h1><p>לוח שפה · דף בית למחשב · דף בית למובייל</p></div>
    <div class="proof">HE · EN · FR · RU · AR / Zero forbidden-term occurrences</div>
  </header>
  <main>
    <figure><figcaption>לוח שפה <span>1440 × 2200</span></figcaption><img src="figma-language-board.svg" alt="לוח שפה לפורטל Nad-Lan"></figure>
    <figure><figcaption>דף בית · מחשב <span>1440 × 4200</span></figcaption><img src="figma-home-desktop.svg" alt="דף בית Nad-Lan למחשב"></figure>
    <figure class="mobile"><figcaption>דף בית · מובייל <span>390 × 3800</span></figcaption><img src="figma-home-mobile.svg" alt="דף בית Nad-Lan למובייל"></figure>
  </main>
</body>
</html>
