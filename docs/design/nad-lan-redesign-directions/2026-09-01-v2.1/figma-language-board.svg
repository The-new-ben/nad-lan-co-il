  <text x="80" y="1892" class="sans muted caps ltr" font-size="12" font-weight="700">05 / PALETTE STRATEGY</text>
  <text x="1360" y="1892" text-anchor="start" class="sans ink rtl" font-size="22" font-weight="700">בחירה מערכתית ל־20 ערים</text>

