    <text x="222" y="1040" class="sans ink ltr" font-size="12" font-weight="700">PAPER</text>
    <text x="222" y="1059" class="sans muted ltr" font-size="11">#FBF9F3</text>
    <text x="364" y="1040" class="sans ink ltr" font-size="12" font-weight="700">INK</text>
    <text x="364" y="1059" class="sans muted ltr" font-size="11">#171A18</text>
    <text x="506" y="1040" class="sans ink ltr" font-size="12" font-weight="700">MUTED</text>
    <text x="506" y="1059" class="sans muted ltr" font-size="11">#5E625E</text>
    <text x="648" y="1040" class="sans ink ltr" font-size="12" font-weight="700">SURVEY RED</text>
    <text x="648" y="1059" class="sans muted ltr" font-size="11">#A44334</text>
    <text x="790" y="1040" class="sans ink ltr" font-size="12" font-weight="700">MAP BLUE</text>
    <text x="790" y="1059" class="sans muted ltr" font-size="11">#457986</text>
  </g>

  <text x="80" y="1110" class="sans muted ltr" font-size="13">85–90% cream, paper, ink and monochrome photography</text>
  <text x="80" y="1135" class="sans ink ltr" font-size="13" font-weight="700">10–15% controlled colour: capsules, selected state, map point</text>

  <rect x="960" y="906" width="400" height="260" fill="#FBF9F3" stroke="#D9D4C9"/>
