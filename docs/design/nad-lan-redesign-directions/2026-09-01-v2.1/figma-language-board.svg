  <text x="1320" y="972" text-anchor="start" class="sans muted rtl" font-size="13">צבע + סמל + טקסט; לעולם לא צבע בלבד</text>
  <rect x="1030" y="998" width="290" height="36" rx="18" fill="#D5E4E5" stroke="#234D55" stroke-opacity="0.3"/>
