  <text x="480" y="504" text-anchor="middle" class="sans ink rtl" font-size="25" font-weight="700">מקום לצילום אדריכלות אמיתי</text>
  <text x="480" y="540" text-anchor="middle" class="sans muted rtl" font-size="16">יש לשבץ צילום מאומת ומזוכה מן האתר או מן הפרויקט</text>
  <text x="480" y="568" text-anchor="middle" class="sans muted ltr" font-size="13">REAL PHOTO SLOT — NO STOCK IMAGE OR UNLABELLED RENDER</text>
  <rect x="104" y="704" width="305" height="38" rx="19" fill="#171A18"/>
  <text x="256.5" y="729" text-anchor="middle" class="sans ltr" font-size="12" fill="#F7F4EB" font-weight="700">CREDIT + SOURCE + CAPTURE DATE</text>

  <rect x="920" y="300" width="440" height="468" fill="#FBF9F3" stroke="#D9D4C9"/>
  <text x="1320" y="355" text-anchor="end" class="sans muted caps ltr" font-size="11">VISUAL PREMISE</text>
  <text x="1320" y="407" text-anchor="start" class="sans ink rtl" font-size="36" font-weight="700">דיו · אבן · מפה</text>
  <line x1="960" y1="440" x2="1320" y2="440" stroke="#171A18"/>
  <text x="1320" y="484" text-anchor="start" class="sans ink rtl" font-size="18">דיוק קרטוגרפי</text>
  <text x="1320" y="512" text-anchor="start" class="sans muted rtl" font-size="15">גבולות, קשרים וקנה מידה אמיתיים</text>
  <text x="1320" y="563" text-anchor="start" class="sans ink rtl" font-size="18">עריכה אדריכלית</text>
  <text x="1320" y="591" text-anchor="start" class="sans muted rtl" font-size="15">צילום מקומי, תוכניות, כיתובים וקרדיט</text>
  <text x="1320" y="642" text-anchor="start" class="sans ink rtl" font-size="18">מערכת החלטה</text>
  <text x="1320" y="670" text-anchor="start" class="sans muted rtl" font-size="15">חיפוש, השוואה, שמירה ופנייה בהקשר</text>
  <rect x="960" y="704" width="360" height="1" fill="#D9D4C9"/>
  <text x="1320" y="738" text-anchor="end" class="serif muted ltr" font-size="14" font-style="italic">Premium through evidence, restraint and place.</text>

  <!-- Section 02: palette + trust -->
  <text x="80" y="864" class="sans muted caps ltr" font-size="12" font-weight="700">02 / COLOUR &amp; TRUST</text>
  <text x="1360" y="864" text-anchor="start" class="sans ink rtl" font-size="22" font-weight="700">בסיס מונוכרומטי, צבע רק כשיש לו תפקיד</text>

  <g>
    <rect x="80" y="906" width="126" height="108" fill="#F2EEE3" stroke="#B9B4A9"/>
