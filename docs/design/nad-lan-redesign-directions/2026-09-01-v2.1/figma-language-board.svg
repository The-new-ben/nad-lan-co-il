<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2200" viewBox="0 0 1440 2200" role="img" aria-labelledby="title desc">
  <title id="title">Nad-Lan Premium Portal Direction — language board</title>
  <desc id="desc">A bilingual Hebrew and English architectural language board for a premium real-estate portal, with a cream and ink palette, typography, trust labels, five-language proof, local-context facts, and a comparison of full palette systems against a recommended controlled palette touch.</desc>

  <defs>
    <style>
      .sans { font-family: Arial, sans-serif; }
      .serif { font-family: Georgia, serif; }
      .ink { fill: #171A18; }
      .muted { fill: #5E625E; }
      .line { stroke: #B9B4A9; stroke-width: 1; fill: none; }
      .hairline { stroke: #B9B4A9; stroke-width: 0.5; fill: none; }
      .rule { stroke: #D9D4C9; stroke-width: 1; fill: none; }
      .rtl { direction: rtl; unicode-bidi: plaintext; }
      .ltr { direction: ltr; unicode-bidi: plaintext; }
      .caps { letter-spacing: 1.6px; }
    </style>
  </defs>

  <!-- Canvas + architectural grid -->
  <rect width="1440" height="2200" fill="#F2EEE3"/>
  <g opacity="0.28" class="hairline">
    <path d="M80 0V2200 M184 0V2200 M288 0V2200 M392 0V2200 M496 0V2200 M600 0V2200 M704 0V2200 M808 0V2200 M912 0V2200 M1016 0V2200 M1120 0V2200 M1224 0V2200 M1328 0V2200"/>
    <path d="M0 220H1440 M0 820H1440 M0 1210H1440 M0 1560H1440 M0 1850H1440 M0 2168H1440"/>
  </g>

  <!-- Header -->
  <text x="80" y="72" class="sans ink caps ltr" font-size="13" font-weight="700">NAD-LAN.CO.IL / CONCEPT 01</text>
  <text x="80" y="111" class="serif muted ltr" font-size="18" font-style="italic">Nad-Lan Premium Portal Direction</text>
  <text x="1360" y="82" text-anchor="start" class="sans ink rtl" font-size="46" font-weight="700">כיוון לפורטל נדל״ן פרימיום</text>
  <text x="1360" y="126" text-anchor="start" class="sans muted rtl" font-size="18">לוח שפה · דיו, אבן ומפה</text>
  <line x1="80" y1="172" x2="1360" y2="172" stroke="#171A18" stroke-width="2"/>
  <text x="80" y="203" class="sans muted caps ltr" font-size="11">CREAM / INK / ARCHITECTURAL LINE / CONTROLLED COLOUR</text>
  <text x="1360" y="203" text-anchor="start" class="sans muted rtl" font-size="13">פורטל מקומי עשיר · חמש שפות · מידע לפני אפקט</text>

  <!-- Section 01: real-photo slot -->
  <text x="80" y="266" class="sans muted caps ltr" font-size="12" font-weight="700">01 / IMAGE PRINCIPLE</text>
  <text x="1360" y="266" text-anchor="start" class="sans ink rtl" font-size="22" font-weight="700">צילום אמיתי הוא חומר מידע</text>

  <rect id="photo-placeholder" x="80" y="300" width="800" height="468" fill="#DDD9D0" stroke="#171A18" stroke-width="1.5"/>
  <g stroke="#A9A59C" fill="none">
    <line x1="80" y1="300" x2="880" y2="768" stroke-width="0.75"/>
    <line x1="880" y1="300" x2="80" y2="768" stroke-width="0.75"/>
    <rect x="112" y="332" width="736" height="404" stroke-width="0.75" stroke-dasharray="6 5"/>
    <path d="M80 330h28 M94 300v28 M852 300v28 M880 330h-28 M80 738h28 M94 768v-28 M852 768v-28 M880 738h-28" stroke="#171A18"/>
