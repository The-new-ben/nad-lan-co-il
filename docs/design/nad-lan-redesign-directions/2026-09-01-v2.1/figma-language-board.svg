  <!-- Section 03: type + language proof -->
  <text x="80" y="1252" class="sans muted caps ltr" font-size="12" font-weight="700">03 / TYPE &amp; LANGUAGE</text>
  <text x="1360" y="1252" text-anchor="start" class="sans ink rtl" font-size="22" font-weight="700">מערכת אחת, חמש שפות ושני כיווני קריאה</text>

  <rect x="80" y="1292" width="590" height="224" fill="#FBF9F3" stroke="#D9D4C9"/>
  <text x="630" y="1342" text-anchor="start" class="sans ink rtl" font-size="42" font-weight="700">מקום לפני אפקט</text>
  <text x="630" y="1384" text-anchor="start" class="sans ink rtl" font-size="22">חפשו עיר, שכונה, רחוב או פרויקט</text>
  <text x="630" y="1424" text-anchor="start" class="sans muted rtl" font-size="16">צילום, תוכנית, מקור ותאריך באותה היררכיה</text>
  <text x="120" y="1474" class="serif muted ltr" font-size="16" font-style="italic">Place before effect. Evidence before spectacle.</text>

  <rect x="700" y="1292" width="660" height="224" fill="#171A18"/>
  <text x="1320" y="1331" text-anchor="start" class="sans rtl" font-size="15" fill="#F7F4EB">עברית · חיפוש לפי עיר, שכונה, רחוב או פרויקט</text>
  <text x="740" y="1368" class="sans ltr" font-size="15" fill="#F7F4EB">English · Search by city, neighbourhood, street or project</text>
  <text x="740" y="1405" class="sans ltr" font-size="15" fill="#F7F4EB">Français · Rechercher par ville, quartier, rue ou projet</text>
  <text x="740" y="1442" class="sans ltr" font-size="15" fill="#F7F4EB">Русский · Поиск по городу, району, улице или проекту</text>
  <text x="1320" y="1479" text-anchor="start" class="sans rtl" font-size="15" fill="#F7F4EB">العربية · البحث حسب المدينة أو الحي أو الشارع أو المشروع</text>

  <!-- Section 04: local context and verified facts -->
  <text x="80" y="1602" class="sans muted caps ltr" font-size="12" font-weight="700">04 / LOCAL CONTEXT</text>
  <text x="1360" y="1602" text-anchor="start" class="sans ink rtl" font-size="22" font-weight="700">הפורטל נע בין קני מידה בלי לאבד הקשר</text>

