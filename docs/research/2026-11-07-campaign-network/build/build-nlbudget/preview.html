<main class="entry-content" id="pv-main">
<p class="pv-top" id="pv-top">תצוגה מקומית · כמה עולה לשווק את הפרויקט (nlbudget) · שום דבר לא נשלח מכאן לאתר</p>
</main>
<template id="pv-he"><section class="nli" dir="rtl" lang="he" aria-label="כמה עולה לשווק את הפרויקט"><div class="nli-host" data-nli="nlbudget" data-nli-data="/plugins/nadlan-config/assets/instruments/data/nlbudget.json"><div class="nli__panel"><p class="nli__kicker">תקציב שיווק ליזמים</p><h2 class="nli__title">כמה עולה לשווק את הפרויקט</h2><!--SUM_HE--><p>מחשבון תקציב השיווק והמכירה של פרויקט נדל״ן חדש: כותבים את מספר הדירות למכירה ואת המחיר הממוצע, בוחרים את שלב הפרויקט ומי מוכר, ומקבלים טווח לכל הפרויקט, את שורות התקציב אחת אחת ואת המקור והסימון של כל מספר (מקור מצוטט, מחירון שפורסם או טענת משרד פרסום).</p><p>העוגנים שפורסמו בישראל: כ־1% ממחזור המכירות לשיווק, מתוכו כ־0.75% ברשת (WE DO MEDIA, טענת משרד פרסום); 2% עד 4% לשיווק ומכירה, כולל צוות מכירות ופרסום (סטארט פוינט, טענת משרד פרסום); 3,000 עד 23,000 ₪ לפרסום לכל דירה שנמכרת (סטארט פוינט, טענת משרד, בלי שם המקור). בדוגמה של סמרנקו, 60 דירות במחיר ממוצע של 2,400,000 ₪ (מכירות של 144,000,000 ₪), זה 2,880,000 עד 5,760,000 ₪ לשיווק ומכירה, וכ־1,440,000 ₪ לשיווק בלבד.</p><p>ליד בלעדי לדירה חדשה עולה 128 עד 173 ₪ לפני מע״מ במחירון של סטארט פוינט, ולפי סמרנקו ליד בקמפיין של פרויקט עולה בפועל 300 עד 800 ₪ (סמרנקו, טענת משרד, בלי שם המקור). בחו״ל: 0.75% עד 2% לשיווק בלבד ו־3% עד 5% לשיווק ומכירה (Feasly, אוסטרליה, טענת משרד פרסום).</p><p>לא פורסם מחיר ישראלי לשורות האלה: מחקר ותמחור, מיתוג, צילום, אתר ודפי נחיתה, ניהול פניות, שילוט חוצות וגדר האתר, דפוס, רדיו וטלוויזיה, יחסי ציבור, אירועים ותערוכות, משרד מכירות ודירה לדוגמה, וגם לא שיעור העמלה של חברות שיווק לפרויקטים חדשים.</p><table><caption>שורות התקציב שיש להן מחיר ישראלי שפורסם</caption><thead><tr><th>רכיב</th><th>טווח</th><th>מקור</th></tr></thead><tbody><tr><td>סט הדמיות חוץ, 3 זוויות</td><td>4,000 עד 6,000 ₪</td><td>מבטים, מחירון הדמיות, מחירון שפורסם</td></tr><tr><td>תוכנית מכר בתלת ממד, לדירה</td><td>1,000 עד 1,500 ₪</td><td>מבטים, מחירון הדמיות, מחירון שפורסם</td></tr><tr><td>סרט הדמיה של דקה עד 3 דקות</td><td>12,000 עד 30,000 ₪</td><td>מבטים, מחירון הדמיות, מחירון שפורסם</td></tr><tr><td>פרסום ממומן ברשת</td><td>כ־0.75% ממחזור המכירות</td><td>WE DO MEDIA, טענת משרד פרסום</td></tr><tr><td>עמוד פרויקט עם סיור וירטואלי</td><td>כלול במנוי נדל״ן: 36,000 ₪, 72,000 ₪ או 144,000 ₪ לשנה</td><td>נדל״ן, המחיר של נדל״ן</td></tr></tbody></table><!--/SUM_HE--></div></div><nav class="nli__rel" aria-label="כלים קשורים"><span>כלים קשורים:</span> <a href="https://nad-lan.co.il/developers/">שיווק פרויקטים ליזמים</a> <a href="https://nad-lan.co.il/advertiser-center/">פרסום פרויקט נדל״ן</a> <a href="https://nad-lan.co.il/advertise/">מחירון הפרסום באתר</a></nav></section></template>
<template id="pv-en"><section class="nli" dir="ltr" lang="en" aria-label="What it costs to market your project"><div class="nli-host" data-nli="nlbudget" data-nli-data="/plugins/nadlan-config/assets/instruments/data/nlbudget.json"><div class="nli__panel"><p class="nli__kicker">Marketing budget for developers</p><h2 class="nli__title">What it costs to market your project</h2><!--SUM_EN--><p>A marketing and sales budget calculator for a new real-estate project: enter the apartments for sale and the average price, choose the stage and who sells, and get a range for the whole project, the budget lines one by one and the source and flag of every number (cited source, published price list or agency claim).</p><p>The anchors published in Israel: about 1% of sales value for marketing, of which about 0.75% online (WE DO MEDIA, agency claim); 2% to 4% for marketing and sales, the sales team and advertising included (Start Point, agency claim); ₪3,000 to ₪23,000 of advertising per apartment sold (Start Point, agency claim, source not named). In the Semerenko example, 60 apartments at an average of ₪2,400,000 (sales of ₪144,000,000), that is ₪2,880,000 to ₪5,760,000 for marketing and sales, and about ₪1,440,000 for marketing alone.</p><p>An exclusive new-apartment lead costs ₪128 to ₪173 before VAT in the Start Point price list, and per Semerenko a lead in a project campaign actually costs ₪300 to ₪800 (Semerenko, agency claim, source not named). Abroad: 0.75% to 2% for marketing alone and 3% to 5% for marketing and selling (Feasly, Australia, agency claim).</p><p>No Israeli price is published for these lines: research and pricing, branding, photography, website and landing pages, lead handling, outdoor signs and the site fence, print, radio and TV, PR, events and exhibitions, the sales office and model apartment, nor a commission rate of marketing companies for new projects.</p><table><caption>The budget lines with a published Israeli price</caption><thead><tr><th>Line</th><th>Range</th><th>Source</th></tr></thead><tbody><tr><td>Exterior render set, 3 angles</td><td>₪4,000 to ₪6,000</td><td>Mabatim render price list, published price list</td></tr><tr><td>3D sales plan, per apartment</td><td>₪1,000 to ₪1,500</td><td>Mabatim render price list, published price list</td></tr><tr><td>Render film of 1 to 3 minutes</td><td>₪12,000 to ₪30,000</td><td>Mabatim render price list, published price list</td></tr><tr><td>Paid online ads</td><td>about 0.75% of sales value</td><td>WE DO MEDIA, agency claim</td></tr><tr><td>Project page with a virtual tour</td><td>Included in the NadLan plan: ₪36,000, ₪72,000 or ₪144,000 a year</td><td>NadLan, NadLan price</td></tr></tbody></table><!--/SUM_EN--></div></div></section></template>
