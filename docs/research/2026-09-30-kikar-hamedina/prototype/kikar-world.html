<style>
  :root {
    --paper: #FAF7F1;
    --ink: #1B1A17;
    --ink-2: #4A4740;
    --ink-3: #7A756B;
    --gold: #9C7A3C;
    --terra: #C2563A;
    --hair: #E2DCD0;
    --card: rgba(250, 247, 241, 0.94);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); overflow: hidden;
    font-family: "Assistant", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

  /* pins */
  .pin { position: absolute; left: 0; top: 0; will-change: transform; }
  .pin .dot { position: absolute; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%;
    background: var(--ink); box-shadow: 0 0 0 2px var(--paper); }
  .pin.k-transport .dot { background: var(--ink); border-radius: 1.5px; }
  .pin.k-education .dot, .pin.k-civic .dot { background: var(--gold); }
  .pin.k-outdoors .dot { background: #6F7F5A; }
  .pin .stem { position: absolute; width: 1px; background: rgba(27, 26, 23, 0.55); left: -0.5px; }
  .pin .tag { position: absolute; transform: translate(50%, -100%); right: 0; white-space: nowrap;
    background: var(--card); border: 1px solid var(--hair); border-radius: 3px; padding: 3px 7px 3px 7px;
    box-shadow: 0 1px 2px rgba(27, 26, 23, 0.06); direction: rtl; text-align: right; line-height: 1.15; }
  .pin .nm { font-size: 12.5px; font-weight: 600; color: var(--ink); letter-spacing: 0; }
  .pin .mt { font-size: 10.5px; color: var(--ink-3); margin-top: 1px; font-weight: 500; }
  .pin.t2 .nm { font-size: 11.5px; font-weight: 600; }
  .pin.hidden-tag .tag, .pin.hidden-tag .stem { display: none; }
  .pin.mark .tag { background: rgba(250, 247, 241, 0.82); border-color: rgba(156, 122, 60, 0.45); }
  .pin.mark .nm { font-family: "Noto Serif Hebrew", serif; font-weight: 600; font-size: 13px; }
  .pin.mark .dot { background: var(--gold); width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; }
  .pin.tower .tag { background: var(--ink); border-color: var(--ink); }
  .pin.tower .nm { color: var(--paper); font-family: "Noto Serif Hebrew", serif; font-size: 13px; }
  .pin.tower .mt { color: #CFC6B4; }
  .pin.tower .dot { display: none; }
  .pin.tower .stem { background: rgba(27, 26, 23, 0.7); }
  .pin.floor .tag { background: transparent; border: 0; box-shadow: none; padding: 0 6px; transform: translate(0, -50%); right: auto; left: 8px; }
  .pin.floor .nm { font-size: 11.5px; color: var(--gold); font-weight: 700; letter-spacing: .02em; }
  .pin.floor .dot { background: var(--gold); width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; box-shadow: none; }
  .pin.floor.left .tag { left: auto; right: 8px; }
  .pin.sun .tag { background: rgba(250, 247, 241, 0.86); border-color: rgba(156, 122, 60, 0.5); }
  .pin.sun .nm { font-size: 11px; color: var(--gold); font-weight: 700; direction: ltr; unicode-bidi: isolate; }
  .pin.sun .dot { background: var(--gold); box-shadow: 0 0 0 2px rgba(250, 247, 241, 0.9); }
  .pin.shade .tag { background: rgba(250, 247, 241, 0.9); border-color: rgba(156, 122, 60, 0.6); }
  .pin.shade .nm { font-size: 11.5px; color: #7A5A22; font-weight: 700; }
  .pin.shade .dot { background: #8A6526; width: 6px; height: 6px; margin: -3px 0 0 -3px; }
  .pin.sun.now .dot { width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; background: #D9A441; }
  .pin.cardinal .tag { background: transparent; border: 0; box-shadow: none; transform: translate(50%, -50%); }
  .pin.cardinal .nm { font-family: "Noto Serif Hebrew", serif; font-size: 12px; color: var(--ink-2); }
  .pin.cardinal .dot { display: none; }

  /* chrome */
  .card { position: fixed; top: 20px; right: 20px; max-width: 360px; background: var(--card);
    border: 1px solid var(--hair); border-radius: 4px; padding: 14px 18px 13px; box-shadow: 0 2px 10px rgba(27, 26, 23, 0.06); }
  .card .eyebrow { font-size: 11.5px; letter-spacing: .08em; color: var(--gold); font-weight: 700; }
  .card h1 { font-family: "Noto Serif Hebrew", serif; font-weight: 600; font-size: 25px; line-height: 1.15; margin: 4px 0 6px; }
  .card .view { font-size: 14.5px; color: var(--ink-2); font-weight: 600; }
  .card .rule { height: 1px; background: var(--gold); opacity: .55; margin: 9px 0 8px; width: 44px; }
  .card .cap { font-size: 11.5px; color: var(--ink-3); line-height: 1.45; }
  .card .view { border-top: 1px solid rgba(156, 122, 60, 0.45); padding-top: 7px; margin-top: 2px; }
  .foot { position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px; max-width: min(760px, calc(100% - 560px));
    font-size: 10.5px; line-height: 1.5; color: var(--ink-3); text-align: center; direction: rtl;
    background: rgba(250, 247, 241, 0.82); padding: 5px 10px; border-radius: 3px; }
  .foot .prov { color: var(--gold); display: block; }
  .card .eye { font-size: 12px; color: var(--gold); font-weight: 600; margin-top: 3px; }
  .card .mcap { display: none; font-size: 10.5px; color: var(--ink-3); margin-top: 4px; }
  .sunbox { position: fixed; left: 20px; bottom: 20px; background: var(--card); border: 1px solid var(--hair);
    border-radius: 4px; padding: 9px 13px 9px; font-size: 12px; color: var(--ink-2); min-width: 176px; direction: rtl; }
  .sunbox b { color: var(--ink); font-weight: 700; font-size: 13px; }
  .sunbox .sv { color: var(--ink-3); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .sunbox .sw { display: flex; gap: 4px; margin-top: 7px; flex-wrap: wrap; }
  .sunbox .sw span { border: 1px solid var(--hair); border-radius: 2px; padding: 1px 5px; font-size: 10.5px; color: var(--ink-3); cursor: pointer; }
  .sunbox .sw span.on { border-color: var(--gold); color: var(--gold); font-weight: 700; }
  .compass { position: fixed; right: 20px; bottom: 20px; width: 58px; height: 58px; }
  .scale { position: fixed; right: 92px; bottom: 30px; font-size: 11px; color: var(--ink-2); direction: ltr; }
  .scale .bar { height: 5px; border: 1px solid var(--ink); border-top: 0; margin-top: 3px; }
  .veil { position: fixed; inset: 0; pointer-events: none; }
  body.clean .card, body.clean .foot, body.clean .scale { display: none !important; }
  body.clean .sunbox { top: 12px; right: 12px; left: auto; bottom: auto; min-width: 0; }
  body.clean .sunbox .sw { display: none; }
  body.clean .compass { right: auto; left: 12px; bottom: 12px; width: 44px; height: 44px; }
  @media (max-width: 600px) {
    .card { top: 12px; right: 12px; left: 12px; max-width: none; padding: 11px 13px 10px; }
    .card h1 { font-size: 21px; }
    .card .view { font-size: 13.5px; }
    .card .cap { font-size: 11px; }
    .sunbox { left: 12px; bottom: 12px; min-width: 0; padding: 7px 10px; font-size: 11.5px; }
    .sunbox .sw { display: none; }
    .compass { right: 12px; bottom: 12px; width: 48px; height: 48px; }
    .scale { right: 72px; bottom: 20px; }
    .foot { display: none; }
    .card .mcap { display: block; }
    .pin .nm { font-size: 11.5px; }
    .pin .mt { font-size: 10px; }
    .pin .tag { padding: 2px 6px; }
  }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const W = window.KIKAR_WORLD;
const Q = new URLSearchParams(location.search);
const DEG = Math.PI / 180;
const LAT = W.origin.lat, LNG = W.origin.lng;

// ------------------------------------------------------------------ provisional tower parameters
const FH = parseFloat(Q.get('fh') || '4.0');            // floor-to-floor, provisional (eye-kikar-provisional.json)
const TWIST = 1.25;                                       // degrees per floor (Wikipedia, Mako, Alum Eshet)
const TWIST_DIR = Q.get('twist') === 'cw' ? 1 : -1;       // -1 = counter-clockwise seen from above (direction not published)
const B_FLOORS = parseInt(Q.get('bfloors') || '37', 10);  // 37 (Wikipedia/Ashtrom) or 40 (city GIS 513)
const SLAB_T = 0.45;                                      // slab thickness (illustrative)
const SLAB_OUT = 1.25;                                    // slab edge beyond the glass line (illustrative)
const CORNER_R = 4.5;                                     // rounded plate corners (illustrative)
const EYE = (floor) => (floor - 1) * FH + 1.6;            // (floor - 1) x 4.0 m + 1.6 m (provisional rule)

// ------------------------------------------------------------------ palette (house DNA)
const C = {
  paper: '#FAF7F1', ink: '#1B1A17', gold: '#9C7A3C', hair: '#E2DCD0',
  sky0: '#F1ECE2', sky1: '#FBF9F4',
  ground: '#EFEBE3', street: '#E4DED3', block: '#FCFAF6', blockPublic: '#F7F0E2',
  green: '#CDD3BD', park: '#C3CBAE', water: '#C6D6DA', sea: '#C2D3D8',
  tree: '#B9C1A5', slab: '#F8F5EE', glass: '#C9B07A', lot: '#F4F0E8',
};

// ------------------------------------------------------------------ sun (suncalc formulas, Vladimir Agafonkin, BSD)
const J1970 = 2440588, J2000 = 2451545, OBL = DEG * 23.4397;
function sunPos(date, lat, lng) {
  const lw = DEG * -lng, phi = DEG * lat, d = date.valueOf() / 864e5 - 0.5 + J1970 - J2000;
  const M = DEG * (357.5291 + 0.98560028 * d);
  const Cc = DEG * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
  const L = M + Cc + DEG * 102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(OBL) * Math.sin(L));
  const ra = Math.atan2(Math.sin(L) * Math.cos(OBL), Math.cos(L));
  const H = DEG * (280.16 + 360.9856235 * d) - lw - ra;
  const az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi));
  const alt = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
  return { bearing: ((az / DEG) + 180 + 360) % 360, alt: alt / DEG };
}
// local clock: 21 June = Israel Daylight Time (UTC+3), 21 December = Israel Standard Time (UTC+2)
const SUNS = {
  jun09: { m: 5, d: 21, h: 9, off: 3, he: '21 ביוני, 09:00' },
  jun13: { m: 5, d: 21, h: 13, off: 3, he: '21 ביוני, 13:00' },
  jun17: { m: 5, d: 21, h: 17, off: 3, he: '21 ביוני, 17:00' },
  dec09: { m: 11, d: 21, h: 9, off: 2, he: '21 בדצמבר, 09:00' },
  dec13: { m: 11, d: 21, h: 13, off: 2, he: '21 בדצמבר, 13:00' },
  dec17: { m: 11, d: 21, h: 17, off: 2, he: '21 בדצמבר, 17:00' },
};
for (const k in SUNS) {
  const s = SUNS[k];
  s.date = new Date(Date.UTC(2026, s.m, s.d, s.h - s.off, 0));
  Object.assign(s, sunPos(s.date, LAT, LNG));
}
function sunsetLocal(m, d, off) {
  for (let mi = 12 * 60; mi < 21 * 60; mi++) {
    const dt = new Date(Date.UTC(2026, m, d, 0, mi - off * 60));
    if (sunPos(dt, LAT, LNG).alt < -0.833) return `${String(Math.floor(mi / 60)).padStart(2, '0')}:${String(mi % 60).padStart(2, '0')}`;
  }
  return null;
}
const SUNSET = { jun: sunsetLocal(5, 21, 3), dec: sunsetLocal(11, 21, 2) };
const dirOf = (bearing) => new THREE.Vector3(Math.sin(bearing * DEG), 0, -Math.cos(bearing * DEG));

// ------------------------------------------------------------------ renderer and scene
const host = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 60000);
const fog = new THREE.Fog(C.sky0, 1500, 9000);
scene.fog = fog;

// sky dome: a quiet vertical gradient, paper at the horizon
const skyMat = new THREE.ShaderMaterial({
  uniforms: { c0: { value: new THREE.Color(C.sky0) }, c1: { value: new THREE.Color(C.sky1) }, c2: { value: new THREE.Color('#E9E3D7') } },
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 c0; uniform vec3 c1; uniform vec3 c2; varying vec3 vP; void main(){ float y = vP.y; vec3 c = y > 0.0 ? mix(c0, c1, smoothstep(0.0, 0.55, y)) : mix(c0, c2, smoothstep(0.0, -0.2, y)); gl_FragColor = vec4(c, 1.0);\n#include <colorspace_fragment>\n}',
  side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(50000, 48, 24), skyMat);
sky.renderOrder = -10;
sky.frustumCulled = false;
scene.add(sky);

// environment for the glass: the same paper sky, a warm ground
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
const envSky = new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), new THREE.ShaderMaterial({
  uniforms: {},
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'varying vec3 vP; void main(){ float y = vP.y; vec3 top = vec3(0.93,0.93,0.92); vec3 hor = vec3(1.0,0.97,0.9); vec3 gnd = vec3(0.42,0.38,0.32); vec3 c = y > 0.0 ? mix(hor, top, pow(y,0.6)) : mix(hor, gnd, smoothstep(0.0,-0.25,y)); gl_FragColor = vec4(c,1.0); }',
  side: THREE.BackSide,
}));
envScene.add(envSky);
const envTex = pmrem.fromScene(envScene, 0.02).texture;

const hemi = new THREE.HemisphereLight('#FFFBF3', '#D9D0BE', 1.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#FFF1D8', 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.00025;
sun.shadow.normalBias = 0.35;
scene.add(sun);
scene.add(sun.target);
hemi.layers.enable(1); sun.layers.enable(1);

// ------------------------------------------------------------------ helpers
const pairs = (arr, from) => { const P = []; for (let i = from; i + 1 < arr.length; i += 2) P.push([arr[i], arr[i + 1]]); return P; };
const signedArea = (P) => { let A = 0; for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i + 1) % P.length]; A += a[0] * b[1] - b[0] * a[1]; } return A / 2; };
// shape in the XY plane with y = -z, rotated onto the ground (so a shape point (x, -z) lands on world (x, 0, z))
function groundShape(P) { return new THREE.Shape(P.map(([x, z]) => new THREE.Vector2(x, -z))); }
function groundMesh(shapes, color, y, opts = {}) {
  if (!shapes.length) return null;
  const geos = shapes.map((s) => new THREE.ShapeGeometry(s, 3));
  const g = mergeGeometries(geos);
  g.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color, roughness: 1, metalness: 0, ...opts }));
  m.position.y = y;
  m.receiveShadow = true;
  return m;
}

// ------------------------------------------------------------------ ground, water, greens, streets
// tessellated: one giant quad interpolates depth badly at grazing angles (it showed through the sea as a dotted grid)
const ground = new THREE.Mesh(new THREE.PlaneGeometry(120000, 120000, 240, 240).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: C.ground, roughness: 1 }));
ground.receiveShadow = true;
scene.add(ground);

// water: the sea, the Yarkon, the Yarkon park lake (city GIS 504), holes kept
{
  const byName = {};
  for (const w of W.water) (byName[w.name] = byName[w.name] || []).push(w);
  const shapes = [];
  for (const name in byName) {
    let cur = null;
    for (const w of byName[name]) {
      const P = pairs(w.pts, 0);
      if (w.outer) { cur = groundShape(P); shapes.push(cur); }
      else if (cur) cur.holes.push(new THREE.Path(P.map(([x, z]) => new THREE.Vector2(x, -z))));
    }
  }
  const m = groundMesh(shapes, C.sea, 0.35, { roughness: 0.55, metalness: 0.0 });
  scene.add(m);
}
// streets: ribbons of the width class, round joins (GIS 507/508)
{
  const pos = [];
  const push = (a, b, c) => pos.push(a[0], 0, a[1], b[0], 0, b[1], c[0], 0, c[1]);
  for (const s of W.streets) {
    const w = s[0] * 0.5 * 0.92, P = pairs(s, 2);
    for (let i = 0; i + 1 < P.length; i++) {
      const [x0, z0] = P[i], [x1, z1] = P[i + 1];
      const dx = x1 - x0, dz = z1 - z0, L = Math.hypot(dx, dz);
      if (L < 0.01) continue;
      const nx = -dz / L * w, nz = dx / L * w;
      const a = [x0 + nx, z0 + nz], b = [x1 + nx, z1 + nz], c = [x1 - nx, z1 - nz], d = [x0 - nx, z0 - nz];
      push(a, c, b); push(a, d, c);
    }
    for (let i = 1; i + 1 < P.length; i++) {
      const [x, z] = P[i];
      for (let k = 0; k < 10; k++) {
        const a0 = k / 10 * Math.PI * 2, a1 = (k + 1) / 10 * Math.PI * 2;
        push([x, z], [x + Math.cos(a1) * w, z + Math.sin(a1) * w], [x + Math.cos(a0) * w, z + Math.sin(a0) * w]);
      }
    }
  }
  // make every triangle face up
  for (let i = 0; i < pos.length; i += 9) {
    const ax = pos[i], az = pos[i + 2], bx = pos[i + 3], bz = pos[i + 5], cx = pos[i + 6], cz = pos[i + 8];
    const ny = (bz - az) * (cx - ax) - (bx - ax) * (cz - az);
    if (ny < 0) { pos[i + 3] = cx; pos[i + 5] = cz; pos[i + 6] = bx; pos[i + 8] = bz; }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: C.street, roughness: 1 }));
  m.position.y = 0.05; m.receiveShadow = true;
  scene.add(m);
}
// the plot (plan 2500ב): the residential lot as pale stone, private open space as a light green wash
{
  const stone = [], soft = [];
  for (const l of W.lots) {
    const P = pairs(l.pts, 0);
    if (l.use.startsWith('מגורים')) stone.push(groundShape(P));
    else if (l.use.startsWith('פרטי')) soft.push(groundShape(P));
  }
  scene.add(groundMesh(stone, C.lot, 0.08));
  scene.add(groundMesh(soft, '#D3D8C1', 0.09));
}
// greens (GIS 503), the square's park on top
{
  const shapes = W.greens.map((g) => groundShape(pairs(g, 0)));
  scene.add(groundMesh(shapes, C.green, 0.11));
  if (W.park) scene.add(groundMesh([groundShape(pairs(W.park, 0))], C.park, 0.12));
}
// the park's ecological pond: ILLUSTRATIVE position and shape (no published geometry; the 2015 plan text: "up to 3.5 dunam, amorphous")
const pond = (() => {

  }
}
for (const [b, he] of [[0, 'צפון'], [90, 'מזרח'], [180, 'דרום'], [270, 'מערב']]) {
  const p = domePoint(b, 0, SP_R + 34);

}
for (const k in SUNS) {
  const s = SUNS[k];
  if (s.alt <= 0) continue;
  addLabel({ group: 'sun', name: `${s.m === 5 ? '21.6' : '21.12'} · ${String(s.h).padStart(2, '0')}:00`, cls: 'sun', pos: domePoint(s.bearing, s.alt), prio: 3, key: k });
}
for (const k of ['A', 'B', 'C']) addLabel({ group: 'shadow', name: `קצה הצל של מגדל ${k}`, meta: '', cls: 'shade', pos: new THREE.Vector3(), prio: 4, key: k });
// the pond's label (illustration)
if (pond) addLabel({ group: 'pond', name: 'אגם אקולוגי', meta: 'מיקום וצורה להמחשה', cls: 'k-outdoors t2', pos: new THREE.Vector3(pond.cx, 0.5, pond.cz), prio: 900 });

const proj = new THREE.Vector3();
let VIEW = null;
function layoutLabels() {
  const w = window.innerWidth, h = window.innerHeight;
  const placed = [];
  const cands = [];
  const camDir = new THREE.Vector3(); camera.getWorldDirection(camDir);
  for (const L of LABELS) {
    const show = VIEW.labels(L);
    if (!show) { L.el.style.display = 'none'; continue; }
    if (L.group === 'shadow') {
      const T = TOWERS[L.key];
      if (!T.shadowTip) { L.el.style.display = 'none'; continue; }
      L.pos.copy(T.shadowTip);
      L.el.querySelector('.nm').innerHTML = `הצל של מגדל <bdi>${L.key}</bdi>: <bdi>${Math.round(T.shadowLen)}</bdi> מ׳`;
    }
    // floor labels ride on the tower's edge facing the camera's right
    if (L.group === 'floor') {
      const T = TOWERS[L.key];
      const right = new THREE.Vector3().crossVectors(camDir, new THREE.Vector3(0, 1, 0)).normalize();
      const side = VIEW.floorSide === 'left' ? -1 : 1;
      L.pos.set(T.t.cx + right.x * (T.half + 1.5) * side, (L.floor - 1) * FH + SLAB_T, T.t.cz + right.z * (T.half + 1.5) * side);
      L.el.classList.toggle('left', side < 0);
    }
    proj.copy(L.pos);
    const toP = proj.clone().sub(camera.position);
    if (VIEW.minPitch !== undefined && Math.atan2(toP.y, Math.hypot(toP.x, toP.z)) / DEG < VIEW.minPitch) { L.el.style.display = 'none'; continue; }
    if (toP.dot(camDir) <= 0) { L.el.style.display = 'none'; continue; }
    proj.project(camera);
    const x = (proj.x * 0.5 + 0.5) * w, y = (-proj.y * 0.5 + 0.5) * h;
    if (x < -40 || x > w + 40 || y < -40 || y > h + 40) { L.el.style.display = 'none'; continue; }
    cands.push({ L, x, y, d: toP.length() });
  }
  cands.sort((a, b) => a.L.prio - b.L.prio);
  // keep labels off the chrome and off the towers themselves
  const reserved = [];
  for (const id of ['card', 'sunbox', 'compass', 'scale', 'foot']) {
    const el = document.getElementById(id);
    if (!el || el.style.display === 'none' || getComputedStyle(el).display === 'none') continue;
    const r = el.getBoundingClientRect();
    reserved.push({ x0: r.left - 6, x1: r.right + 6, y0: r.top - 6, y1: r.bottom + 6 });
  }
  const towerRects = [];
  if (VIEW.guardTowers !== false) {
    for (const k in TOWERS) {
      const T = TOWERS[k];
      let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, ok = true;
      for (const dx of [-1, 1]) for (const dz of [-1, 1]) for (const yy of [0, T.height]) {
        const v = new THREE.Vector3(T.t.cx + dx * T.half, yy, T.t.cz + dz * T.half);
        if (v.clone().sub(camera.position).dot(camDir) <= 0) { ok = false; continue; }
        v.project(camera);
        const sx = (v.x * 0.5 + 0.5) * w, sy = (-v.y * 0.5 + 0.5) * h;
        x0 = Math.min(x0, sx); x1 = Math.max(x1, sx); y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
      }
      if (ok) towerRects.push({ x0: x0 + 2, x1: x1 - 2, y0: y0 + 14, y1 });
    }
  }
  const hitAny = (r, list) => list.some((q) => !(r.x1 < q.x0 || r.x0 > q.x1 || r.y1 < q.y0 || r.y0 > q.y1));
  let curGroup = '';
  const hit = (r) => hitAny(r, placed) || hitAny(r, reserved) || (curGroup !== 'tower' && hitAny(r, towerRects));
  for (const c of cands) {
    const { L, x, y } = c;
    curGroup = L.group;
    L.el.style.display = 'block';
    L.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
    L.el.classList.remove('hidden-tag');
    if (L.group === 'sun') L.el.classList.toggle('now', L.key === VIEW.sun);
    if (L.group === 'floor' || L.group === 'cardinal') { continue; }
    if (VIEW.dotOnly && VIEW.dotOnly(L)) { L.el.classList.add('hidden-tag'); continue; }
    const tw = L.tag.offsetWidth, th = L.tag.offsetHeight;
    let ok = false;
    const stems = L.group === 'tower' ? [14, 34] : (L.group === 'sun' || L.group === 'shadow' ? [8, 22, 40] : [16, 34, 54, 76, 100]);
    const off = Math.max(0, tw / 2 - 12);
    const shifts = L.group === 'tower' ? [0] : [0, off, -off];
    // candidates: above the dot (short to long stems, centred then shifted), then hanging below it
    const cands2 = [];
    for (const s of stems) for (const dx of shifts) cands2.push({ s, dx, below: false });
    if (L.group === 'pin' || L.group === 'shadow' || L.group === 'mark') for (const s of [14, 30, 48]) for (const dx of shifts) cands2.push({ s, dx, below: true });
    for (const { s, dx, below } of cands2) {
      const r = below ? { x0: x + dx - tw / 2 - 3, x1: x + dx + tw / 2 + 3, y0: y + s - 2, y1: y + s + th + 3 }
        : { x0: x + dx - tw / 2 - 3, x1: x + dx + tw / 2 + 3, y0: y - s - th - 3, y1: y - s + 2 };
      if (r.x0 < 4 || r.x1 > w - 4 || r.y0 < 4 || r.y1 > h - 4) continue;
      if (hit(r)) continue;
      placed.push(r);
      L.stem.style.height = s + 'px';
      L.stem.style.top = below ? '0px' : (-s) + 'px';
      L.tag.style.top = below ? s + 'px' : (-s) + 'px';
      L.tag.style.transform = below ? 'translate(50%, 0)' : '';
      L.tag.style.right = (-dx).toFixed(1) + 'px';
      ok = true; break;
    }
    if (!ok) {
      if (L.group === 'mark' || L.group === 'tower' || L.group === 'sun' || L.group === 'shadow') { L.el.style.display = 'none'; }
      else L.el.classList.add('hidden-tag');
    }
  }
}

// ------------------------------------------------------------------ chrome: compass, scale, sun box
function updateChrome() {
  const d = new THREE.Vector3(); camera.getWorldDirection(d);
  let yaw = Math.atan2(d.x, -d.z) / DEG;               // the camera's bearing
  if (Math.hypot(d.x, d.z) < 0.02) yaw = VIEW.yaw || 0;
  document.getElementById('needle').setAttribute('transform', `rotate(${(-yaw).toFixed(1)})`);
  const sc = document.getElementById('scale');
  if (VIEW.scale) {
    const dist = camera.position.distanceTo(VIEW.target);
    const mpp = 2 * dist * Math.tan(camera.fov * DEG / 2) / window.innerHeight;
    const nice = [20, 50, 100, 200, 250, 500].find((m) => m / mpp > 70) || 500;
    document.getElementById('scalebar').style.width = (nice / mpp).toFixed(0) + 'px';
    document.getElementById('scaletxt').textContent = `${nice} מ׳`;
    sc.style.display = 'block';
  } else sc.style.display = 'none';
  const s = SUNS[VIEW.sun];
  const box = document.getElementById('sunbox');
  const up = s.alt > 0;
  const setT = s.m === 5 ? SUNSET.jun : SUNSET.dec;
  const sw = Object.keys(SUNS).map((k) => `<span data-k="${k}" class="${k === VIEW.sun ? 'on' : ''}">${SUNS[k].he.replace('21 ביוני, ', '6 · ').replace('21 בדצמבר, ', '12 · ')}</span>`).join('');
  box.innerHTML = `<b>השמש · ${s.he}</b><div class="sv">${up ? `גובה ${s.alt.toFixed(1)}° · כיוון ${s.bearing.toFixed(0)}°` : `השמש שקעה ב-${setT} · כיוון ${s.bearing.toFixed(0)}°`}</div><div class="sw">${sw}</div>`;
}

function setView(name) {
  VIEW = VIEWS[name]();
  VIEW.key = name;
  camera.fov = VIEW.fov; camera.near = VIEW.near; camera.far = VIEW.far;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.position.copy(VIEW.pos);
  camera.up.set(0, 1, 0);
  camera.lookAt(VIEW.target);
  camera.updateProjectionMatrix();
  applyShift();
  fog.near = VIEW.fog[0]; fog.far = VIEW.fog[1];
  applySun();
  // chrome
  document.getElementById('viewname').textContent = VIEW.name;
  const cap = document.getElementById('cap');
  const base = 'הדמיה להמחשה בלבד · בניינים, גבהים, רחובות, גנים ועצים: עיריית תל אביב-יפו · המגדלים: קונטור הבניין בשכבת העירייה וסיבוב של 1.25° בכל קומה';
  cap.textContent = base;
  const en = document.getElementById('eyenote');
  en.textContent = VIEW.eyeNote || '';
  en.style.display = VIEW.eyeNote ? 'block' : 'none';
  document.getElementById('prov').textContent = `זמני: ${FH.toFixed(1)} מ׳ לקומה · B ${B_FLOORS} קומות ו-157 מ׳ (בשכבת העירייה 40 ו-158.2) · צורת הקומה וכיוון הסיבוב · העצים והאגם להמחשה`;
  render();
}

function applySun() {
  sunPath.visible = !!VIEW.sunPath;
  shadowGroup.visible = !!VIEW.sunPath;
  if (VIEW.sunPath) buildShadowOutlines(SUNS[VIEW.sun]);
  {
    const sp = SUNS[VIEW.sun];
    nowRay.visible = sp.alt > 0;
    if (sp.alt > 0) nowRay.geometry.setFromPoints([new THREE.Vector3(0, 0.6, 0), domePoint(sp.bearing, sp.alt)]);
  }
  // the sun
  const s = SUNS[VIEW.sun];
  const up = s.alt > 0;
  const dir = domePoint(s.bearing, Math.max(s.alt, 0.1), 1).normalize();
  const sc = VIEW.shadow;
  sun.position.copy(sc.c).addScaledVector(dir, 3000);
  sun.target.position.copy(sc.c);
  sun.target.updateMatrixWorld();
  const cam = sun.shadow.camera;
  cam.left = -sc.half; cam.right = sc.half; cam.top = sc.half; cam.bottom = -sc.half;
  cam.near = 100; cam.far = 6000; cam.updateProjectionMatrix();
  sun.castShadow = up;
  // light: a touch warmer and softer when the sun is low; dusk after sunset
  const low = THREE.MathUtils.clamp(1 - s.alt / 45, 0, 1);
  sun.intensity = up ? 1.9 + 0.4 * (1 - low) : 0;
  sun.color.set(up ? new THREE.Color('#FFF6E6').lerp(new THREE.Color('#FFD9A6'), low * 0.55) : '#000000');
  hemi.intensity = up ? 1.9 : 1.2;
  if (VIEW.light && up) { hemi.intensity = VIEW.light.hemi; sun.intensity = VIEW.light.sun; }
  hemi.color.set(up ? '#FFFBF3' : '#DCE0E8');
  renderer.toneMappingExposure = up ? 1.0 : 1.05;
}
// the six sun chips and the keys 1-8 switch the sun and the view (the camera stays when only the sun changes)
function setSun(k) { if (!SUNS[k]) return; VIEW.sun = k; applySun(); render(true); }
function applyShift() {
  if (!VIEW || !VIEW.shift) return;
  const n = camera.near, t = n * Math.tan(VIEW.shift.top * DEG), b = n * Math.tan(VIEW.shift.bottom * DEG);
  const hw = (t - b) * camera.aspect / 2;
  camera.projectionMatrix.makePerspective(-hw, hw, t, b, n, camera.far);
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
}
// ------------------------------------------------------------------ render and interaction
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = false;
controls.addEventListener('change', () => render(true));
function render(fromControls) {
  if (!fromControls && controls) { controls.target.copy(VIEW.target); controls.update(); }
  renderer.shadowMap.autoUpdate = true;
  renderer.render(scene, camera);
  if (VIEW.sunPath) {
    // second pass: the towers again over the shadow outlines (same depth, so they win), reusing the shadow map
    renderer.autoClear = false; renderer.shadowMap.autoUpdate = false;
    camera.layers.set(1); renderer.render(scene, camera); camera.layers.set(0);
    renderer.autoClear = true; renderer.shadowMap.autoUpdate = true;
  }
  layoutLabels();
  updateChrome();
}
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  setView(VIEW.key);
});
window.setView = setView;
window.setSun = setSun;
document.getElementById('sunbox').addEventListener('click', (e) => { const k = e.target && e.target.dataset && e.target.dataset.k; if (k) setSun(k); });
const VIEW_KEYS = ['aerial', 'overview', 'street', 'c30west', 'a30north', 'shade', 'twist', 'study'];
window.addEventListener('keydown', (e) => { const i = parseInt(e.key, 10); if (i >= 1 && i <= VIEW_KEYS.length) setView(VIEW_KEYS[i - 1]); });
window.KIKAR = { SUNS, SUNSET, TOWERS, EYE, FH, B_FLOORS, TWIST_DIR, towerEye: (k, f, b) => towerEye(k, f, b).toArray() };

if (Q.get('clean') === '1') document.body.classList.add('clean');
setView(Q.get('view') || 'aerial');
document.fonts.ready.then(() => {
  requestAnimationFrame(() => { render(); requestAnimationFrame(() => { render(); window.__ready = true; }); });
});
