/* English pages (HAD-534 d, 21.10.2026): the shortcode prints dir="ltr" lang="en" on the section. Same palette; Latin faces

   so one survey-instrument voice in both scripts (not Inter, not Space Grotesk, no serif). Everything else mirrors to LTR. */

/* 1.72.498 presets (HAD-592, Ben 22.10.2026 "one click with your fingers to get everything"): ready cases above the form */
html body .nli .nli__prelab{display:block;margin:14px 0 6px;position:relative}
html body .nli .nli__pre{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:0 0 18px;position:relative}
html body .nli .nli__pre button{display:grid;gap:3px;align-content:start;text-align:right;border:1px solid var(--nli-line);border-radius:var(--nli-r-m);background:var(--nli-surface);padding:10px 12px;min-height:58px;cursor:pointer;margin:0;color:var(--nli-ink);box-shadow:none;text-transform:none;letter-spacing:0}
html body .nli .nli__pre button span{font:600 14px/19px var(--nli-sans)}
html body .nli .nli__pre button small{font:400 12px/16px var(--nli-mono);color:var(--nli-mute);direction:ltr;unicode-bidi:plaintext;text-align:right}
html body .nli .nli__pre button:hover{border-color:var(--nli-sea)}
html body .nli .nli__pre button:focus-visible{outline:2px solid var(--nli-focus);outline-offset:2px}
html body .nli .nli__pre button[aria-pressed="true"]{background:var(--nli-sea);border-color:var(--nli-sea);color:var(--nli-on-sea)}
html body .nli .nli__pre button[aria-pressed="true"] small{color:var(--nli-on-sea)}
.nli[dir="ltr"] .nli__pre button,.nli[dir="ltr"] .nli__pre button small{text-align:left}
@media (max-width:600px){html body .nli .nli__pre{grid-template-columns:1fr 1fr}html body .nli .nli__pre button{min-height:64px}}
@media print{.nli__pre,.nli__prelab{display:none !important}}
/* 1.72.499: a select with long options (the Greece regions) set its own width and pushed the form past a 390 px phone; the form
   column and the box now shrink to the panel, and the select fills its box */
html body .nli .nli__form{grid-template-columns:minmax(0,1fr)}
html body .nli .nli__in{min-width:0}
html body .nli .nli__in select{min-width:0;width:100%;max-width:100%;text-overflow:ellipsis}
/* 1.72.521: a tool's own drawing (r.figure): the gypsum wall, drawn like a fire-safety plan sheet (black line work, red hatch = fire-rated board) */
.nli__figure{margin:4px 0 0}.nli__figure svg{display:block;width:100%;height:auto;max-width:560px}
.nli__wall text{font:400 14px/1 var(--nli-sans);fill:var(--nli-ink2)}.nli__wall .t{font:600 16px/1 var(--nli-sans);fill:var(--nli-ink)}
.nli__wall .m{font:500 15px/1 var(--nli-mono);fill:var(--nli-ink)}.nli__wall .r{fill:var(--nli-survey)}
/* 1.72.522: a rows field with three inputs (the Dekel quote check: quantity, Dekel price, quote price) */
.nli__row:has(> .nli__in:nth-child(3)){grid-template-columns:minmax(0,.7fr) minmax(0,1fr) minmax(0,1fr) 44px}
