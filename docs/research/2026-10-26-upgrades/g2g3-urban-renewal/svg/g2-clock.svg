B5C" stroke="#fff" stroke-width="2"/><line x1="65.0" y1="134" x2="65.0" y2="152" stroke="#1F4B5C"/><text x="65.0" y="166.0" text-anchor="middle" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:13px;font-weight:600" fill="#12202A">הגשת תכנית</text><text x="65.0" y="182.0" text-anchor="middle" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:12px;font-weight:400" fill="#3E4C58">54 חודשים</text><text x="410.0" y="166.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:12px;font-weight:400" fill="#5E6A75">שנים מהעסקה הראשונה</text><line x1="65.0" y1="198" x2="30.0" y2="198" stroke="#2F6F86" stroke-width="3" stroke-dasharray="5 4"/><text x="410.0" y="203.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:12px;font-weight:400" fill="#2F6F86">120 יחידות ומעלה: שנה נוספת לכל מועד</text><line x1="20" y1="220" x2="400" y2="220" stroke="#D3DCE2"/><text x="410.0" y="242.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:14px;font-weight:600" fill="#12202A">אחרי אישור התכנית: 4.0 שנים בממוצע עד היתר</text><text x="410.0" y="262.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:12px;font-weight:400" fill="#5E6A75">ממוצע של 28 מתחמים שקיבלו היתר ב-2025, לא תחזית</text><text x="410.0" y="280.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:12px;font-weight:400" fill="#5E6A75">סעיף 1ד לחוק פינוי ובינוי; דוח הרשות לשנת 2025</text></svg>