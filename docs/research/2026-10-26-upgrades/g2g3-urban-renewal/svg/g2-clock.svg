<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 292" direction="rtl" role="img" aria-label="השעון של סעיף 1ד: בתוך שנתיים חצי מבעלי הדירות; בתוך 4 שנים שלוש חמישיות; בתוך 4.5 שנים הגשת תכנית; שנה נוספת במתחם של 120 יחידות. אחרי אישור התכנית 4.0 שנים בממוצע עד היתר ראשון" style="display:block;width:100%;height:auto;max-width:640px;background:#fff"><defs><pattern id="g292" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M14 0H0V14" fill="none" stroke="#D3DCE2" stroke-width=".5"/></pattern></defs><rect width="420" height="292" fill="url(#g292)" opacity=".45"/><text x="410.0" y="26.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:17px;font-weight:700" fill="#12202A">השעון שהחוק נותן ליזם</text><text x="410.0" y="46.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:13px;font-weight:400" fill="#3E4C58">מהעסקה הראשונה שנחתמה בבניין</text><text x="410.0" y="64.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:13px;font-weight:400" fill="#3E4C58">לא עמד בו? רוב באסיפה כללית יכול לאפשר ביטול</text><line x1="30" y1="124" x2="380" y2="124" stroke="#12202A" stroke-width="2"/><line x1="380.0" y1="120" x2="380.0" y2="128" stroke="#12202A"/><text x="380.0" y="144.0" text-anchor="middle" style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;font-weight:400" fill="#5E6A75">0</text><line x1="310.0" y1="120" x2="310.0" y2="128" stroke="#12202A"/><text x="310.0" y="144.0" text-anchor="middle" style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;font-weight:400" fill="#5E6A75">1</text><line x1="240.0" y1="120" x2="240.0" y2="128" stroke="#12202A"/><text x="240.0" y="144.0" text-anchor="middle" style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;font-weight:400" fill="#5E6A75">2</text><line x1="170.0" y1="120" x2="170.0" y2