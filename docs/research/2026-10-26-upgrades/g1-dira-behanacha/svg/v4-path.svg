<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 412" direction="rtl" role="img" aria-label="הדרך לדירה בהנחה בשמונה שלבים, מאישור הזכאות ועד איסור המכירה" style="display:block;width:100%;height:auto;max-width:640px;background:#fff"><text x="408.0" y="24.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:16px;font-weight:600" fill="#12202A">מהזכאות ועד המפתח</text><text x="408.0" y="46.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:13px;font-weight:400" fill="#3E4C58">השלבים והזמנים לפי משרד הבינוי והשיכון</text><line x1="392" y1="78" x2="392" y2="358" stroke="#D3DCE2" stroke-width="2"/><circle cx="392" cy="78" r="9" fill="#2F6F86" stroke="#2F6F86" stroke-width="2"/><text x="392.0" y="82.5" text-anchor="middle" style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;font-weight:600" fill="#fff">1</text><text x="374.0" y="79.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:14px;font-weight:600" fill="#12202A">אישור זכאות</text><text x="374.0" y="96.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:12.5px;font-weight:400" fill="#3E4C58">200 ₪, עד 10 ימי עבודה</text><circle cx="392" cy="118" r="9" fill="#2F6F86" stroke="#2F6F86" stroke-width="2"/><text x="392.0" y="122.5" text-anchor="middle" style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;font-weight:600" fill="#fff">2</text><text x="374.0" y="119.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:14px;font-weight:600" fill="#12202A">הרשמה באתר ההגרלות</text><text x="374.0" y="136.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:12.5px;font-weight:400" fill="#3E4C58">עד 3 יישובים, לכל ההגרלות בהם</tex