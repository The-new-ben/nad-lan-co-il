<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 478" role="img" aria-label="חוזה שכירות למגורים על ציר הזמן לפי חוק השכירות והשאילה" font-family="IBM Plex Sans Hebrew, system-ui, sans-serif" style="max-width:100%;height:auto;display:block"><rect width="420" height="478" fill="#F6F8F9"/><line x1="0" y1="0" x2="0" y2="478" stroke="#D3DCE2" stroke-width="0.5" opacity="0.55"/><line x1="21" y1="0" x2="21" y2="478" stroke="#D3DCE2" stroke-width="0.5" opacity="0.55"/><line x1="42" y1="0" x2="42" y2="478" stroke="#D3DCE2" stroke-width="0.5" opacity="0.55"/><line x1="63" y1="0" x2="63" y2="478" stroke="#D3DCE2" stroke-width="0.5" opacity="0.55"/><line x1="84" y1="0" x2="84" y2="478" stroke="#D3DCE2" stroke-width="0.5" opacity="0.55"/><line x1="105" y1="0" x2="105" y2="478" stroke="#D3DCE2" stroke-width="0.5" opacity="0.55"/><line x1="126" y1="0" x2="126" y2="478" stroke="#D3DCE2" stroke-width="0.5" opacity="0.55"/><line x1="147" y1="0" x2="147" y2="478" stroke="#D3DCE2" stroke-width="0.5" opacity="0.55"/><line x1="168" y1="0" x2="168" y2="478" stroke="#D3DCE2" stroke-width="0.5" opacity="0.55"/><line x1="189" y1="0" x2="189" y2="478" stroke="#D3DCE2" stroke-width="0.5" opacity="0.55"/><line x1="210" y1="0" x2="210" y2="478" stroke="#D3DCE2" stroke-width="0.5" opacity="0.55"/><line x1="231" y1="0" x2="231" y2="478" stroke="#D3DCE2" stroke-width="0.5" opacity="0.55"/><line x1="252" y1="0" x2="252" y2="478" stroke="#D3DCE2" stroke-width="0.5" opacity="0.55"/><line x1="273" y1="0" x2="273" y2="478" stroke="#D3DCE2" stroke-width="0.5" opacity="0.55"/><line x1="294" y1="0" x2="294" y2="478" stroke="#D3DCE2" stroke-width="0.5" opacity="0.55"/><line x1="315" y1="0" x2="315" y2="478" stroke="#D3DCE2" stroke-width="0.5" opacity="0.55"/><line x1="336" y1="0" x2="336" y2="478" stroke="#D3DCE2" stroke-width="0.5" opacity="0.55"/><line x1="357" y1="0" x2="357" y2="478" stroke="#D3DCE2" stroke-width="0.5" opacity="0.55"/><line x1="378" y1="0" x2="378" y2="478" stroke="#D3DCE2" stroke-width="0.5" opacity="0.55"/><line x1="399" y1="0" x2="399" y2="478" stroke="#D3DCE2" stroke-width="0.5" opacity="0.55"/><line x1="420" y1="0" x2="420" y2="478" stroke="#D3DCE2" stroke-width="0.5" opacity="0.55"/><text x="410" y="26" text-anchor="start" font-size="15" font-weight="700" fill="#12202A" direction="rtl">החוזה על ציר הזמן</text><text x="410" y="46" text-anchor="start" font-size="12" font-weight="400" fill="#5E6A75" direction="rtl">חוק השכירות והשאילה, סימן ו׳: חוזה שכירות למגורים</text><line x1="398" y1="76" x2="398" y2="406" stroke="#1F4B5C" stroke-width="2"/><circle cx="398" cy="76" r="7" fill="#2F6F86" stroke="#1F4B5C" stroke-width="2"/><text x="382" y="81" text-anchor="start" font-size="14" font-weight="700" fill="#12202A" direction="rtl">לפני החתימה</text><text x="382" y="100" text-anchor="start" font-size="12.5" font-weight="400" fill="#3E4C58" direction="rtl">חוזה בכתב, העתק חתום לכל צד. ערובה שעולה כסף: עד 3</text><text x="382" y="116" text-anchor="start" font-size="12.5" font-weight="400" fill="#3E4C58" direction="rtl">חודשי שכירות או שליש מהתקופה, הנמוך מביניהם</text><circle cx="398" cy="142" r="7" fill="#FFFFFF" stroke="#1F4B5C" stroke-width="2"/><text x="382" y="147" text-anchor="start" font-size="14" font-weight="700" fill="#12202A" direction="rtl">מסירת הדירה</text><text x="382" y="166" text-anchor="start" font-size="12.5" font-weight="400" fill="#3E4C58" direction="rtl">דירה ראויה למגורים, פנויה, עם הוראות תחזוקה ושימוש</text><circle cx="398" cy="208" r="7" fill="#2F6F86" stroke="#1F4B5C" stroke-width="2"/><text x="382" y="213" text-anchor="start" font-size="14" font-weight="700" fill="#12202A" direction="rtl">במהלך השכירות</text><text x="382" y="232" text-anchor="start" font-size="12.5" font-weight="400" fill="#3E4C58" direction="rtl">ליקוי שלא מאפשר לגור: תיקון עד 3 ימים. ליקוי אחר:</text><text x="382" y="248" text-anchor="start" font-size="12.5" font-weight="400" fill="#3E4C58" direction="rtl">עד 30 יום</text><circle cx="398" cy="274" r="7" fill="#FFFFFF" stroke="#1F4B5C" stroke-width="2"/><text x="382" y="279" text-anchor="start" font-size="14" font-weight="700" fill="#12202A" direction="rtl">90 יום לפני הסוף</text><text x="382" y="298" text-anchor="start" font-size="12.5" font-weight="400" fill="#3E4C58" direction="rtl">המשכיר מודיע אם הוא מממש אופציה, או מבטל לפי סעיף</text><text x="382" y="314" text-anchor="start" font-size="12.5" font-weight="400" fill="#3E4C58" direction="rtl">ביטול</text><circle cx="398" cy="340" r="7" fill="#2F6F86" stroke="#1F4B5C" stroke-width="2"/><text x="382" y="345" text-anchor="start" font-size="14" font-weight="700" fill="#12202A" direction="rtl">60 יום לפני הסוף</text><text x="382" y="364" text-anchor="start" font-size="12.5" font-weight="400" fill="#3E4C58" direction="rtl">השוכר מודיע אם הוא מממש אופציה, או מבטל לפי סעיף</text><text x="382" y="380" text-anchor="start" font-size="12.5" font-weight="400" fill="#3E4C58" direction="rtl">ביטול</text><circle cx="398" cy="406" r="7" fill="#FFFFFF" stroke="#1F4B5C" stroke-width="2"/><text x="382" y="411" text-anchor="start" font-size="14" font-weight="700" fill="#12202A" direction="rtl">עד 60 יום אחרי הסוף</text><text x="382" y="430" text-anchor="start" font-size="12.5" font-weight="400" fill="#3E4C58" direction="rtl">המשכיר מחזיר את הערובה עם פירותיה, אחרי שהדירה</text><text x="382" y="446" text-anchor="start" font-size="12.5" font-weight="400" fill="#3E4C58" direction="rtl">הוחזרה והחובות שולמו</text></svg>