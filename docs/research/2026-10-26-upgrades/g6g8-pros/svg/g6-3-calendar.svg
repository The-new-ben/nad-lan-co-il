<svg viewBox="0 0 420 492" direction="rtl" role="img" aria-label="לוח הבדיקות בדירה חדשה: לפני החתימה, ביום המסירה, ולפני סוף כל תקופת בדק אחרי שנה, 2, 3, 4, 5 ו-7 שנים" style="display:block;width:100%;height:auto;max-width:640px;background:#fff"><text x="410.0" y="24.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:16px;font-weight:600" fill="#12202A">מתי להזמין בדק בית בדירה חדשה</text><text x="410.0" y="46.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:13px;font-weight:400" fill="#3E4C58">45 יום לפני סוף כל תקופת בדק (ההצעה שלנו), כדי שהדוח</text><text x="410.0" y="64.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:13px;font-weight:400" fill="#3E4C58">והמכתב לקבלן יגיעו לפני התאריך</text><line x1="392.0" y1="84.0" x2="392.0" y2="406.0" stroke="#D3DCE2" stroke-width="2"/><circle cx="392" cy="84" r="9" fill="#2F6F86" stroke="#2F6F86" stroke-width="2"/><text x="374.0" y="85.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:14px;font-weight:600" fill="#12202A">לפני החתימה</text><text x="374.0" y="103.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:12.5px;font-weight:400" fill="#3E4C58">יד שנייה: בדיקה לפני חוזה, כשעוד יש כוח מיקוח</text><circle cx="392" cy="130" r="9" fill="#fff" stroke="#C42550" stroke-width="2"/><text x="374.0" y="131.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:14px;font-weight:600" fill="#C42550">יום המסירה</text><text x="374.0" y="149.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:12.5px;font-weight:400" fill="#3E4C58">פרוטוקול מסירה ובדק בית; מכאן רצות התקופות</text><circle cx="392" cy="176" r="9" fill="#1F4B5C" stroke="#1F4B5C" stroke-width="2"/><text x="374.0" y="177.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:14px;font-weight:600" fill="#12202A">10.5 חודשים</text><text x="374.0" y="195.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:12.5px;font-weight:400" fill="#3E4C58">לפני סוף שנת הבדק: כל ליקוי שאינו ברשימה, חשמל, טיח, צבע</text><circle cx="392" cy="222" r="9" fill="#1F4B5C" stroke="#1F4B5C" stroke-width="2"/><text x="374.0" y="223.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:14px;font-weight:600" fill="#12202A">22.5 חודשים</text><text x="374.0" y="241.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:12.5px;font-weight:400" fill="#3E4C58">לפני סוף שנתיים: חלונות, דלתות, אלומיניום, ריצוף וחיפוי פנים</text><circle cx="392" cy="268" r="9" fill="#1F4B5C" stroke="#1F4B5C" stroke-width="2"/><text x="374.0" y="269.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:14px;font-weight:600" fill="#12202A">34.5 חודשים</text><text x="374.0" y="287.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:12.5px;font-weight:400" fill="#3E4C58">לפני סוף 3 שנים: דודים ומכונות, חצר וחניה, בידוד תרמי</text><circle cx="392" cy="314" r="9" fill="#1F4B5C" stroke="#1F4B5C" stroke-width="2"/><text x="374.0" y="315.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:14px;font-weight:600" fill="#12202A">46.5 חודשים</text><text x="374.0" y="333.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:12.5px;font-weight:400" fill="#3E4C58">לפני סוף 4 שנים: צנרת, ביוב, איטום ורטיבות</text><circle cx="392" cy="360" r="9" fill="#1F4B5C" stroke="#1F4B5C" stroke-width="2"/><text x="374.0" y="361.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:14px;font-weight:600" fill="#12202A">58.5 חודשים</text><text x="374.0" y="379.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:12.5px;font-weight:400" fill="#3E4C58">לפני סוף 5 שנים: סדקים מעל 1.5 מ״מ בקירות שאינם נושאים</text><circle cx="392" cy="406" r="9" fill="#1F4B5C" stroke="#1F4B5C" stroke-width="2"/><text x="374.0" y="407.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:14px;font-weight:600" fill="#12202A">82.5 חודשים</text><text x="374.0" y="425.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:12.5px;font-weight:400" fill="#3E4C58">לפני סוף 7 שנים: חיפוי חוץ שמתנתק או מתפורר</text><text x="410.0" y="482.0" text-anchor="start" style="font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-size:12px;font-weight:400" fill="#5E6A75">אחרי כל תקופת בדק יש עוד 3 שנות אחריות; בהן נטל ההוכחה עליכם.</text></svg>