<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{
  --nlcb-cream:#FAF7F1;
  --nlcb-ink:#1B1A17;
  --nlcb-gold:#9C7A3C;
  --nlcb-terracotta:#C2563A;
  --nlcb-sage:#7A8F6A;
  --nlcb-border:#D9D2C4;
  --nlcb-muted:#6B6457;
  --nlcb-dark:#14130F;
  --nlcb-dark2:#211F19;
  --nlcb-line:rgba(242,236,222,.14);
  --nlcb-radius:6px;
  --nlcb-shadow-card:0 8px 24px -12px rgba(27,26,23,.18);
  --nlcb-shadow-theater:0 40px 90px -30px rgba(20,19,15,.55);
}
.nlcb-shell,.nlcb-shell *{box-sizing:border-box}
.nlcb-shell{font-family:Heebo,Assistant,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--nlcb-ink);background:var(--nlcb-cream);line-height:1.55;overflow-x:clip}
.nlcb-shell[dir="ltr"]{font-family:"Inter Tight",Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.nlcb-shell h1,.nlcb-shell h2,.nlcb-shell h3{font-family:"Frank Ruhl Libre",Georgia,serif;line-height:1.15;margin:0;color:var(--nlcb-ink)}
.nlcb-shell[dir="ltr"] h1,.nlcb-shell[dir="ltr"] h2,.nlcb-shell[dir="ltr"] h3{font-family:Fraunces,Georgia,serif}
.nlcb-wrap{width:min(1200px,100% - 28px);margin-inline:auto}
.nlcb-muted{color:var(--nlcb-muted)}
.nlcb-eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--nlcb-gold);font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase}
.nlcb-eyebrow:after{content:"";width:34px;height:2px;background:var(--nlcb-gold);display:inline-block}
.nlcb-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:var(--nlcb-radius);border:1px solid var(--nlcb-border);background:#fff;color:var(--nlcb-ink);font:inherit;font-weight:700;text-decoration:none;cursor:pointer;transition:.18s ease;white-space:nowrap}
.nlcb-btn:hover{transform:translateY(-1px);box-shadow:var(--nlcb-shadow-card)}
.nlcb-btn--primary{background:var(--nlcb-terracotta);border-color:var(--nlcb-terracotta);color:#fff}
.nlcb-btn--ink{background:var(--nlcb-ink);border-color:var(--nlcb-ink);color:#fff}
.nlcb-btn--small{min-height:34px;padding:0 12px;font-size:13px}
.nlcb-badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;background:#F5EFE3;color:var(--nlcb-muted);border:1px solid var(--nlcb-border)}
.nlcb-badge[data-status="available"]{background:rgba(122,143,106,.16);color:#415434;border-color:rgba(122,143,106,.35)}
.nlcb-badge[data-status="reserved"]{background:rgba(156,122,60,.16);color:#6f5222;border-color:rgba(156,122,60,.34)}
.nlcb-badge[data-status="sold"]{background:rgba(106,100,87,.12);color:#6b6457;border-color:rgba(106,100,87,.22)}
.nlcb-langbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nlcb-langbar a,.nlcb-langbar button{min-width:36px;height:32px;border-radius:999px;border:1px solid var(--nlcb-border);background:#fff;color:var(--nlcb-muted);font:inherit;font-size:12px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0 9px}
.nlcb-langbar [aria-current="true"]{background:var(--nlcb-ink);border-color:var(--nlcb-ink);color:#fff}
.nlcb-project-header{position:relative;z-index:10;background:rgba(250,247,241,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--nlcb-border)}
.nlcb-project-header__row{min-height:66px;display:flex;justify-content:space-between;gap:18px;align-items:center}
.nlcb-brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--nlcb-ink)}
.nlcb-brand__mark{width:40px;height:40px;border-radius:10px;background:var(--nlcb-ink);display:grid;place-items:center;color:#E4CE92;font-weight:900;letter-spacing:.5px}
.nlcb-brand__name{font-family:Georgia,serif;font-size:22px;font-weight:700;letter-spacing:1px}
.nlcb-brand__sub{display:block;font-size:10px;letter-spacing:2px;color:var(--nlcb-muted);margin-top:2px}
.nlcb-nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.nlcb-nav a{font-size:14px;color:#4b4639;text-decoration:none;font-weight:600}
.nlcb-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.86fr);gap:clamp(22px,4vw,54px);align-items:center;padding:clamp(32px,5vw,70px) 0 clamp(20px,3vw,36px)}
.nlcb-hero h1{font-size:clamp(42px,6.6vw,72px);font-weight:500;margin:12px 0 10px}
.nlcb-hero__lede{font-size:clamp(16px,1.7vw,20px);line-height:1.48;color:#423d33;max-width:54ch;margin:0}
.nlcb-hero__ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.nlcb-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:28px;padding-top:22px;border-top:1px solid var(--nlcb-border);max-width:560px}
.nlcb-fact strong{display:block;font-family:"Frank Ruhl Libre",Georgia,serif;font-size:clamp(25px,3vw,34px);line-height:1;color:var(--nlcb-ink)}
.nlcb-fact span{display:block;color:var(--nlcb-muted);font-size:13px;margin-top:6px}
.nlcb-hero__media{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;border:1px solid var(--nlcb-border);box-shadow:var(--nlcb-shadow-card);background:#eee7d8}
.nlcb-hero__media img{width:100%;height:100%;object-fit:cover;display:block}
.nlcb-demo{position:absolute;top:12px;inset-inline-end:12px;background:rgba(20,19,15,.58);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:4px;font-size:11px;padding:4px 10px;backdrop-filter:blur(4px)}
.nlcb-secnav{position:relative;z-index:8;background:rgba(250,247,241,.94);backdrop-filter:blur(8px);border-top:1px solid var(--nlcb-border);border-bottom:1px solid var(--nlcb-border)}
.nlcb-secnav__row{display:flex;gap:24px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.nlcb-secnav a{white-space:nowrap;font-size:14px;font-weight:700;color:#4b4639;text-decoration:none;padding-bottom:5px;border-bottom:2px solid transparent}
.nlcb-secnav a:hover,.nlcb-secnav a.is-active{color:var(--nlcb-ink);border-bottom-color:var(--nlcb-gold)}
.nlcb-section{padding:clamp(40px,5.4vw,72px) 0 0}
.nlcb-section__head{display:flex;justify-content:space-between;gap:18px;align-items:end;flex-wrap:wrap;margin-bottom:18px}
.nlcb-section h2{font-size:clamp(26px,3.4vw,42px);font-weight:500;margin-top:8px}
.nlcb-section p.nlcb-section__sub{font-size:17px;max-width:68ch;color:#423d33;margin:8px 0 0}
.nlcb-theater{border-radius:16px;overflow:hidden;border:1px solid rgba(20,19,15,.5);background:var(--nlcb-dark);box-shadow:var(--nlcb-shadow-theater);position:relative;color:#F4EEDE}
.nlcb-theater__top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;padding:clamp(16px,2.5vw,24px);border-bottom:1px solid var(--nlcb-line);background:linear-gradient(180deg,rgba(33,31,25,.92),rgba(20,19,15,.72))}
.nlcb-theater__top h2{color:#fff;font-size:clamp(22px,2.8vw,34px)}
.nlcb-view-toggle{display:flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--nlcb-line)}
.nlcb-view-toggle button{border:0;background:transparent;color:#B8B1A2;border-radius:999px;min-height:34px;padding:0 14px;font:inherit;font-weight:800;cursor:pointer}
.nlcb-view-toggle button[aria-pressed="true"]{background:linear-gradient(180deg,#b9923f,#9C7A3C);color:#fff}
.nlcb-theater__body{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,390px);min-height:clamp(560px,70vh,760px)}
.nlcb-stage{position:relative;min-width:0;min-height:460px;background:radial-gradient(circle at 46% 38%,rgba(255,255,255,.1),transparent 38%),linear-gradient(180deg,#0b3433,#0a201f)}
.nlcb-stage__media,.nlcb-stage__plate{position:absolute;inset:0;width:100%;height:100%}
.nlcb-stage__media{background:linear-gradient(180deg,#111,#222)}
.nlcb-stage model-viewer{width:100%;height:100%;background:transparent;direction:ltr;--poster-color:transparent}
.nlcb-stage__plate{background-size:cover;background-position:center;opacity:.98}
.nlcb-stage__shade{position:absolute;inset:0;background:radial-gradient(circle at 48% 43%,rgba(255,255,255,0),rgba(8,7,5,.54) 74%),linear-gradient(0deg,rgba(7,6,5,.45),transparent 36%);pointer-events:none}
.nlcb-marker{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:inherit;font-weight:900;font-size:13px;color:#fff;border:2px solid var(--nlcb-sage);background:rgba(18,17,13,.52);box-shadow:0 4px 14px rgba(0,0,0,.45);cursor:pointer;z-index:4;transition:.18s ease}
[dir="rtl"] .nlcb-marker{transform:translate(50%,-50%)}
.nlcb-marker:hover,.nlcb-marker.is-active{background:rgba(122,143,106,.42);box-shadow:0 0 0 7px rgba(122,143,106,.18),0 6px 18px rgba(0,0,0,.5);transform:translate(-50%,-50%) scale(1.09)}
[dir="rtl"] .nlcb-marker:hover,[dir="rtl"] .nlcb-marker.is-active{transform:translate(50%,-50%) scale(1.09)}
.nlcb-marker[data-status="reserved"]{border-color:var(--nlcb-gold)}
.nlcb-marker[data-status="sold"]{border-color:#9aa29a;opacity:.72}
.nlcb-legend{position:absolute;bottom:16px;inset-inline-end:16px;display:flex;gap:12px;flex-wrap:wrap;padding:8px 13px;border-radius:999px;background:rgba(12,11,8,.66);border:1px solid var(--nlcb-line);backdrop-filter:blur(6px);font-size:12px;font-weight:700;color:#d7d0c0;z-index:5}
.nlcb-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-inline-end:6px;background:var(--nlcb-sage)}
.nlcb-dot--reserved{background:var(--nlcb-gold)}.nlcb-dot--sold{background:#9aa29a}
.nlcb-unit-panel{background:linear-gradient(180deg,rgba(28,26,21,.98),rgba(17,16,12,.98));border-inline-start:1px solid var(--nlcb-line);padding:clamp(16px,2.5vw,24px);display:flex;flex-direction:column;gap:14px;min-width:0}
.nlcb-unit-panel h3{font-size:clamp(24px,2.6vw,34px);color:#fff;font-weight:500;margin-top:8px;overflow-wrap:anywhere}
.nlcb-unit-meta{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.nlcb-floor{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:42px;line-height:1;color:#fff;text-align:center}
.nlcb-floor span{display:block;font-family:inherit;font-size:12px;color:#D8C79A;font-weight:700;margin-bottom:4px}
.nlcb-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.nlcb-kpi{background:rgba(255,255,255,.055);border:1px solid rgba(242,236,222,.08);border-radius:10px;padding:10px 12px;color:#fff}
.nlcb-kpi span{display:block;color:#B8B1A2;font-size:12px;margin-bottom:3px}.nlcb-kpi strong{font-size:16px}.nlcb-kpi--wide{grid-column:1/-1}
.nlcb-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.nlcb-tabs button{min-height:38px;border-radius:8px;border:1px solid rgba(242,236,222,.14);background:rgba(255,255,255,.05);color:#efe7d6;font:inherit;font-weight:700;cursor:pointer}
.nlcb-tabs button[aria-pressed="true"]{background:linear-gradient(180deg,#b9923f,#9C7A3C);color:#fff}
.nlcb-panel-body{min-height:160px;border:1px solid rgba(242,236,222,.14);background:rgba(10,10,7,.5);border-radius:11px;overflow:hidden;display:grid;place-items:center;color:#cfc8b6;text-align:center;padding:12px}
.nlcb-panel-body img{max-width:100%;max-height:220px;display:block}
.nlcb-form{display:grid;gap:9px;margin-top:auto;border-top:1px solid var(--nlcb-line);padding-top:16px}
.nlcb-form label{font-weight:800;color:#fff;font-size:15px}.nlcb-form input{width:100%;min-height:44px;border-radius:7px;border:1px solid rgba(242,236,222,.2);background:rgba(255,255,255,.06);color:#fff;font:inherit;padding:0 12px}.nlcb-form__row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.nlcb-form small{color:#9a9384;line-height:1.45}.nlcb-form__msg{font-size:13px;color:#d6f5e2;background:rgba(122,143,106,.15);border-radius:8px;padding:8px;display:none}.nlcb-form.is-done .nlcb-form__msg{display:block}
.nlcb-inventory{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.nlcb-unit-card{text-align:inherit;border:1px solid var(--nlcb-border);background:#fff;border-radius:9px;padding:14px;box-shadow:none;cursor:pointer;font:inherit;transition:.16s ease}.nlcb-unit-card:hover,.nlcb-unit-card.is-active{border-color:var(--nlcb-gold);box-shadow:0 8px 22px -10px rgba(156,122,60,.3)}.nlcb-unit-card__top{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--nlcb-muted);font-size:12px}.nlcb-unit-card strong{display:block;font-family:"Frank Ruhl Libre",Georgia,serif;font-size:18px;margin:9px 0 2px}.nlcb-unit-card span:last-child{font-size:13px;color:var(--nlcb-muted)}
.nlcb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.nlcb-card{background:#fff;border:1px solid var(--nlcb-border);border-radius:12px;padding:18px;box-shadow:var(--nlcb-shadow-card)}.nlcb-card h3{font-size:20px;font-weight:500;margin:8px 0 6px}.nlcb-card p{color:#4b4639;margin:0}.nlcb-card__icon{width:38px;height:38px;border-radius:9px;background:#EFEAE0;color:var(--nlcb-gold);display:grid;place-items:center}
.nlcb-price{display:grid;grid-template-columns:.86fr 1.14fr;gap:18px}.nlcb-estimate{background:linear-gradient(150deg,var(--nlcb-ink),var(--nlcb-dark2));color:#FAF7F1;border-radius:12px;padding:22px}.nlcb-estimate strong{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:clamp(30px,3.4vw,42px);display:block;line-height:1.1;margin:8px 0;color:#fff}.nlcb-estimate p{color:#cfc8b6;margin:0}.nlcb-table{border:1px solid var(--nlcb-border);border-radius:12px;background:#fff;overflow:hidden}.nlcb-table table{width:100%;border-collapse:collapse;font-size:14px}.nlcb-table th,.nlcb-table td{padding:10px 12px;border-top:1px solid #ECE6DA;text-align:inherit}.nlcb-table thead th{background:#FBF9F4;color:var(--nlcb-muted);font-weight:800;border-top:0}.nlcb-source{padding:10px 12px;border-top:1px solid #ECE6DA;color:var(--nlcb-muted);font-size:12px}
.nlcb-mapbox{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.nlcb-map{position:relative;min-height:350px;border-radius:12px;border:1px solid var(--nlcb-border);background:#EAF0EC;overflow:hidden;box-shadow:var(--nlcb-shadow-card)}.nlcb-map svg{width:100%;height:100%;display:block}.nlcb-map-pin{position:absolute;transform:translate(-50%,-100%);background:var(--nlcb-terracotta);color:#fff;border:2px solid #fff;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.16)}[dir="rtl"] .nlcb-map-pin{transform:translate(50%,-100%)}.nlcb-spokes{display:grid;gap:10px}.nlcb-chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.nlcb-chip{font-size:13px;background:#EFEAE0;border-radius:999px;padding:4px 11px;color:#4b4639}.nlcb-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nlcb-stat{background:#fff;border:1px solid var(--nlcb-border);border-radius:10px;padding:13px}.nlcb-stat strong{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:24px}.nlcb-stat span{font-size:12px;color:var(--nlcb-muted);display:block}
.nlcb-seo{max-width:780px;margin-inline:auto}.nlcb-seo h2{font-size:clamp(26px,3.2vw,38px)}.nlcb-seo p,.nlcb-existing-content p{font-size:17px;line-height:1.75;color:#2f2c25}.nlcb-note{background:#FCF7EC;border-inline-start:3px solid var(--nlcb-gold);border-radius:4px;padding:16px 18px;margin-top:18px;color:#4b4639}.nlcb-note strong{display:block;margin-bottom:4px;color:var(--nlcb-ink)}
.nlcb-gallery{background:var(--nlcb-cream);padding:clamp(38px,6vw,80px) 0}.nlcb-gallery__head{display:flex;justify-content:space-between;gap:18px;align-items:end;flex-wrap:wrap;margin-bottom:20px}.nlcb-project-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.nlcb-project-card{background:#fff;border:1px solid var(--nlcb-border);border-radius:13px;overflow:hidden;text-decoration:none;color:var(--nlcb-ink);box-shadow:var(--nlcb-shadow-card);display:flex;flex-direction:column}.nlcb-project-card__img{position:relative;aspect-ratio:4/3;background-size:cover;background-position:center}.nlcb-project-card__body{padding:16px}.nlcb-project-card h3{font-size:24px}.nlcb-project-card p{color:var(--nlcb-muted);margin:6px 0 14px}.nlcb-project-card__meta{display:flex;justify-content:space-between;gap:10px;color:var(--nlcb-muted);font-size:13px}.nlcb-home-showcase{display:grid;grid-template-columns:1fr .92fr;gap:18px;align-items:stretch}.nlcb-home-stage{background:var(--nlcb-dark);border-radius:16px;overflow:hidden;min-height:420px;position:relative}.nlcb-home-stage img{width:100%;height:100%;object-fit:cover;opacity:.92}.nlcb-home-stage:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 45% 40%,transparent,rgba(20,19,15,.7) 72%)}.nlcb-home-copy{padding:clamp(22px,3vw,36px);border:1px solid var(--nlcb-border);border-radius:16px;background:#fff;box-shadow:var(--nlcb-shadow-card)}.nlcb-home-copy h2{font-size:clamp(32px,4.5vw,58px)}

.nlcb-sticky{position:fixed;inset-inline:16px;bottom:16px;z-index:99;display:flex;justify-content:flex-end;pointer-events:none}.nlcb-sticky__bar{pointer-events:auto;display:flex;gap:8px;background:rgba(250,247,241,.94);border:1px solid var(--nlcb-border);box-shadow:0 14px 38px -18px rgba(27,26,23,.3);border-radius:12px;padding:8px;backdrop-filter:blur(10px)}

    return '<section class="nlcb-section nlcb-wrap" id="price"><div class="nlcb-section__head"><div><span class="nlcb-eyebrow">'+esc(tr(payload,'price'))+'</span><h2>'+esc(tr(payload,'priceTitle'))+'</h2></div></div><div class="nlcb-price"><div class="nlcb-estimate"><div>'+esc(tr(payload,'estimate'))+'</div><strong>'+priceText+'</strong><p>'+esc(tr(payload,'estimateNote'))+'</p></div><div class="nlcb-table"><div style="padding:14px 12px;font-weight:800">'+esc(tr(payload,'compsTitle'))+'</div><table><thead><tr><th>'+esc(tr(payload,'address'))+'</th><th>'+esc(tr(payload,'rooms'))+'</th><th>'+esc(tr(payload,'area'))+'</th><th>'+esc(tr(payload,'price'))+'</th><th>'+esc(tr(payload,'date'))+'</th></tr></thead><tbody>'+rows+'</tbody></table><div class="nlcb-source">'+esc(tr(payload,'source'))+'</div></div></div></section>';
  }
  function world(payload){return '<section class="nlcb-section nlcb-wrap" id="world"><div class="nlcb-section__head"><div><span class="nlcb-eyebrow">'+esc(tr(payload,'world'))+'</span><h2>'+esc(tr(payload,'worldTitle'))+'</h2><p class="nlcb-section__sub">'+esc(tr(payload,'worldSub'))+'</p></div></div><div class="nlcb-mapbox"><div class="nlcb-map"><svg viewBox="0 0 400 300" preserveAspectRatio="none" aria-hidden="true"><rect width="400" height="300" fill="#EAF0EC"/><rect x="0" y="0" width="92" height="300" fill="#AFCDD6"/><path d="M92 0 Q104 70 96 150 Q88 230 100 300 L116 300 Q108 220 116 150 Q124 70 112 0 Z" fill="#E8DEC6"/><path d="M300 0 L400 0 L400 90 Q340 80 300 0 Z" fill="#CBDDB8"/><g fill="#DAD3C4"><rect x="150" y="40" width="48" height="40" rx="3"/><rect x="210" y="40" width="55" height="40" rx="3"/><rect x="150" y="95" width="48" height="46" rx="3"/><rect x="278" y="110" width="50" height="44" rx="3"/><rect x="150" y="160" width="60" height="50" rx="3"/><rect x="230" y="170" width="48" height="46" rx="3"/></g><g stroke="#fff" stroke-width="7"><path d="M128 0 V300"/><path d="M222 0 V300"/><path d="M290 0 V300"/><path d="M120 88 H400"/><path d="M118 222 H400"/></g><path d="M128 300 V0" stroke="#7A8F6A" stroke-width="2.5" stroke-dasharray="7 5" opacity=".8"/></svg><span class="nlcb-map-pin" style="left:39%;top:50%">'+esc((payload.project&&payload.project.title)||'Project')+'</span></div><div class="nlcb-spokes"><div class="nlcb-card"><div class="nlcb-card__icon">↥</div><h3>'+esc(tr(payload,'transport'))+'</h3><div class="nlcb-chiprow"><span class="nlcb-chip">'+esc(tr(payload,'rail'))+'</span><span class="nlcb-chip">'+esc(tr(payload,'roads'))+'</span></div></div><div class="nlcb-card"><div class="nlcb-card__icon">⌂</div><h3>'+esc(tr(payload,'education'))+'</h3><div class="nlcb-chiprow"><span class="nlcb-chip">'+esc(tr(payload,'school'))+'</span><span class="nlcb-chip">'+esc(tr(payload,'park'))+'</span></div></div><div class="nlcb-stats"><div class="nlcb-stat"><strong>16,000</strong><span>'+esc(tr(payload,'homes'))+'</span></div><div class="nlcb-stat"><strong>TA/4444</strong><span>'+esc(tr(payload,'about'))+'</span></div></div></div></div></section>';}
  function seo(payload){var p=payload.project||{},l=langOf(payload);return '<section class="nlcb-section nlcb-wrap" id="about"><div class="nlcb-seo"><span class="nlcb-eyebrow">'+esc(tr(payload,'about'))+'</span><h2>'+esc(localized(p,l,'seo_h')||tr(payload,'seoTitle'))+'</h2><p>'+esc(localized(p,l,'seo_p')||tr(payload,'seo1'))+'</p><p>'+esc(tr(payload,'seo2'))+'</p><div class="nlcb-note"><strong>'+esc(tr(payload,'bottomLine'))+'</strong><span>'+esc(tr(payload,'disclaimer'))+'</span></div></div></section>';}
  function sticky(payload){return '<div class="nlcb-sticky"><div class="nlcb-sticky__bar"><a class="nlcb-btn nlcb-btn--primary" href="#inquiry">'+esc(tr(payload,'enquire'))+'</a><a class="nlcb-btn nlcb-btn--ink" href="https://wa.me/" rel="nofollow">WhatsApp</a></div></div>';}
  function renderShowroom(root,payload){rootLang(root,payload);root.innerHTML=header(payload)+hero(payload)+secnav(payload)+theater(payload)+inventory(payload)+price(payload)+world(payload)+seo(payload)+sticky(payload); bindShowroom(root,payload);}
  function bindShowroom(root,payload){root.addEventListener('click',function(e){var m=e.target.closest('[data-unit]'); if(m){var id=m.getAttribute('data-unit'); payload.project.selected_unit=id; renderShowroom(root,payload); setTimeout(function(){var panel=root.querySelector('#inquiry'); if(panel) panel.scrollIntoView({block:'nearest'});},20); return;} var lang=e.target.closest('[data-nlcb-lang]'); if(lang){payload.lang=lang.getAttribute('data-nlcb-lang'); renderShowroom(root,payload); return;} var view=e.target.closest('[data-view]'); if(view){var mode=view.getAttribute('data-view'); root.querySelectorAll('[data-view]').forEach(function(b){b.setAttribute('aria-pressed',b===view?'true':'false')}); var model=root.querySelector('[data-model-view]'),facade=root.querySelector('[data-facade-view]'); if(model&&facade){model.style.display=mode==='model'?'block':'none';facade.style.display=mode==='facade'?'block':'none';} return;} var tab=e.target.closest('[data-tab]'); if(tab){var body=root.querySelector('[data-panel-body]');var u=selectedUnit(payload),p=payload.project||{}; root.querySelectorAll('[data-tab]').forEach(function(b){b.setAttribute('aria-pressed',b===tab?'true':'false')}); var tname=tab.getAttribute('data-tab'); if(tname==='plan') body.innerHTML='<img src="'+esc(planFor(p,u))+'" alt="'+esc(tr(payload,'plan'))+'">'; if(tname==='view') body.innerHTML='<p>'+esc(tr(payload,'viewMissing'))+'</p>'; if(tname==='tour') body.innerHTML='<p>'+esc(tr(payload,'tourMissing'))+'</p>'; return;} }); root.addEventListener('submit',function(e){var f=e.target.closest('[data-lead-form]'); if(!f) return; e.preventDefault(); var name=f.querySelector('[name="name"]').value.trim(),phone=f.querySelector('[name="phone"]').value.trim(),email=f.querySelector('[name="email"]').value.trim(); var msg=f.querySelector('.nlcb-form__msg'); if(!name||(!phone&&!email)){msg.textContent=tr(payload,'needFields');msg.style.display='block';msg.style.color='#ffd9d3';return;} msg.textContent=tr(payload,'thanks'); f.classList.add('is-done'); var endpoint=(payload.config&&payload.config.lead_endpoint)||''; if(endpoint&&window.fetch){var fd={name:name,phone:phone,email:email,project:(payload.project&&payload.project.slug)||'',unit:selectedUnit(payload).id||''}; try{fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fd)}).catch(function(){});}catch(err){}} });}
  function renderGallery(root,payload){rootLang(root,payload);var projects=payload.projects||[];var lead=projects[0]||{};root.innerHTML='<section class="nlcb-gallery"><div class="nlcb-wrap"><div class="nlcb-gallery__head"><div><span class="nlcb-eyebrow">'+esc(tr(payload,'galleryTitle'))+'</span><h2>'+esc(tr(payload,'homeTitle'))+'</h2><p class="nlcb-section__sub">'+esc(tr(payload,'homeLead'))+'</p></div>'+langBar(payload)+'</div><div class="nlcb-home-showcase"><div class="nlcb-home-stage"><img src="'+esc(lead.poster||lead.facade||'')+'" alt="'+esc(lead.title||'')+'"></div><div class="nlcb-home-copy"><h2>'+esc(lead.title||tr(payload,'galleryTitle'))+'</h2><p>'+esc(localized(lead,langOf(payload),'hero_p')||lead.tagline||tr(payload,'gallerySub'))+'</p><a class="nlcb-btn nlcb-btn--primary" href="'+esc(lead.url||'#')+'">'+esc(tr(payload,'explore'))+'</a></div></div><div class="nlcb-project-cards" style="margin-top:18px">'+projects.map(function(p){return '<a class="nlcb-project-card" href="'+esc(p.url||'#')+'"><div class="nlcb-project-card__img" style="background-image:url('+esc(p.poster||p.facade||'')+')"><span class="nlcb-demo">'+esc(tr(payload,'demo'))+'</span></div><div class="nlcb-project-card__body"><h3>'+esc(p.title||p.name||'Project')+'</h3><p>'+esc(localized(p,langOf(payload),'hero_p')||p.tagline||'')+'</p><div class="nlcb-project-card__meta"><span>'+esc(format(tr(payload,'unitsCount'),{n:(p.units||[]).length}))+'</span><strong>'+esc(tr(payload,'explore'))+'</strong></div></div></a>';}).join('')+'</div></div></section>'; root.addEventListener('click',function(e){var lang=e.target.closest('[data-nlcb-lang]'); if(lang){payload.lang=lang.getAttribute('data-nlcb-lang'); renderGallery(root,payload);}});}
  function init(){document.querySelectorAll('.nlcb-showroom').forEach(function(root){renderShowroom(root,parse(root));});document.querySelectorAll('.nlcb-gallery-root').forEach(function(root){renderGallery(root,parse(root));});}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
</script></body></html>
