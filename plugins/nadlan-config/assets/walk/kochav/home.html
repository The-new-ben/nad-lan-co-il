<!doctype html>
<html lang="he" dir="rtl"><head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta charset="utf-8">
<title>סיור בבית · כוכב הצפון</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>

.btn{font:600 14px inherit;font-family:inherit;background:var(--glass);color:var(--ink);border:1.5px solid var(--ink);min-height:44px;padding:8px 14px;cursor:pointer}
.btn.pri{background:var(--ink);color:#fff}

#rooms button{font:600 14px inherit;font-family:inherit;background:var(--glass);border:1.5px solid var(--ink);padding:0;cursor:pointer;display:grid;grid-template-rows:auto auto;width:132px;text-align:start;overflow:hidden}

#view figure{margin:0;max-width:min(1100px,100%);background:var(--sheet);border:1.5px solid var(--ink)}
#view img{display:block;width:100%;height:auto}
#view figcaption{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 14px;font-size:14px}
body.emb #top{padding-top:calc(env(safe-area-inset-top,0px) + 66px)}
#furn{display:flex;border:1.5px solid var(--ink);background:var(--glass)}
#furn button{font:600 13px inherit;font-family:inherit;border:0;background:none;padding:6px 12px;min-height:40px;cursor:pointer;color:var(--ink)}
#furn button.on{background:var(--ink);color:#fff}
@media (max-width:760px){.btn{min-height:40px;padding:6px 10px;font-size:13px}#acts{flex-wrap:nowrap}#rooms{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start}#rooms button{flex:0 0 112px;width:112px}.ttl small{display:none}#acts{margin-inline-start:0}}
</style>
</head><body>
<canvas id="c"></canvas>
<div class="hud" id="top">
  <div class="ttl"><b id="tT"></b><small id="tS"></small></div>
  <div id="acts"><div id="furn" hidden><button type="button" data-f="0" class="on"></button><button type="button" data-f="1"></button></div><button class="btn" id="vBtn" type="button"></button><a class="btn pri" id="back" href="index.html"></a></div>
</div>
<div class="hud" id="rooms"></div>
<div class="hud" id="hint"></div>
<div id="view" hidden><figure><img id="vImg" src="view-11.jpg" alt=""><figcaption><span id="vCap"></span><button class="btn" id="vX" type="button"></button></figcaption></figure></div>

<script type="module">

addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') yaw += 0.1; if (e.key === 'ArrowRight') yaw -= 0.1; if (e.key === 'Escape') $('view').hidden = true; });
