  <path d="M392 142 650 102l80 704-414 34z" fill="none" stroke="url(#gold)" stroke-width="4" filter="url(#glow)"/>
  <path d="M430 178 614 150l54 604-292 24z" fill="#ffffff" opacity=".035" stroke="#ead8a3" stroke-opacity=".22" stroke-width="1"/>
