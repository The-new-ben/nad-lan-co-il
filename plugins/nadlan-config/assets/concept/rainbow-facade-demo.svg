      <stop offset=".32" stop-color="#f0efe6"/>
      <stop offset=".72" stop-color="#bfcfd0"/>
      <stop offset="1" stop-color="#75888a"/>
    </linearGradient>
    <linearGradient id="champagne" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4bf"/>
      <stop offset=".52" stop-color="#d9bd76"/>
      <stop offset="1" stop-color="#8c6b32"/>
    </linearGradient>
    <linearGradient id="unitGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".68"/>
      <stop offset=".45" stop-color="#bde7e5" stop-opacity=".5"/>
      <stop offset="1" stop-color="#496c70" stop-opacity=".38"/>
