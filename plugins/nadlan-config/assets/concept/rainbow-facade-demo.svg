<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative coastal tower facade concept</title>
  <desc id="desc">Original line drawing concept for an interactive new-build apartment selector. Not an official architectural drawing.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#092425"/>
      <stop offset=".55" stop-color="#123c3e"/>
      <stop offset="1" stop-color="#071515"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2dfaa"/>
      <stop offset=".55" stop-color="#b99552"/>
      <stop offset="1" stop-color="#6f5529"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ead8a3" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#sky)"/>
  <rect width="1000" height="1000" fill="url(#grid)"/>
