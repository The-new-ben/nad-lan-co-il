<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Rainbow Tel Aviv illustrative facade apartment selector</title>
  <desc id="desc">Original non-official concept image: a white sculptural coastal tower, boutique buildings, lagoon and sea context, prepared for apartment-cell selection overlays.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#062327"/>
      <stop offset=".42" stop-color="#0b3940"/>
      <stop offset=".76" stop-color="#102a2a"/>
      <stop offset="1" stop-color="#0b1615"/>
    </linearGradient>
    <radialGradient id="coastGlow" cx=".28" cy=".22" r=".68">
      <stop offset="0" stop-color="#fff2c3" stop-opacity=".24"/>
      <stop offset=".34" stop-color="#6ecad7" stop-opacity=".16"/>
      <stop offset="1" stop-color="#071312" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2=".2">
      <stop offset="0" stop-color="#1f7e94" stop-opacity=".32"/>
      <stop offset=".55" stop-color="#2aa6b7" stop-opacity=".26"/>
      <stop offset="1" stop-color="#0a2830" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
