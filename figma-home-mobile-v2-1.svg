      <line x1="264" y1="735" x2="234" y2="735" stroke="#FDFCF8" stroke-width="1.3"/>
      <rect x="34" y="682" width="90" height="26" rx="13" fill="#172429" opacity=".9"/>
      <text x="79" y="700" text-anchor="middle" class="he small" fill="#FFFFFF" font-weight="700">תצוגת 3D</text>
      <rect x="20" y="792" width="350" height="52" fill="#172429"/>
      <text x="195" y="825" text-anchor="middle" class="he body" fill="#FFFFFF" font-weight="700">לראות את הפרויקט בתלת ממד</text>
