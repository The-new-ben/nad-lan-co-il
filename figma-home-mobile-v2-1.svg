<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">דף הבית של nad-lan בתצוגת מובייל</title>
  <desc id="desc">דף בית נייד עם כותרת קצרה, חיפוש, תמונת SIX8 וכניסה לסיור בפרויקט.</desc>
  <defs>
    <style>
      .he{font-family:Arial,sans-serif;direction:rtl;unicode-bidi:isolate}
      .en{font-family:Arial,sans-serif;direction:ltr;unicode-bidi:isolate}
      .ink{fill:#172429}
      .muted{fill:#68757A}
      .body{font-size:15px}
      .small{font-size:12px}
      .h1{font-size:38px;font-weight:700;letter-spacing:-.045em}
    </style>
    <clipPath id="project"><rect x="20" y="414" width="350" height="220" rx="2"/></clipPath>
    <clipPath id="tour"><rect x="20" y="668" width="350" height="176" rx="2"/></clipPath>
  </defs>

  <rect width="390" height="844" fill="#F3F0E8"/>

  <rect x="0" y="0" width="390" height="60" fill="#FDFCF8"/>
  <line x1="0" y1="59.5" x2="390" y2="59.5" stroke="#D2D6D1"/>
  <text x="366" y="38" text-anchor="end" class="en ink" font-size="21" font-weight="700">nad-lan</text>
  <line x1="22" y1="23" x2="43" y2="23" stroke="#172429" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="30" x2="43" y2="30" stroke="#172429" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="37" x2="43" y2="37" stroke="#172429" stroke-width="2" stroke-linecap="round"/>

  <g class="he ink">
    <text x="370" y="112" text-anchor="start" class="h1">
      <tspan x="370" dy="0">מקום, דירה</tspan>
      <tspan x="370" dy="47">והמידע שצריך</tspan>
      <tspan x="370" dy="47">לפני שפונים</tspan>
    </text>
    <text x="370" y="260" text-anchor="start" class="body">
      <tspan x="370" dy="0">חפשו לפי עיר, שכונה, רחוב או שם.</tspan>
      <tspan x="370" dy="22">בדקו תוכניות ומידע על הסביבה לפני בחירה.</tspan>
    </text>
  </g>

  <rect x="20" y="330" width="350" height="56" rx="3" fill="#FFFFFF" stroke="#172429"/>
  <text x="344" y="365" text-anchor="start" class="he body muted">עיר, שכונה, רחוב או שם</text>
  <rect x="20" y="330" width="92" height="56" rx="3" fill="#C8523C"/>
  <text x="66" y="365" text-anchor="middle" class="he body" fill="#FFFFFF" font-weight="700">חיפוש</text>

  <g clip-path="url(#project)">
    <image href="file:///C:/Users/777/Documents/Codex/2026-09-01/nad-lan-redesign-directions/assets-v2-1/six8-official-source-view.jpg"
      x="-59" y="414" width="464" height="220" preserveAspectRatio="none"/>
  </g>
  <rect x="20" y="414" width="350" height="220" fill="none" stroke="#172429" stroke-width="0.8"/>

  <rect x="36" y="574" width="318" height="78" fill="#FDFCF8"/>
  <line x1="36" y1="574" x2="354" y2="574" stroke="#5B8E9A" stroke-width="5"/>
  <g class="he ink">
    <text x="334" y="608" text-anchor="start" font-size="24" font-weight="700">SIX8 תל אביב</text>
    <text x="334" y="634" text-anchor="start" class="small muted">הרברט סמואל, תל אביב</text>
  </g>

