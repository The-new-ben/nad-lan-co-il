        x="20" y="668" width="350" height="176" preserveAspectRatio="xMaxYMid slice"/>
      <rect x="20" y="668" width="350" height="176" fill="#172429" opacity=".12"/>
      <rect x="252" y="684" width="58" height="18" fill="#FDFCF8" opacity=".20"/>
      <rect x="252" y="705" width="58" height="18" fill="#FDFCF8" opacity=".20"/>
      <rect x="252" y="726" width="58" height="18" fill="#C8523C" opacity=".82"/>
