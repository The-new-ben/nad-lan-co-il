<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Video frame check</title>
<style>html,body{margin:0;background:#111;color:#ccc;font:12px monospace}video{max-width:48vw;max-height:90vh}</style></head>
<body>
<video id="v" muted playsinline preload="auto"></video>
<script>
'use strict';
// Loads ?src=<video file> and exposes window.__grab(t): seek to t seconds, return the decoded frame as PNG.
const v = document.getElementById('v');
const src = new URLSearchParams(location.search).get('src');
// python -m http.server has no HTTP Range support, so a plain URL is not seekable in Chrome.
// Load the whole file into a Blob URL instead: blob URLs are fully seekable.
window.__ready = fetch(src).then(r => { if (!r.ok) throw new Error('fetch ' + r.status); return r.blob(); })
  .then(blob => new Promise((res, rej) => {
    v.addEventListener('loadedmetadata', res, { once: true });
    v.addEventListener('error', () => rej(new Error('video error ' + (v.error && v.error.code))), { once: true });
    v.src = URL.createObjectURL(blob);
  }));
const once = (el, ev) => new Promise(r => el.addEventListener(ev, r, { once: true }));
window.__meta = async () => {
  await window.__ready;
  let d = v.duration;
  if (!isFinite(d)) {                       // fragmented file without a duration: scan to the end once
    const p = once(v, 'seeked'); v.currentTime = 1e7; await p; d = v.duration; v.currentTime = 0; await once(v, 'seeked');
  }
  return { duration: d, width: v.videoWidth, height: v.videoHeight };
};
window.__grab = async (t) => {
  await window.__ready;
  const p = once(v, 'seeked'); v.currentTime = t; await p;
  if (v.requestVideoFrameCallback) await new Promise(r => { v.requestVideoFrameCallback(() => r()); setTimeout(r, 400); });
  const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  return c.toDataURL('image/png');
};
// The sound track, decoded by Chrome (AAC/Opus in MP4): { sampleRate, duration, channels, env } where env is the
// RMS level every 10 ms of the mixed-down track (for onset timing checks).
let AUDIO = null;
async function decodeAudio() {
  if (AUDIO) return AUDIO;
  const buf = await (await fetch(src)).arrayBuffer();
  const ac = new OfflineAudioContext(1, 1, 48000);
  AUDIO = await ac.decodeAudioData(buf);
  return AUDIO;
}
window.__audio = async () => {
  let a;
  try { a = await decodeAudio(); } catch (e) { return { error: String(e) }; }
  const ch = a.getChannelData(0), hop = Math.round(a.sampleRate / 100), env = [];
  for (let i = 0; i + hop <= ch.length; i += hop) { let s = 0; for (let j = i; j < i + hop; j++) s += ch[j] * ch[j]; env.push(+Math.sqrt(s / hop).toFixed(5)); }
  return { sampleRate: a.sampleRate, duration: a.duration, channels: a.numberOfChannels, env };
};
// the sound track resampled to 16 kHz mono, as a base64 16-bit WAV (for a whisper transcript)
window.__wav16k = async () => {
  const a = await decodeAudio();
  const n = Math.ceil(a.duration * 16000);
  const oc = new OfflineAudioContext(1, n, 16000);
  const s = oc.createBufferSource(); s.buffer = a; s.connect(oc.destination); s.start();
  const r = await oc.startRendering();
  const pcm = r.getChannelData(0), out = new DataView(new ArrayBuffer(44 + pcm.length * 2));
  const str = (o, t) => { for (let i = 0; i < t.length; i++) out.setUint8(o + i, t.charCodeAt(i)); };
  str(0, 'RIFF'); out.setUint32(4, 36 + pcm.length * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true); out.setUint32(24, 16000, true);
  out.setUint32(28, 32000, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true); str(36, 'data'); out.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) out.setInt16(44 + i * 2, Math.max(-1, Math.min(1, pcm[i])) * 0x7FFF, true);
  const bytes = new Uint8Array(out.buffer); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
};
</script>
</body>
</html>
