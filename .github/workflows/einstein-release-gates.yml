name: Einstein release gates

on:
  pull_request:
    paths:
      - ".github/workflows/einstein-release-gates.yml"
      - "assets/projects/einstein-tower/**"
      - "docs/qa/einstein-tower-*"
      - "docs/wp-drafts/einstein-tower-*"
      - "scripts/**einstein**"
      - "scripts/templates/nadlan-*einstein*"
      - "scripts/templates/nadlan-unit-journey-deploy-helper.php.tpl"
      - "scripts/wp_deploy_private_unit_journey.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: einstein-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact pull-request source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /assets/projects/einstein-tower/
            /docs/qa/einstein-tower-flagship-stage-validation.json
            /docs/wp-drafts/einstein-tower-flagship-v3-private-stage.json
            /docs/wp-drafts/einstein-tower-flagship-v3-public-release.json
            /plugin-dist/nadlan-config-1.72.206.zip
            /plugin-dist/nadlan-config.json
            /scripts/

      - name: Fetch exact comparison commit
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="${{ github.event.before }}"
          fi
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$base"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.10.0"

      - name: Install static-analysis tools
        run: python -m pip install --disable-pip-version-check ruff==0.12.8

      - name: Reject whitespace errors
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="${{ github.event.before }}"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
            base="HEAD^"
          fi
          git diff --check "$base" HEAD

      - name: Require canonical LF in governed source
        shell: python
        run: |
          from pathlib import Path

          roots = (
              Path("assets/projects/einstein-tower"),
              Path("docs/qa"),
              Path("docs/wp-drafts"),
              Path("scripts"),
          )
          governed = []
          text_suffixes = {
              ".css", ".html", ".js", ".json", ".md", ".mjs", ".php",
              ".py", ".txt", ".yaml", ".yml",
          }
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  name = path.as_posix().lower()
                  is_text = path.suffix.lower() in text_suffixes or name.endswith(".php.tpl")
                  if is_text and (
                      "einstein" in name
                      or name.endswith("nadlan-unit-journey-deploy-helper.php.tpl")
                  ):
                      governed.append(path)
          bad = [path.as_posix() for path in governed if b"\r" in path.read_bytes()]
          if bad:
              raise SystemExit("Governed source is not canonical LF:\n" + "\n".join(sorted(bad)))

      - name: Reject newly introduced credential literals
        shell: python
        run: |
          import re
          import subprocess

          candidates = [
              "${{ github.event.pull_request.base.sha }}",
              "${{ github.event.before }}",
              "HEAD^",
          ]
          base = next(
              candidate
              for candidate in candidates
              if candidate
              and set(candidate) != {"0"}
              and subprocess.run(
                  ["git", "cat-file", "-e", f"{candidate}^{{commit}}"],
                  check=False,
              ).returncode
              == 0
          )
          diff = subprocess.run(
              ["git", "diff", "--unified=0", base, "HEAD", "--", ".", ":!*.lock"],
              check=True,
              capture_output=True,
              text=True,
              encoding="utf-8",
          ).stdout
          added = "\n".join(
              line[1:]
              for line in diff.splitlines()
              if line.startswith("+") and not line.startswith("+++")
          )
          keys = r"(?:WP_APP_PASSWORD|SANDBOX_POST_PASSWORD)"
          patterns = (
              rf"(?m)^\s*{keys}\s*=\s*['\"][^'\"]+['\"]\s*$",
              rf"['\"]{keys}['\"]\s*:\s*['\"][^'\"]+['\"]",
              r"Authorization\s*:\s*Basic\s+[A-Za-z0-9+/=]{16,}",
          )
          if any(re.search(pattern, added) for pattern in patterns):
              raise SystemExit("A governed diff introduces a credential literal.")

      - name: Validate retained-transaction resume vehicle
        shell: bash
        run: |
          if [[ -f scripts/wp_resume_einstein_stage_4527b2.py ]]; then
            python -m ruff check scripts/wp_resume_einstein_stage_4527b2.py
            PYTHONDONTWRITEBYTECODE=1 python -m py_compile scripts/wp_resume_einstein_stage_4527b2.py
            PYTHONDONTWRITEBYTECODE=1 python scripts/wp_resume_einstein_stage_4527b2.py --self-test
          fi

      - name: Validate independent live-recovery vehicle
        shell: bash
        run: |
          if [[ -f scripts/wp_audit_einstein_live_172207.py ]]; then
            python -m ruff check scripts/wp_audit_einstein_live_172207.py
            PYTHONDONTWRITEBYTECODE=1 python -m py_compile scripts/wp_audit_einstein_live_172207.py
            PYTHONDONTWRITEBYTECODE=1 python scripts/wp_audit_einstein_live_172207.py --self-test
          fi
