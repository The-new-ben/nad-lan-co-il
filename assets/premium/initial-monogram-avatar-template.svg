<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Premium monogram avatar template</title>
  <desc id="desc">Replace the text token with listing or professional initials. Designed as the no-photo fallback for Nadlan cards and profiles.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f3eadc"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7c08a"/>
      <stop offset="1" stop-color="#9c7a3c"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="144" height="144" rx="22" fill="url(#paper)"/>
  <rect x="8.75" y="8.75" width="142.5" height="142.5" rx="21.25" fill="none" stroke="#1b1a17" stroke-opacity=".12" stroke-width="1.5"/>
  <path d="M32 32h96M32 128h96" fill="none" stroke="#1b1a17" stroke-opacity=".18" stroke-width="1"/>
  <path d="M36 36h28M96 124h28" fill="none" stroke="url(#rule)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="80" cy="80" r="34" fill="#ffffff" fill-opacity=".68" stroke="#9c7a3c" stroke-opacity=".35" stroke-width="1.5"/>
  <text x="80" y="90" text-anchor="middle" font-family="Frank Ruhl Libre, Georgia, serif" font-size="34" font-weight="600" fill="#1b1a17">{{INITIALS}}</text>
</svg>
