<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Nadlan advertiser tier and status reference</title>
  <desc id="desc">Reference sheet for paid tier badges and campaign/account states in the advertiser center and listing cards.</desc>
  <defs>
    <style>
      .h{font:600 22px Heebo,Arial,sans-serif;fill:#1b1a17}
      .m{font:500 14px Heebo,Arial,sans-serif;fill:#5e5a50}
      .badge{font:700 15px Heebo,Arial,sans-serif;dominant-baseline:middle;text-anchor:middle}
      .meta{font:600 13px Heebo,Arial,sans-serif;dominant-baseline:middle;text-anchor:middle}
      .line{fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1b1a17" flood-opacity=".09"/>
    </filter>
  </defs>

  <rect width="980" height="560" fill="#fbf9f5"/>
  <text class="h" x="910" y="58" direction="rtl">רפרנס תגיות פרסום ומצב קמפיין</text>
  <text class="m" x="910" y="84" direction="rtl">שקט, ברור, שקוף למשתמש, ובלי צבעי צעצוע</text>

  <g transform="translate(92 126)" filter="url(#shadow)">
    <rect width="180" height="58" rx="8" fill="#fffdf8" stroke="#1b1a17" stroke-opacity=".14"/>
    <circle cx="148" cy="29" r="15" fill="#f3eadc" stroke="#9c7a3c" stroke-opacity=".4"/>
    <path d="M148 18l4 7 8 1.2-5.8 5.6 1.4 8-7.6-3.9-7.6 3.9 1.4-8-5.8-5.6 8-1.2z" fill="none" stroke="#9c7a3c" stroke-width="1.35" stroke-linejoin="round"/>
    <text class="badge" x="78" y="30" fill="#1b1a17" direction="rtl">Pro</text>
  </g>

  <g transform="translate(300 126)" filter="url(#shadow)">
    <rect width="180" height="58" rx="8" fill="#1b1a17"/>
    <circle cx="148" cy="29" r="15" fill="#2d2a24" stroke="#d7c08a" stroke-opacity=".75"/>
    <path d="M140 26l5 4 3-10 4 10 5-4-2 13h-13z" fill="none" stroke="#d7c08a" stroke-width="1.35" stroke-linejoin="round"/>
    <text class="badge" x="76" y="30" fill="#fbf9f5" direction="rtl">Premier</text>
  </g>

  <g transform="translate(508 126)" filter="url(#shadow)">
    <rect width="210" height="58" rx="8" fill="#fffdf8" stroke="#9c7a3c" stroke-opacity=".5"/>
    <circle cx="174" cy="29" r="15" fill="#f3eadc" stroke="#9c7a3c" stroke-opacity=".45"/>
    <path d="M168 39V20h7v19M175 39V15h9v24M170 25h3M178 20h3" fill="none" stroke="#9c7a3c" stroke-width="1.35" stroke-linecap="round"/>
    <text class="badge" x="92" y="30" fill="#1b1a17" direction="rtl">Project Premier</text>
  </g>

  <g transform="translate(92 234)">
    <rect width="190" height="44" rx="22" fill="#fffdf8" stroke="#0e3b33" stroke-opacity=".34"/>
    <circle cx="162" cy="22" r="12" fill="#edf6f2"/>
    <path d="M157 22l3 3 6-7" fill="none" stroke="#0e3b33" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="meta" x="82" y="23" fill="#0e3b33" direction="rtl">verified</text>
  </g>

  <g transform="translate(310 234)">
    <rect width="190" height="44" rx="22" fill="#fffdf8" stroke="#9c7a3c" stroke-opacity=".38"/>
    <circle cx="162" cy="22" r="12" fill="#f3eadc"/>
    <path d="M162 13v9l5 3" fill="none" stroke="#9c7a3c" stroke-width="1.55" stroke-linecap="round"/>
    <text class="meta" x="82" y="23" fill="#5e5a50" direction="rtl">active campaign</text>
  </g>

  <g transform="translate(528 234)">
    <rect width="190" height="44" rx="22" fill="#fffdf8" stroke="#9f2d20" stroke-opacity=".30"/>
    <circle cx="162" cy="22" r="12" fill="#f8ece9"/>
    <path d="M157 22h10M162 17v10" fill="none" stroke="#9f2d20" stroke-width="1.55" stroke-linecap="round"/>
    <text class="meta" x="82" y="23" fill="#9f2d20" direction="rtl">expired</text>
  </g>

  <g transform="translate(92 352)">
    <rect width="626" height="110" rx="12" fill="#fffdf8" stroke="#1b1a17" stroke-opacity=".12"/>
    <text class="h" x="574" y="38" direction="rtl" font-size="18">Advertiser Center card state</text>
    <text class="m" x="574" y="66" direction="rtl">show tier, order link, campaign end date, exposure, and next best action</text>
    <rect x="34" y="34" width="128" height="42" rx="6" fill="#1b1a17"/>
    <text class="badge" x="98" y="56" fill="#fbf9f5" direction="rtl">upgrade</text>
    <path d="M200 72h250" stroke="#1b1a17" stroke-opacity=".12"/>
    <path d="M200 48h160" stroke="#1b1a17" stroke-opacity=".2"/>
  </g>
</svg>
