<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Ashira Sde Dov land-based context concept</title>
  <desc id="desc">Original illustrative Sde Dov context background: Ashira on land, sea to the west, Reading and Tel Aviv Port as southern references.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#edf4ef"/>
      <stop offset="0.58" stop-color="#d5e5df"/>
      <stop offset="1" stop-color="#173936"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" x2="1">
      <stop offset="0" stop-color="#236f82"/>
      <stop offset="1" stop-color="#0a3340"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" x2="1">
      <stop offset="0" stop-color="#fff2c9"/>
      <stop offset="0.56" stop-color="#cab07e"/>
      <stop offset="1" stop-color="#75603d"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="url(#sky)"/>
