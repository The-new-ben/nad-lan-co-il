<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ashira Sde Dov project hero concept</title>
  <desc id="desc">Original illustrative hero for the Ashira showroom prototype: tower on Sde Dov land, sea to the west, Reading and Tel Aviv Port as context.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7efe0"/>
      <stop offset="0.48" stop-color="#dbe9e4"/>
      <stop offset="1" stop-color="#103a39"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" x2="1">
      <stop offset="0" stop-color="#287684"/>
      <stop offset="1" stop-color="#072d35"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" x2="1">
      <stop offset="0" stop-color="#f4e7c4"/>
      <stop offset="0.55" stop-color="#c7ad7b"/>
      <stop offset="1" stop-color="#765f3d"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1260" cy="168" r="76" fill="#f4d47d" opacity="0.88" filter="url(#soft)"/>

  <path d="M0 318 C280 292 480 320 735 280 C1030 236 1280 248 1600 195 L1600 0 L0 0 Z" fill="url(#sea)" opacity="0.96"/>
  <path d="M0 358 C310 330 520 362 800 318 C1110 270 1325 298 1600 254" fill="none" stroke="#dff4f5" stroke-width="7" opacity="0.55"/>
  <path d="M0 438 C260 415 470 442 730 405 C1030 362 1285 398 1600 350" fill="none" stroke="#f4efe5" stroke-width="5" opacity="0.45"/>

  <path d="M0 370 C295 395 520 365 785 410 C1060 458 1300 438 1600 405 L1600 900 L0 900 Z" fill="#e9dfcd"/>
  <path d="M100 585 L1350 410" stroke="#ded0b7" stroke-width="54" opacity=".82"/>
  <path d="M100 585 L1350 410" stroke="#fff4df" stroke-width="34" opacity=".94"/>
  <path d="M250 520 L1470 690" stroke="#d5c5aa" stroke-width="44" opacity=".8"/>
  <path d="M250 520 L1470 690" stroke="#f8efdf" stroke-width="26" opacity=".92"/>

  <g opacity=".7">
    <path d="M380 560 L540 505 L540 640 L380 720 Z" fill="#f3f1ea"/>
    <path d="M542 505 L635 552 L635 690 L542 640 Z" fill="#c9d2ce"/>
    <path d="M1100 555 L1268 495 L1268 650 L1100 735 Z" fill="#f5f1e8"/>
    <path d="M1270 495 L1360 545 L1360 698 L1270 650 Z" fill="#c4cfcb"/>
  </g>

  <g transform="translate(770 220)">
    <ellipse cx="75" cy="575" rx="282" ry="46" fill="#0a1f1f" opacity="0.24"/>
    <rect x="-20" y="94" width="190" height="470" rx="66" fill="url(#tower)" stroke="#f8ebc6" stroke-width="7"/>
    <path d="M5 108 C72 78 145 94 168 142 L168 545 C118 572 42 575 -18 545 L-18 150 C-18 132 -8 116 5 108 Z" fill="rgba(255,255,255,0.22)"/>
    <g stroke="#f8ebc6" stroke-width="6" opacity="0.78">
      <path d="M-10 158 L170 142"/><path d="M-16 202 L174 188"/><path d="M-18 246 L176 234"/><path d="M-18 290 L176 280"/>
      <path d="M-16 334 L174 326"/><path d="M-12 378 L170 372"/><path d="-4 422 L164 418"/><path d="M8 466 L154 466"/>
      <path d="M22 510 L140 512"/>
    </g>
    <g fill="#ffffff" opacity="0.34">
      <rect x="42" y="150" width="27" height="365" rx="10"/>
      <rect x="98" y="138" width="30" height="385" rx="11"/>
    </g>
    <rect x="-215" y="506" width="220" height="88" rx="14" fill="#d6c3a2"/>
    <rect x="170" y="512" width="245" height="78" rx="14" fill="#ccb486"/>
    <rect x="-300" y="555" width="150" height="42" rx="9" fill="#c2a976"/>
  </g>

  <g transform="translate(110 600)" opacity=".92">
    <rect x="0" y="94" width="135" height="46" rx="9" fill="#d6c8ad"/>
    <rect x="25" y="32" width="84" height="66" rx="8" fill="#ede3cf"/>
    <rect x="56" y="-28" width="24" height="64" rx="8" fill="#bfa36c"/>
    <path d="M68 -130 C92 -86 92 -44 69 0 C45 -45 45 -88 68 -130 Z" fill="#c9ad72"/>
    <text x="68" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#153431">רדינג ונמל</text>
  </g>

  <g transform="translate(84 78)">
    <rect width="485" height="210" rx="28" fill="rgba(255,255,255,0.84)" stroke="#d2b56e"/>
    <text x="420" y="66" direction="rtl" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#102b2b">Ashira שדה דב</text>
    <text x="420" y="112" direction="rtl" font-family="Arial, sans-serif" font-size="23" fill="#3d473f">מודל סביבה ובחירת דירה על חזית</text>
    <text x="420" y="153" direction="rtl" font-family="Arial, sans-serif" font-size="18" fill="#6f5d34">הדמיה מקורית להמחשה, לא חומר רשמי</text>
    <rect x="38" y="150" width="138" height="38" rx="19" fill="#0b2f30"/>
    <text x="107" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f5d991">3D זמין</text>
  </g>

  <g font-family="Arial, sans-serif" fill="#123330" font-weight="700">
    <text x="1040" y="385" font-size="26">רובע שדה דב</text>
    <text x="1050" y="725" font-size="23">שכונת אשכול</text>
    <text x="235" y="300" font-size="25">ים ממערב</text>
  </g>
  <rect x="80" y="828" width="1440" height="42" rx="20" fill="rgba(5,28,28,.78)"/>
  <text x="1495" y="856" direction="rtl" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f8efd9">Ashira שדה דב</text>
  <text x="102" y="856" direction="rtl" font-family="Arial, sans-serif" font-size="17" fill="#f8efd9">הדמיה מקורית להמחשה, לא חומר רשמי</text>
</svg>
