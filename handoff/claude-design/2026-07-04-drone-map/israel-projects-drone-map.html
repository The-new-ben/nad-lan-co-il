<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>נדלן · מפת הפרויקטים החדשים — מבט רחפן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
<style>
:root{--paper:#FAF7F1;--band:#F3EEE3;--ink:#1B1A17;--soft:#4A463E;--gold:#9C7A3C;--terra:#C2563A;
  --hair:#E2DCD0;--dark:#14130F;--serif:"Frank Ruhl Libre",Georgia,serif;--sans:"Heebo",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--dark)}
#map{position:absolute;inset:0}
.panel{position:absolute;top:18px;inset-inline-start:18px;z-index:5;width:330px;max-height:calc(100% - 36px);
  overflow:auto;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(10px);
  border:1px solid var(--hair);border-radius:16px;padding:18px 18px 12px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.brand{font-family:var(--serif);font-weight:900;font-size:24px}
.sub{font-size:13px;color:var(--soft);margin:4px 0 12px}
.proj{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--hair);
  padding:9px 2px;cursor:pointer;transition:background .15s;border-radius:8px}
.proj:hover{background:var(--band)}
.proj b{font-size:14px}.proj .m{font-size:12px;color:var(--soft)}
/* isolate mixed Hebrew+number+·  rows so bidi keeps segment order stable */
.proj .m,.pop .row,.sub,.pending{unicode-bidi:plaintext}
.proj .fly{font-size:11px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:3px 10px;white-space:nowrap}
.qtitle{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:14px 0 4px}
.pending{font-size:12.5px;color:var(--soft);line-height:1.5;border-top:1px solid var(--hair);padding-top:8px}
.pending b{color:var(--ink)}
.honest{font-size:11.5px;color:var(--soft);background:var(--band);border-radius:10px;padding:8px 10px;margin-top:10px}
.mk{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--terra);
  border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.4);cursor:pointer}
.mk span{transform:rotate(45deg);display:grid;place-items:center;width:100%;height:100%;color:#fff;font-size:11px;font-weight:800}
.mapboxgl-popup-content{font-family:var(--sans);border-radius:14px;padding:14px 16px;box-shadow:0 18px 44px rgba(0,0,0,.35)}
.pop b{font-family:var(--serif);font-size:16px}
.pop .row{font-size:12.5px;color:var(--soft);margin-top:4px}
.pop .est{font-size:11px;background:var(--band);border-radius:8px;padding:3px 8px;display:inline-block;margin-top:8px;color:var(--soft)}
.drone{position:absolute;bottom:22px;inset-inline-end:18px;z-index:5;background:rgba(20,19,15,.85);color:#E6D4AE;
  border:1px solid rgba(230,212,174,.4);border-radius:999px;padding:10px 20px;font-weight:700;font-size:14px;cursor:pointer;backdrop-filter:blur(6px)}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <div class="brand">נדלן</div>
  <div class="sub">הפרויקטים החדשים הגדולים — נבנים עכשיו · מבט רחפן</div>
  <div class="qtitle">פרויקטים על המפה</div>
  <div id="list"></div>
  <div class="qtitle">בתור לאימות מיקום</div>
  <div class="pending" id="pending"></div>
  <div class="honest">כנות קודמת ליופי: על המפה מוצגים רק פרויקטים שמיקומם אומת. השאר יעלו אוטומטית אחרי אימות גיאוקוד מול govmap. פינים = מרכז אתר משוער, לא גבול מגרש.</div>
</div>
<button class="drone" id="droneBtn">▶ סיבוב רחפן</button>
<script>
mapboxgl.accessToken='__MAPBOX_TOKEN__';
const PROJECTS=[
 {id:'rainbow', name:'Rainbow תל אביב', dev:'ישראל קנדה', lat:32.10317, lng:34.78446,
  floors:39, units:480, status:'בשיווק · בבנייה', page:'page-rainbow-tel-aviv.html'},
 {id:'ashira', name:'ASHIRA שדה דב', dev:'אביסרור', lat:32.10557, lng:34.7876,
  floors:35, units:406, status:'בשיווק · בבנייה', page:'page-ashira-sde-dov.html'},
 {id:'dimri', name:'Dimri Yama שדה דב', dev:'י.ח דמרי', lat:32.1049, lng:34.7869,
  floors:39, units:458, status:'בשיווק · בבנייה', page:'page-dimri-yama-sde-dov.html'},
];
const PENDING_COUNT=30;
// Hebrew/Arabic base-map labels render left-to-right (flipped) without this
// plugin — it is THE fix for "the Hebrew is flipped" on a Mapbox map.
if(mapboxgl.getRTLTextPluginStatus && mapboxgl.getRTLTextPluginStatus()==='unavailable'){
  mapboxgl.setRTLTextPlugin(
    'https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-rtl-text/v0.2.3/mapbox-gl-rtl-text.js',
    null, true /* lazy */);
}
const map=new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/standard',
  center:[34.95,31.6],zoom:6.3,pitch:0,bearing:0,language:'he'});
map.addControl(new mapboxgl.NavigationControl({visualizePitch:true}),'top-right');

function flyTo(p){map.flyTo({center:[p.lng,p.lat],zoom:15.6,pitch:62,bearing:-24,duration:4200,essential:true});}

const list=document.getElementById('list');
PROJECTS.forEach(p=>{
  const el=document.createElement('div');el.className='mk';el.innerHTML='<span>◆</span>';
  const pop=new mapboxgl.Popup({offset:24}).setHTML(
    `<div class="pop"><b>${p.name}</b>
     <div class="row">${p.dev} · ${p.floors} קומות · ${p.units} דירות</div>
     <div class="row">${p.status}</div>
     <span class="est">מיקום משוער · טרם גיאוקוד רשמי</span></div>`);
  new mapboxgl.Marker(el).setLngLat([p.lng,p.lat]).setPopup(pop).addTo(map);
  const row=document.createElement('div');row.className='proj';
  row.innerHTML=`<div><b>${p.name}</b><div class="m">${p.dev} · ${p.floors} קומות · ${p.units} דירות</div></div><span class="fly">עוף לשם</span>`;
  row.onclick=()=>flyTo(p);
  list.appendChild(row);
});
document.getElementById('pending').innerHTML=
  `<b>${PENDING_COUNT} פרויקטים מאומתים</b> (אזורים, אשטרום, ישראל-קנדה, מטרופוליס, שיכון ובינוי ועוד) ממתינים לאימות מיקום — יופיעו כאן אוטומטית מה־database.`;

// drone tour: fly to Sde Dov then slow orbit
let spinning=false, raf=null;
function orbit(){ if(!spinning) return; map.setBearing(map.getBearing()+0.06); raf=requestAnimationFrame(orbit); }
document.getElementById('droneBtn').onclick=()=>{
  if(spinning){spinning=false;cancelAnimationFrame(raf);droneBtn.textContent='▶ סיבוב רחפן';return;}
  droneBtn.textContent='⏸ עצירה';
  flyTo(PROJECTS[0]);
  map.once('moveend',()=>{spinning=true;orbit();});
};
map.on('load',()=>{ setTimeout(()=>flyTo(PROJECTS[0]),900); });
</script>
</body>
</html>
