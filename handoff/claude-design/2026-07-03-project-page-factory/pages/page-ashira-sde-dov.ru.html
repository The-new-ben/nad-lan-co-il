hotspot": "-8.459 62.22 -8.459", "hnormal": "-0.707 0 -0.707", "uorbit": "225deg 72deg 99m", "stage_x": 29, "stage_y": 43.7, "stage_w": 14, "stage_h": 6.5}, {"id": "a3", "floor": 27, "rooms": 4, "sqm": 138, "dir": "מערב", "status": "reserved", "label": "B-27", "hotspot": "-11.7 83.57 0", "hnormal": "-1 0 0", "uorbit": "270deg 72deg 99m", "stage_x": 46, "stage_y": 28.9, "stage_w": 14, "stage_h": 6.5}, {"id": "a4", "floor": 33, "rooms": 5, "sqm": 180, "dir": "דרום מערב", "status": "available", "label": "PH-33", "hotspot": "-8.114 101.87 -8.114", "hnormal": "-0.707 0 -0.707", "uorbit": "225deg 72deg 99m", "stage_x": 24, "stage_y": 16.4, "stage_w": 14, "stage_h": 6.5}], "comps": [{"name": "Rainbow תל אביב", "ppsqm": 76000, "dist_m": 399}, {"name": "Dimri Yama שדה דב", "ppsqm": 75000, "dist_m": 310}], "official_url": "", "orbit": "-30deg 70deg 203m", "target": "0m 44m 0m", "model_generic": true, "article_html": "<section class=\"nlv2-section\" id=\"nlv2-ashira-info-ru\" aria-label=\"Руководство покупателя Ashira Sde Dov\">\r\n\t\t<h2>Почему Ashira Sde Dov нужно оценивать через конкретную квартиру</h2>\r\n\t\t<p>Ashira Sde Dov находится в одном из самых заметных районов новой застройки Тель-Авива: на территории бывшего аэропорта Sde Dov, между морем, Ramat Aviv, Tel Baruch, Park Hayarkon и северной частью города. Для местного покупателя и для покупателей из-за рубежа важен не только адрес. Важно понять, какая квартира подходит под семейный сценарий, бюджет, горизонт владения, вид, этаж и уровень проверки документов.</p>\r\n\t\t<p>Эта страница построена вокруг практического выбора. 3D модель помогает увидеть контекст: где море, где Reading, где основные городские ориентиры и будущие объемы квартала. Кликабельный фасад помогает выбрать конкретную квартиру по этажу, направлению, площади и статусу. Карточка выбранной квартиры показывает следующие вопросы: необязательная оценка, план, вид, документы, доступность и контакт для проверки. Такой путь ближе к реальному решению о покупке, чем обычная красивая картинка.</p>\r\n\t\t<p>Официальный сайт Ashira описывает проект Avisror как жилой проект в новом квартале Sde Dov. На сайте указаны квартиры от 2 до 5 комнат, башни и boutique buildings, архитектура Avner Yashar, интерьерный дизайн Dana Oberson, а также общие пространства: бассейн, spa, gym, cinema, детские зоны, lounge, коммерческие площади и дополнительные сервисы для жителей. Эти факты полезны, но они не заменяют подписанный план продажи, утвержденную спецификацию, текущую цену, текущую доступность и юридическую проверку.</p>\r\n\t\t<div class=\"nlv2-data-grid\">\r\n\t\t\t<div class=\"nlv2-data-card\"><span>Зона</span><strong>Квартал Sde Dov</strong></div>\r\n\t\t\t<div class=\"nlv2-data-card\"><span>Город</span><strong>Тель-Авив</strong></div>\r\n\t\t\t<div class=\"nlv2-data-card\"><span>План района</span><strong>TA/4444</strong></div>\r\n\t\t\t<div class=\"nlv2-data-card\"><span>Фокус страницы</span><strong>Выбор квартиры, вид и оценка</strong></div>\r\n\t\t</div>\r\n\r\n\t\t<h2>Как пользоваться 3D моделью и фасадом</h2>\r\n\t\t<p>3D модель должна отвечать на простые вопросы. Где запад? Где море? Где Reading? Как расположен проект относительно будущих башен и открытых пространств? Какие объемы могут влиять на вид и ощущение высоты? Покупатель, который не знает Тель-Авив детально, должен быстро понять местоположение, не переходя между десятью отдельными картами.</p>\r\n\t\t<p>Фасад нужен для более точного выбора. Зеленая ячейка означает, что квартиру можно проверить. Желтая означает, что статус требует уточнения. Серая означает, что квартира недоступна в этом демонстрационном наборе. Когда покупатель нажимает на ячейку, страница показывает название квартиры, этаж, комнаты, площадь, вид, статус цены и следующие действия. Это снижает путаницу: покупатель говорит не просто \"интересует Ashira\", а \"хочу проверить западную квартиру на 18 этаже\".</p>\r\n\t\t<p>Такое разделение важно. Свободно вращающаяся 3D модель отлично объясняет пространство, но точный выбор квартиры требует либо плоского фасада, либо 3D файла, где поверхности квартир являются отдельными именованными объектами. Пока такой файл не получен от проекта или не построен с полной точностью, самый честный путь для покупателя: модель дает контекст, фасад дает выбор квартиры.</p>\r\n\r\n\t\t<h2>Что известно о квартале Sde Dov из публичных источников</h2>\r\n\t\t<p>Муниципалитет Тель-Авива описывает территорию бывшего аэропорта Sde Dov как новый городской район на севере города. В публичных материалах муниципалитета указана площадь около 1,300 дунамов, около 16,000 квартир и примерно 40,000 будущих жителей. Генеральный план TA/4444 был утвержден в 2020 году и описывает смешанный городской район с жильем, бизнесом, отдыхом, офисами, магазинами, гостиницами, общественными пространствами, парками и городскими улицами.</p>\r\n\t\t<p>Сообщение на Gov.il также говорит о 16,000 единицах жилья в районе и упоминает доступное жилье как часть более широкого набора. Эти цифры относятся к району в целом, а не к одному зданию и не к одной квартире. Для покупателя это важно как контекст: ценность конкретной квартиры зависит не только от башни, но и от того, как будет развиваться улица, транспорт, общественные услуги, открытые пространства и соседние здания.</p>\r\n\t\t<p>Нужно строго разделять масштаб района и масштаб проекта. 16,000 квартир относится ко всему району. 1,300 дунамов относится к территории бывшего аэропорта. 40,000 жителей относится к будущему населению района. Факты об Ashira должны опираться на официальный сайт проекта, утвержденные планы или документы, относящиеся именно к проекту. Такое разделение укрепляет доверие и защищает покупателя от неверных ожиданий.</p>\r\n\r\n\t\t<h2>Локация: море, Reading, Park Hayarkon и север Тель-Авива</h2>\r\n\t\t<p>Официальный сайт Ashira упоминает рядом Tel Baruch beach, Reading, Tel Aviv Port, Park Hayarkon, Ramat Aviv Mall, Tel Aviv University, light rail, University train station, Namir Road и Ibn Gabirol. Для покупателя это не просто названия. Это проверка повседневной жизни: дорога на работу, прогулки, пляж, покупки, университет, парк, поездки по городу и связь нового квартала с уже сложившимся севером Тель-Авива.</p>\r\n\t\t<p>Reading удобен как визуальный ориентир, потому что его легко распознать. Море важно, потому что направление и вид влияют на восприятие квартиры и на цену. Park Hayarkon помогает понять зеленые маршруты и досуг. Ramat Aviv и Tel Aviv University объясняют северный городской контекст. Сильная проектная страница должна связывать эти точки в модели, в тексте и в выборе квартиры.</p>\r\n\t\t<p>Для русскоязычного покупателя, особенно если он смотрит из другой страны, такая ориентация особенно важна. Можно знать Тель-Авив как город, но не понимать разницу между Tel Baruch, Ramat Aviv, Park Hayarkon, портом и будущими улицами Sde Dov. Поэтому страница должна объяснять место как гид: где море, где городская ткань, где будущие улицы, а что еще нужно проверить.</p>\r\n\r\n\t\t<h2>Типы квартир и первая проверка доступности</h2>\r\n\t\t<p>Официальный сайт говорит о квартирах от 2 до 5 комнат. Это важная отправная точка, но она не отвечает на главный вопрос. Две четырехкомнатные квартиры могут быть совершенно разными: разный этаж, разная ориентация, другая форма балкона, другое расстояние до лифтов, разная приватность, другой вид и другой ценовой уровень. Комнаты нужно читать вместе с планировкой и окружением.</p>\r\n\t\t<p>Фасад помогает сделать выбор видимым. Вместо общей фразы \"какие квартиры остались?\" покупатель может сравнить несколько конкретных точек: западная квартира на 18 этаже, городская квартира на 14 этаже, угловая квартира на 10 этаже, садовая квартира на нижнем уровне. Такой выбор делает дальнейшую проверку точнее и помогает сохранить контекст квартиры при обращении.</p>\r\n\t\t<p>В полной версии, когда будут доступны утвержденные материалы, каждая ячейка сможет открывать план, галерею, видео, вид из квартиры, цену, условия оплаты и документы. В текущем варианте страница показывает реалистичный путь с ориентировочными данными. Все, что не подтверждено, должно быть обозначено как ориентировочное.</p>\r\n\r\n\t\t<h2>Цена, необязательная оценка и реальный бюджет</h2>\r\n\t\t<p>Покупатели хотят видеть цену. Это нормально: цена почти всегда один из первых вопросов. Но публичная страница не должна показывать число как окончательное, если оно не проверено, не датировано и не связано с конкретной квартирой. В новом проекте цена может меняться по этажу, виду, площади, балкону, парковке, кладовой, графику платежей, индексации и коммерческому статусу.</p>\r\n\t\t<p>Необязательная оценка все равно полезна. Она помогает понять, является ли квартира премиальной, семейной, садовой или более инвестиционной. Она помогает сравнить высокий западный вариант с более низким вариантом на район. Она также помогает покупателям из-за рубежа подготовить бюджет шире, чем просто цена договора.</p>\r\n\t\t<p>В реальный бюджет могут входить налог на покупку, юридическое сопровождение, расходы на финансирование, индексация, валютные колебания, мебель, изменения в отделке, управление квартирой и будущие эксплуатационные платежи. Поэтому карточка квартиры должна ясно показывать, что оценка не является обязательной ценой и должна быть проверена перед решением.</p>\r\n\r\n\t\t<h2>Что должны понимать покупатели из-за рубежа</h2>\r\n\t\t<p>Покупатели из-за рубежа нуждаются не только в переводе. Им нужно объяснение израильского процесса простыми словами: что такое план продажи, почему нужен местный адвокат, что такое налог на покупку, как может отличаться финансирование для нерезидента, зачем нужна доверенность, какие документы нужно проверить и почему оценка на странице не является предложением.</p>\r\n\t\t<p>Им также нужна ориентация в районе. Sde Dov - не просто новый бренд. Это крупное преобразование бывшего аэропорта в северном Тель-Авиве, рядом с морем и существующими районами. Покупатель может знать Тель-Авив, но не понимать будущую структуру улиц, общественные пространства и стадии строительства. Поэтому русская страница должна быть самостоятельной, а не коротким пересказом ивритской версии.</p>\r\n\t\t<p>Каждая языковая версия должна быть полной: русский, английский, французский, арабский и иврит должны иметь свой заголовок, описание, источники, чек-лист и путь к проверке выбранной квартиры. Когда все версии готовы, их можно связать между собой языковыми аннотациями, чтобы читатель попадал на правильную страницу.</p>\r\n\r\n\t\t<h2>Какие документы запросить перед движением вперед</h2>\r\n\t\t<p>Перед серьезным шагом покупатель должен запросить актуальный план продажи конкретной квартиры, техническую спецификацию, текущую цену, график платежей, предполагаемый срок передачи, данные о парковке и кладовой, прогноз по обслуживанию здания, разрешительные документы, условия индексации, условия отмены и материалы по общим пространствам.</p>\r\n\t\t<p>Если квартира показывается с видом, нужно спросить, чем подтверждается этот вид: этаж, ориентация, высота, соседние здания, будущие здания, планы квартала и утвержденные визуальные материалы. Вид сегодня и вид после завершения всего района могут различаться. Для покупки на раннем этапе это особенно важно.</p>\r\n\t\t<p>Для покупателя за пределами Израиля важно заранее подготовить вопросы по банку, валюте, подписи документов, доверенности, переводу документов и налоговой позиции. Эта страница не заменяет адвоката, налогового специалиста, ипотечного консультанта или оценщика. Она помогает прийти к ним с правильными вопросами.</p>\r\n\t\t<p>Отдельно стоит запросить план этажа, разрез здания, схему парковок, положение кладовой, описание лифтов, высоту потолков, перечень материалов, правила изменений и перечень общих зон. Если выбранная квартира находится рядом с техническими помещениями, лифтами, мусорной комнатой или общественным пространством, это нужно увидеть в документах, а не только услышать по телефону. Для дорогой квартиры в новом районе мелкие детали часто становятся важными после заселения.</p>\r\n\t\t<p>Покупателю также полезно вести таблицу проверки по каждой выбранной квартире. В одной строке можно записать этаж, направление, площадь, балкон, статус цены, статус доступности, источник данных, дату получения информации и вопрос, который еще открыт. Такой подход делает сравнение Ashira, Rainbow, Dimri Yama и других проектов спокойнее. Он особенно полезен для покупателя, который находится за границей и не может быстро приехать на встречу.</p>\r\n\r\n\t\t<h2>Сравнение Ashira с Rainbow, Dimri Yama и другими проектами</h2>\r\n\t\t<p>В Sde Dov есть несколько проектов, которые могут интересовать покупателей, включая Rainbow, Dimri Yama и другие комплексы. Сравнение не должно быть общим заявлением, что один проект лучше другого. Полезное сравнение смотрит на положение в квартале, расстояние до моря, этажи, типы квартир, вид, цену, стадию продажи, девелопера, общие пространства, транспорт, пляж, документы и план конкретной квартиры.</p>\r\n\t\t<p>Семья может выбрать один проект из-за планировки и повседневного удобства. Инвестор может выбрать другой из-за ожидаемого спроса, цены входа или горизонта завершения. Покупатель из-за рубежа может выбрать страницу, которая лучше объясняет процесс и снижает неопределенность. Единая структура помогает сравнивать: модель, фасад, карточка квартиры, руководство, источники и контакт.</p>\r\n\t\t<p>Для Ashira официальный сайт подчеркивает жилую среду с сервисами и общими пространствами. Муниципальные источники объясняют масштаб квартала. Покупатель должен соединить оба слоя: опыт конкретного здания и долгосрочное развитие района.</p>\r\n\r\n\t\t<h2>Транспорт, ежедневные маршруты и доступ</h2>\r\n\t\t<p>Транспорт нужно проверять практически. Сайт Ashira упоминает light rail, University train station, Namir Road и Ibn Gabirol. Муниципальные материалы также говорят о транспортном обслуживании, связанном с продолжением Ibn Gabirol. Покупателю важно понять, как это будет выглядеть в повседневной жизни: выезд из парковки, путь до школы, путь до станции, влияние строительных этапов и связь с существующими кварталами.</p>\r\n\t\t<p>Для семьи ежедневный маршрут часто важнее красивой фотографии. Утро, школа, работа, покупки, парк, возвращение вечером и выход к морю формируют реальное качество жизни. Для инвестора доступность влияет на будущую аренду. Для покупателя из-за рубежа транспорт помогает понять город без знания каждой улицы.</p>\r\n\t\t<p>В будущем страница может показывать школы, детские сады, парки, станции, пляжные маршруты, магазины и общественные объекты вокруг проекта. Но точное время в пути должно появляться только при наличии проверенного источника или проверяемой карты.</p>\r\n\t\t<p>Важно учитывать и период строительства района. Новый квартал редко становится завершенным в первый день передачи ключей. На разных этапах могут меняться подъезды, пешеходные маршруты, шум, открытые пространства и доступ к сервисам. Поэтому покупатель должен спрашивать не только о будущем идеальном сценарии, но и о первых годах жизни после заселения: какие улицы уже работают, какие зоны еще строятся, где будут временные ограничения и как это влияет на выбранный подъезд.</p>\r\n\r\n\t\t<h2>Солнце, ветер и направление у моря</h2>\r\n\t\t<p>В прибрежном проекте направление имеет большое значение. Западная квартира может давать ощущение моря и свет после полудня, но также может получать более сильное солнце. Восточная квартира может быть мягче утром и смотреть больше на район. Север и юг нужно проверять по тени, ветру, балкону и соседним зданиям.</p>\r\n\t\t<p>Высокий этаж может чувствоваться открытым, но он может быть более подвержен ветру и сильнее зависеть от лифтов. Низкая квартира может быть ближе к улице и саду, но требует проверки приватности и шума. Угловая квартира может дать больше света, если обе стороны действительно полезны. Поэтому ячейка на фасаде должна запускать проверку, а не завершать ее.</p>\r\n\t\t<p>3D модель полезна тем, что связывает здание с небом, морем и объемами вокруг. В будущей версии можно добавить более точный контроль сезонов и часов дня. Уже сейчас страница должна учить покупателя вопросам: где солнце, где тень, где ветер, что будет построено между квартирой и морем, и какие документы подтверждают показанный вид.</p>\r\n\r\n\t\t<h2>Планы, изображения, видео и интерьерный просмотр</h2>\r\n\t\t<p>Современный покупатель ожидает больше, чем один фасад. Страница проекта может включать галерею, официальное видео, план квартиры, вид из квартиры и интерьерный просмотр. Правильное место для этих материалов - карточка выбранной квартиры и отдельный блок медиа. Тогда путь остается понятным: сначала выбрать квартиру, затем увидеть материалы именно по ней.</p>\r\n\t\t<p>Если девелопер предоставляет официальные рендеры, видео или виртуальный тур, они должны быть показаны с понятной подписью. Если на раннем этапе используются сгенерированные визуальные материалы, это должно быть явно сказано. Покупатели из-за рубежа могут принимать предварительные решения дистанционно, поэтому честное разделение между официальным, оценочным и непроверенным особенно важно.</p>\r\n\t\t<p>Лучшие цифровые страницы недвижимости показывают не просто красивую картинку. Они связывают изображение с решением: какая это квартира, какой этаж, какая ориентация, какой план, какой вид, какие документы и что делать дальше. Именно эту логику должна поддерживать страница Ashira.</p>\r\n\r\n\t\t<h2>Налог, финансирование и валюта</h2>\r\n\t\t<p>Русскоязычный покупатель за пределами Израиля должен заранее проверить налог на покупку, финансирование, валюту и юридическое сопровождение. В Израиле налоговые правила могут отличаться в зависимости от статуса покупателя и назначения квартиры. Финансирование для нерезидента может требовать дополнительных документов. Валютные изменения между долларом, евро, шекелем или другой валютой могут повлиять на итоговую стоимость.</p>\r\n\t\t<p>Эти вопросы не должны подаваться как персональный совет на публичной странице. Их нужно подавать как список проверок. Покупатель должен понимать, что цена квартиры - это не весь бюджет. Нужно учитывать налог, юридические расходы, банковские расходы, индекс, возможную отделку, мебель и управление квартирой, если покупатель не живет постоянно в Израиле.</p>\r\n\t\t<p>В дальнейшем карточка квартиры может включать ориентировочный общий бюджет без обязательств: цена, налог к проверке, расходы на сопровождение, индекс, обслуживание и мебель. Сейчас правильнее оставаться осторожными и не показывать точные цифры без источника и даты.</p>\r\n\r\n\t\t<h2>Жизнь в районе: услуги, зелень и будущая среда</h2>\r\n\t\t<p>Квартира не существует отдельно от района. Важны зеленые пространства, пляж, пешеходные маршруты, велосипедные связи, магазины, транспорт, общественные объекты, шум, виды, тени и качество улицы. План TA/4444 описывает смешанный городской район, но реальное ощущение будет меняться по мере строительства.</p>\r\n\t\t<p>Для семьи важны школы, детские сады, парки и ежедневные маршруты. Для инвестора важны будущий спрос, конкуренция на аренду, типы квартир и качество управления зданием. Для покупателя из-за рубежа важны простота использования квартиры во время приездов и возможность управлять ею дистанционно.</p>\r\n\t\t<p>Хорошая страница должна постепенно добавлять слои данных: городской контекст, точки интереса, вид, солнце, документы, медиа, сравнение и контакт. Цель не в том, чтобы перегрузить покупателя, а в том, чтобы каждая проверка появлялась в нужный момент.</p>\r\n\t\t<p>Покупателю стоит отдельно проверить, какие сервисы находятся внутри проекта, какие относятся ко всему кварталу, а какие расположены в соседних районах. Бассейн, спортзал или lounge могут влиять на комфорт, но также влияют на будущие расходы содержания. Парк, пляж и транспорт повышают удобство, но требуют проверки фактического маршрута. Разделение этих уровней помогает избежать ситуации, когда красивое описание района воспринимается как гарантия конкретного здания.</p>\r\n\t\t<p>Для инвестора важна не только эмоциональная привлекательность. Нужно понять, кто может арендовать такую квартиру: семьи, сотрудники технологических компаний, иностранные владельцы, студенты старших степеней, сотрудники университетской среды или люди, которым нужен север Тель-Авива рядом с морем. Этот анализ не заменяет оценку рынка, но помогает выбрать тип квартиры: меньше комнат для ликвидности, семейный формат для долгого проживания, высокий этаж для вида или садовый формат для другого образа жизни.</p>\r\n\r\n\t\t<h2>Русская версия как полноценная страница, а не короткий перевод</h2>\r\n\t\t<p>Русскоязычный покупатель может искать \"купить квартиру в Тель-Авиве\", \"новостройка в Тель-Авиве\", \"Sde Dov\", \"Ashira Sde Dov\" или \"квартира у моря в Тель-Авиве\". Страница должна использовать эти выражения естественно, но важнее ответить на намерение: понять район, увидеть квартиры, оценить бюджет, проверить документы и отправить запрос по конкретной квартире.</p>\r\n\t\t<p>Google рекомендует ясно связывать локализованные версии страниц, когда сайт работает на нескольких языках. Для пользователя это означает простой опыт: он видит русскую страницу, может перейти к английской, французской, арабской или ивритской версии, и каждая версия является самостоятельной. Нельзя ограничиваться короткой языковой вкладкой, если речь идет о дорогой покупке.</p>\r\n\t\t<p>Доверие строится на источниках и ясных границах. Проверенные данные должны иметь источник. Оценочные данные должны быть названы оценочными. Отсутствующие данные должны оставаться отсутствующими, пока не получены документы. Это особенно важно для покупки в другой стране.</p>\r\n\r\n\t\t<h2>Краткий чек-лист перед запросом деталей</h2>\r\n\t\t<ul class=\"nlv2-check-list\">\r\n\t\t\t<li>Проверьте, откуда взяты данные: официальный сайт, публичный источник, утвержденный документ или ориентировочный визуальный материал.</li>\r\n\t\t\t<li>Убедитесь, что ячейка на фасаде соответствует реальному утвержденному плану квартиры.</li>\r\n\t\t\t<li>Проверьте комнаты, площадь, балкон, этаж, направление, парковку, кладовую и расстояние до лифтов.</li>\r\n\t\t\t<li>Спросите, является ли цена утвержденной, ориентировочной, датированной или доступной только после проверки.</li>\r\n\t\t\t<li>Не считайте зеленую ячейку резервированием квартиры.</li>\r\n\t\t\t<li>Изучите контекст района: TA/4444, 16,000 квартир, 1,300 дунамов, транспорт, общественные объекты и этапы развития.</li>\r\n\t\t\t<li>Сравните Ashira с Rainbow, Dimri Yama и другими проектами по одинаковым критериям.</li>\r\n\t\t\t<li>Для покупателей из-за рубежа заранее проверьте налог на покупку, финансирование, валюту, доверенность и юридическое сопровождение.</li>\r\n\t\t\t<li>Не принимайте обязательное решение без утвержденных документов и профессиональной проверки.</li>\r\n\t\t</ul>\r\n\r\n\t\t<h2>Источники и примечания о надежности</h2>\r\n\t\t<p>Эта страница использует два уровня источников. Официальный сайт Ashira используется для идентичности проекта, расположения, диапазона квартир, имен архитектуры и дизайна, общих пространств и ближайших ориентиров. Источники Tel Aviv Municipality и Gov.il используются для контекста квартала Sde Dov, включая TA/4444, 16,000 квартир, около 1,300 дунамов, около 40,000 будущих жителей и доступное жилье.</p>\r\n\t\t<ul class=\"nlv2-source-list\">\r\n\t\t\t<li><a href=\"https://ashirabyavisror.com/\" rel=\"nofollow noopener\">Официальный сайт Ashira</a></li>\r\n\t\t\t<li><a href=\"https://www.tel-aviv.gov.il/Residents/Development/Pages/SdeDov.aspx\" rel=\"nofollow noopener\">Tel Aviv Municipality: квартал Sde Dov</a></li>\r\n\t\t\t<li><a href=\"https://www.gov.il/he/pages/sdedov-pr-22072020\" rel=\"nofollow noopener\">Gov.il: сообщение о плане квартала Sde Dov</a></li>\r\n\t\t\t<li><a href=\"https://developers.google.com/search/docs/specialty/international/localized-versions\" rel=\"nofollow noopener\">Google Search Central: локализованные версии страниц</a></li>\r\n\t\t\t<li><a href=\"https://www.kolzchut.org.il/ru/%D0%A0%D0%B0%D1%81%D1%87%D0%B5%D1%82_%D0%BD%D0%B0%D0%BB%D0%BE%D0%B3%D0%B0_%D0%BD%D0%B0_%D0%BF%D0%BE%D0%BA%D1%83%D0%BF%D0%BA%D1%83_%D0%BD%D0%B5%D0%B4%D0%B2%D0%B8%D0%B6%D0%B8%D0%BC%D0%BE%D1%81%D1%82%D0%B8\" rel=\"nofollow noopener\">Kol Zchut: расчет налога на покупку недвижимости</a></li>\r\n\t\t</ul>\r\n\t\t<p class=\"nlv2-note\">Модель, фасад, ячейки доступности и оценки на этой странице являются ориентировочными до получения утвержденных материалов. Перед дальнейшим шагом покупатели должны проверить планы продажи, цены, доступность, условия платежей, медиа, сроки передачи и документы с девелопером и подходящими специалистами. Если факт отсутствует, он должен оставаться отсутствующим, а не выглядеть проверенным.</p>\r\n\t</section>\r\n\n<section class=\"nlv2-section\" aria-label=\"Факты и цифры\">\n<h2>Ашира Сде-Дов в цифрах: здания, этажи и квартиры</h2>\n<p>Помимо самого выбора квартиры, важно понимать реальный масштаб проекта. По данным открытых источников (building.org.il, ice.co.il и сайт квартала Сде-Дов), проект Ашира компании Ависрор состоит из четырёх зданий ступенчатой композиции: жилая башня примерно в 35 этажей, среднеэтажный корпус около 16 этажей и два бутик-дома примерно по 8 этажей - всего около 406 квартир. Для покупателя это означает широкий выбор форматов жизни в одном комплексе: от невысокой бутик-квартиры у улицы до квартиры на высоком этаже башни с открытой западной линией вида к морю.</p>\n<p>Типовая высота этажа в проектах такого класса - около 3,2 метра; это влияет и на ощущение пространства в квартире, и на общую высоту зданий. Западная сторона комплекса обращена к прибрежной полосе, поэтому разница между западной и восточной квартирой в одном доме - это разница вида, послеполуденного солнца и нередко цены. Все данные необходимо сверить с официальным планом продаж застройщика до подписания: окончательная этажность, точный состав квартир и техническая спецификация фиксируются только в утверждённом плане. Цифры здесь дают структуру проверки, но не заменяют её.</p>\n</section>", "facilities": ["בריכה", "ספא", "חדר כושר", "קולנוע", "לאונג' דיירים", "אזורי ילדים", "מסחר בקומת הקרקע", "חניון", "ממ\"ד בכל דירה"]}, "UI": {"he": {"inquire": "מעניין אותי", "modules": "מודולים", "m_hero": "פתיח + תלת־ממד", "m_choose": "בחירת דירה", "m_price": "מחיר ושוק", "m_map": "מפה", "m_buy": "חוויית קנייה", "m_media": "מדיה", "m_area": "שכונה", "m_faq": "שאלות", "choose": "בוחרים את הדירה שלכם", "price": "מחיר מול השוק האמיתי", "mapt": "הכל על מפה אחת", "buy": "חוויית הקנייה", "media": "מדיה וגימור", "area": "השכונה", "faq": "שאלות ותשובות", "similar": "פרויקטים דומים", "floor": "קומה", "rooms": "חדרים", "sqm": "מ\"ר", "dir": "כיוון", "status": "סטטוס", "price_l": "מחיר", "est": "אומדן", "view": "מבט מהקומה", "plan": "תוכנית דירה", "st_available": "זמינה", "st_reserved": "בבדיקה", "st_sold": "נמכרה", "facade": "חזית", "model3d": "תלת־ממד", "ppsqm_l": "מחיר ממוצע למ\"ר", "area_deals": "עסקאות והשוואות באזור", "dist": "מרחק", "default_badge": "מודל ברירת מחדל · טרם התקבלו חומרים מהיזם", "est_badge": "אומדן להמחשה · לא מחיר יזם", "gen_badge": "דירות להמחשה · טרם התקבל מלאי מהיזם", "from_price": "החל מ־", "units_l": "דירות", "floors_l": "קומות", "delivery_l": "אכלוס", "dev_l": "יזם", "disc": "המידע, האומדנים וההדמיות נועדו להמחשה בלבד, אינם מחיר יזם או הצעה, ואינם מחייבים. יש לאמת כל פרט מול היזם.", "generic_badge": "מודל אדריכלי גנרי · להמחשה, לא התכנון הסופי", "price_of_apt": "מחיר הדירה", "eq_l": "הון עצמי", "loan_l": "הלוואה", "pay_l": "החזר חודשי משוער · 25 ש׳, 5%", "buy_mort_t": "אומדן משכנתא", "buy_steps_t": "שלבי הרכישה", "buy_pros_t": "בעלי מקצוע מאומתים", "step1": "בחירת דירה ובדיקת מחיר מול האזור", "step2": "בדיקת מסמכים: היתר, טאבו, מפרט", "step3": "ליווי עורך דין ושמאי", "step4": "אישור משכנתא ופנייה ליזם", "pro_law": "עורך/ת דין נדל״ן · מאומת", "pro_appr": "שמאי/ת מקרקעין · מאומת", "pro_mort": "יועץ/ת משכנתאות · מאומת", "map_streets": "רחובות", "map_sat": "לווי           ${P.units.map(u=>`<button class="fsq${u.status==='sold'?' is-sold':''}" data-id="${esc(u.id)}"
            style="inset-inline-start:${u.stage_x}%;top:${u.stage_y}%;width:${u.stage_w||15}%;height:${u.stage_h||7}%"
            aria-label="${esc(u.label||u.id)}"><span>${esc(u.label||u.id)}<small>${u.rooms} · ${u.floor}</small></span></button>`).join('')}
          <span class="facade-note">${esc(U.facade_note||'')}</span>
        </div>
        <model-viewer id="mv2" src="${esc(P.glb)}" poster="${esc(P.poster)}" reveal="auto" camera-controls auto-rotate
          auto-rotate-delay="1400" rotation-per-second="8deg" interaction-prompt="none" ar="false" environment-image="neutral"
          exposure="1.06" shadow-intensity="0.7" shadow-softness="1" style="width:100%;height:100%"
          camera-orbit="${esc(P.orbit)}" camera-target="${esc(P.target)}">${hotspots}</model-viewer>
      </div>
      <div>
        <div class="units" id="units"></div>
        <div class="panel" id="panel" hidden></div>
      </div>
    </div>
  </section>

  <section class="wrap" data-m="price">
    <div class="sec-h"><span class="eyebrow">02</span><h2>${U.price}</h2></div>
    <p class="sec-intro">${esc(AR.price)}</p>
    <div class="pricegrid">
      <div class="card bigprice">
        <div class="k">${U.ppsqm_l}</div><div class="n">${nf(P.ppsqm)} ₪</div>
        <div class="src">${esc(P.ppsqm_src)}</div>
      </div>
      <div class="card" style="padding:6px 6px 2px">
        <table><thead><tr><th>${U.area_deals}</th><th>${U.ppsqm_l}</th><th>${U.dist}</th></tr></thead>
        <tbody>${(P.comps||[]).map(c=>`<tr><td>${esc(c.name)}</td><td class="num">${nf(c.ppsqm)} ₪</td><td class="num">${nf(c.dist_m)} מ׳</td></tr>`).join('')||`<tr><td colspan="3" style="color:var(--soft)">${U.est_badge}</td></tr>`}</tbody></table>
      </div>
    </div>
  </section>

  <section class="wrap" data-m="map">
    <div class="sec-h"><span class="eyebrow">03</span><h2>${U.mapt}</h2></div>
    <p class="sec-intro">${esc(AR.mapt)}</p>
    <div class="maplayers" id="maplayers">
      <button class="on" data-s="streets">${U.map_streets}</button>
      <button data-s="satellite">${U.map_sat}</button>
      <button data-s="prices">${U.map_prices}</button>
    </div>
    <div id="map"></div>
  </section>

  <section class="wrap" data-m="buy">
    <div class="sec-h"><span class="eyebrow">04</span><h2>${U.buy}</h2></div>
    <p class="sec-intro">${esc(AR.buy)}</p>
    <div class="buy3">
      <div class="card buycard mort">
        <h3>${U.buy_mort_t}</h3>
        <div class="row"><span>${U.price_of_apt}</span><b id="m_price">-</b></div>
        <label style="font-size:12px;color:var(--soft)">${U.eq_l} <span id="m_eqp">30%</span>
          <input type="range" id="m_eq" min="25" max="70" value="30"></label>
        <div class="row"><span>${U.loan_l}</span><b id="m_loan">-</b></div>
        <div class="row"><span>${U.pay_l}</span><b id="m_pay">-</b></div>
      </div>
      <div class="card buycard"><h3>${U.buy_steps_t}</h3>
        <ol class="steps"><li>${esc(U.step1)}</li><li>${esc(U.step2)}</li><li>${esc(U.step3)}</li><li>${esc(U.step4)}</li></ol>
      </div>
      <div class="card buycard"><h3>${U.buy_pros_t}</h3>
        <div class="pros">
          <div class="pro"><span class="av">1</span><span>${esc(U.pro_law)}</span></div>
          <div class="pro"><span class="av">2</span><span>${esc(U.pro_appr)}</span></div>
          <div class="pro"><span class="av">3</span><span>${esc(U.pro_mort)}</span></div>
        </div>
      </div>
    </div>
  </section>

  <section class="wrap" data-m="media">
    <div class="sec-h"><span class="eyebrow">05</span><h2>${U.media}</h2></div>
    <div class="card" style="padding:0;overflow:hidden"><img src="${esc(P.poster)}" alt="${esc(P.name_lat)} - ${U.render_alt}" style="width:100%;display:block"></div>
  </section>

  <section class="wrap" data-m="area">
    <div class="sec-h"><span class="eyebrow">06</span><h2>${U.area}</h2></div>
    <p class="sec-intro">${esc(P.address)} · ${esc(P.city)}</p>
  </section>

  <section class="wrap faq" data-m="faq">
    <div class="sec-h"><span class="eyebrow">07</span><h2>${U.faq}</h2></div>
    <details><summary>${esc(P.name_lat)} - ${U.est} ${U.ppsqm_l}?</summary><p>${nf(P.ppsqm)} ₪ · ${esc(P.ppsqm_src)}</p></details>
    <details><summary>${esc(U.faq_q_delivery)}</summary><p>${esc(P.delivery)} · ${esc(P.dev)}</p></details>
  </section>

  <section class="wrap" data-m="article">
    <div class="sec-h"><span class="eyebrow">SEO</span><h2>${U.art_title||''}</h2></div>
    ${P.facilities&&P.facilities.length?`<div class="facil">${P.facilities.map(f=>`<span>${esc(f)}</span>`).join('')}</div>`:''}
    <div class="fullart" dir="${D.RTL.indexOf(LANG)>=0?'rtl':'ltr'}">${P.article_html||''}</div>
  </section>
  <div class="wrap"><div class="disc">${U.disc}</div></div>
  <footer class="wrap">נדלן · ${esc(P.name_lat)} · תבנית מודולרית · he/en/fr/ru/ar</footer>
  `;
  renderLangs();renderMods();renderUnits();wire();initMap();
  document.getElementById('fromp').textContent = nf(Math.min(...P.units.map(est)))+' ₪';
  applyMods();
}

function clampMV(){
  const m=document.getElementById('mv2');
  const c=m&&m.shadowRoot&&m.shadowRoot.querySelector('canvas');
  if(c){c.style.maxWidth='100%';c.style.maxHeight='100%';}
}
setInterval(clampMV,1500);
function renderLangs(){
  // SEO law: the switcher links to REAL per-language files (crawlable <a hreflang>),
  // never a JS-only swap. Fallback to in-page swap only if no file map was injected.
  const c=document.getElementById('langs');c.innerHTML='';
  D.LANGS.forEach(l=>{
    const f=D.lang_files&&D.lang_files[l];
    if(f){const a=document.createElement('a');a.textContent=D.LANG_NAMES[l];a.href=f;
      a.hreflang=l;a.className=l===LANG?'on':'';c.appendChild(a);}
    else{const b=document.createElement('button');b.textContent=D.LANG_NAMES[l];
      b.className=l===LANG?'on':'';b.onclick=()=>{LANG=l;const s=window.scrollY;build();window.scrollTo(0,s);};c.appendChild(b);}
  });
}
function renderMods(){
  const c=document.getElementById('modlist');c.innerHTML='';
  MODULES.forEach(([k,lbl])=>{const id='mod_'+k;
    c.insertAdjacentHTML('beforeend',`<label><input type="checkbox" id="${id}" ${ON[k]?'checked':''}><span>${U[lbl]}</span></label>`);
    setTimeout(()=>{const el=document.getElementById(id);if(el)el.onchange=e=>{ON[k]=e.target.checked?1:0;applyMods();};});
  });
}
function applyMods(){MODULES.forEach(([k])=>{const s=document.querySelector(`[data-m="${k}"]`);if(s)s.style.display=ON[k]?'':'none';});}
function renderUnits(){
  const c=document.getElementById('units');c.innerHTML='';
  P.units.forEach(u=>{const el=document.createElement('button');el.className='unit '+statusClass(u.status);el.dataset.id=u.id;
    el.innerHTML=`<span class="dot"></span><span class="meta"><span class="t">${U.rooms} ${u.rooms} · ${U.floor} ${u.floor}</span>
      <span class="s">${u.sqm} ${U.sqm} · ${esc(u.dir)} · ${statusLabel(u.status)}</span></span>
      <span class="p">${nf(est(u))} ₪</span>`;
    el.onclick=()=>select(u.id);c.appendChild(el);});
}
let povPrev=null;
function enterPOV(u){
  const m=document.getElementById('mv2'); if(!m||!u.hotspot) return;
  document.querySelector('.toggle button[data-view="3d"]')?.click();
  povPrev={orbit:m.getAttribute('camera-orbit'),target:m.getAttribute('camera-target'),fov:m.getAttribute('field-of-view')||'30deg'};
  m.autoRotate=false;
  m.cameraTarget=u.hotspot[0]+'m '+u.hotspot[1]+'m '+u.hotspot[2]+'m';
  m.cameraOrbit='0deg 85deg 2m'; m.fieldOfView='75deg';
  document.getElementById('povbar').classList.add('on');
  document.getElementById('stage').scrollIntoView({behavior:'smooth',block:'center'});
}
function exitPOV(){
  const m=document.getElementById('mv2'); if(!m||!povPrev) return;
  m.cameraTarget=povPrev.target; m.cameraOrbit=povPrev.orbit; m.fieldOfView=povPrev.fov;
  document.getElementById('povbar').classList.remove('on'); povPrev=null;
}
function renderPins(){
  const c=document.getElementById('pins');c.innerHTML='';
  const top=P.floors||40;
  P.units.forEach(u=>{const frac=Math.min(.92,Math.max(.06,u.floor/top));
    const p=document.createElement('div');p.className='pin '+statusClass(u.status);p.dataset.id=u.id;
    p.style.insetBlockEnd=(6+frac*80)+'%';
    p.innerHTML=`<button title="${U.floor} ${u.floor}">${u.floor}</button>`;
    p.querySelector('button').onclick=()=>select(u.id);c.appendChild(p);});
}
function select(id){sel=id;const u=P.units.find(x=>x.id===id);
  document.querySelectorAll('.unit').forEach(e=>e.classList.toggle('on',e.dataset.id===id));
  document.querySelectorAll('.mvhot').forEach(e=>e.classList.toggle('on',e.dataset.id===id));
  document.querySelectorAll('.fsq').forEach(e=>e.classList.toggle('on',e.dataset.id===id));
  if(u.uorbit){const m2=document.getElementById('mv2');if(m2){m2.autoRotate=false;m2.cameraOrbit=u.uorbit;}}
  clampMV();
  const pn=document.getElementById('panel');pn.hidden=false;
  pn.innerHTML=`<div class="grid">
    <div><div class="k">${U.floor}</div><div class="v">${u.floor}</div></div>
    <div><div class="k">${U.rooms}</div><div class="v">${u.rooms}</div></div>
    <div><div class="k">${U.sqm}</div><div class="v">${u.sqm}</div></div>
    <div><div class="k">${U.price_l} (${U.est})</div><div class="v" style="color:var(--terra)">${nf(est(u))} ₪</div></div>
    </div>
    <div class="row"><span class="chipbtn">${U.dir}: ${esc(u.dir)}</span><span class="chipbtn">${U.plan}</span>
      <button class="chipbtn" data-act="pov" data-id="${esc(u.id)}" style="cursor:pointer;border-color:var(--gold);color:var(--gold);background:transparent">👁 ${U.pov||U.view}</button>
      <button class="cta">${U.inquire} · ${esc(u.label||u.id)}</button></div>`;
  document.querySelectorAll('.fsq').forEach(e=>{if(!e.dataset.wired){e.dataset.wired=1;e.onclick=()=>{if(!e.classList.contains('is-sold'))select(e.dataset.id);};}});
  const pvb=pn.querySelector('[data-act="pov"]'); if(pvb) pvb.onclick=()=>enterPOV(u);
  const pxe=document.getElementById('povexit'); if(pxe&&!pxe.dataset.wired){pxe.dataset.wired=1;pxe.onclick=exitPOV;}
  const m=document.getElementById('m_price');if(m){m.textContent=nf(est(u))+' ₪';recalcMort();}
}
function wire(){
  const mb=document.getElementById('modbtn'),mp=document.getElementById('modpop');
  mb.onclick=()=>mp.classList.toggle('open');
  document.addEventListener('click',e=>{if(!e.target.closest('#modpop')&&!e.target.closest('#modbtn'))mp.classList.remove('open');});
  document.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.toggle button').forEach(x=>x.classList.toggle('on',x===b));
    document.getElementById('facade').classList.toggle('on',b.dataset.view==='facade');
    document.getElementById('mv2').style.visibility=b.dataset.view==='facade'?'hidden':'visible';
  });
  const eq=document.getElementById('m_eq');if(eq)eq.oninput=recalcMort;
  document.querySelectorAll('.mvhot').forEach(b=>b.addEventListener('click',()=>select(b.dataset.id)));
}
function recalcMort(){const u=P.units.find(x=>x.id===sel);if(!u)return;const price=est(u);
  const eq=+document.getElementById('m_eq').value;document.getElementById('m_eqp').textContent=eq+'%';
  const loan=price*(1-eq/100);const r=0.05/12,n=300;const pay=loan*r/(1-Math.pow(1+r,-n));
  document.getElementById('m_loan').textContent=nf(loan)+' ₪';
  document.getElementById('m_pay').textContent=nf(pay)+' ₪';
}
function initMap(){
  if(!window.mapboxgl){return;}
  mapboxgl.accessToken=D.TOKEN;
  map=new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/light-v11',
    center:[P.lng,P.lat],zoom:14.3,pitch:45,bearing:-15,cooperativeGestures:true});
  map.addControl(new mapboxgl.NavigationControl(),'top-left');
  map.on('load',()=>{
    // 3D buildings
    const layers=map.getStyle().layers;const lbl=layers.find(l=>l.type==='symbol'&&l.layout&&l.layout['text-field']);
    map.addLayer({id:'3db',source:'composite','source-layer':'building',type:'fill-extrusion',minzoom:13,
      paint:{'fill-extrusion-color':'#d8cfbe','fill-extrusion-height':['get','height'],'fill-extrusion-opacity':.6}},lbl&&lbl.id);
    // self marker
    const selfEl=document.createElement('div');selfEl.className='pricepin self';selfEl.textContent=nf(P.ppsqm)+' ₪/מ׳';
    new mapboxgl.Marker(selfEl).setLngLat([P.lng,P.lat]).setPopup(new mapboxgl.Popup().setText(P.name_lat)).addTo(map);
    // comps (real, relative offsets by distance)
    (P.comps||[]).forEach((c,i)=>{const ang=(i*137)*Math.PI/180,d=(c.dist_m||300)/111320;
      const el=document.createElement('div');el.className='pricepin';el.textContent=nf(c.ppsqm)+' ₪';
      new mapboxgl.Marker(el).setLngLat([P.lng+Math.cos(ang)*d/Math.cos(P.lat*Math.PI/180),P.lat+Math.sin(ang)*d])
        .setPopup(new mapboxgl.Popup().setText(c.name)).addTo(map);});
  });
  document.querySelectorAll('#maplayers button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#maplayers button').forEach(x=>x.classList.toggle('on',x===b));
    const s=b.dataset.s;if(s==='satellite')map.setStyle('mapbox://styles/mapbox/satellite-streets-v12');
    else map.setStyle('mapbox://styles/mapbox/light-v11');
  });
}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
build();
</script>
</body>
</html>
