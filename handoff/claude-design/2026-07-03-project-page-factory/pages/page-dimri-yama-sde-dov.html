B5AHoAeAB6AHsAfAB9AH4AfAB+AH8AgACBAIIAgACCAIMAhACFAIYAhACGAIcAiACJAIoAiACKAIsAjACNAI4AjACOAI8AkACRAJIAkACSAJMAlACVAJYAlACWAJcAmACZAJoAmACaAJsAnACdAJ4AnACeAJ8AoAChAKIAoACiAKMApAClAKYApACmAKcAqACpAKoAqACqAKsArACtAK4ArACuAK8AsACxALIAsACyALMAtAC1ALYAtAC2ALcAuAC5ALoAuAC6ALsAvAC9AL4AvAC+AL8AwADBAMIAwADCAMMAxADFAMYAxADGAMcAyADJAMoAyADKAMsAzADNAM4AzADOAM8A0ADRANIA0ADSANMA1ADVANYA1ADWANcA", "poster": "https://nad-lan.co.il/wp-content/uploads/2026/07/dimri-yama-sde-dov-plate-v2.webp", "default_model": false, "units": [{"id": "d1", "floor": 12, "rooms": 3, "sqm": 92, "dir": "מערב", "status": "available", "label": "A-12", "hotspot": "-14.297 38.44 0", "hnormal": "-1 0 0", "uorbit": "270deg 72deg 112m", "stage_x": 36, "stage_y": 63.2, "stage_w": 14, "stage_h": 6.5}, {"id": "d2", "floor": 24, "rooms": 4, "sqm": 132, "dir": "דרום מערב", "status": "reserved", "label": "B-24", "hotspot": "-9.853 75.64 -9.853", "hnormal": "-0.707 0 -0.707", "uorbit": "225deg 72deg 112m", "stage_x": 29, "stage_y": 40.5, "stage_w": 14, "stage_h": 6.5}, {"id": "d3", "floor": 30, "rooms": 4, "sqm": 140, "dir": "מערב", "status": "available", "label": "B-30", "hotspot": "-13.752 94.24 0", "hnormal": "-1 0 0", "uorbit": "270deg 72deg 112m", "stage_x": 46, "stage_y": 29.1, "stage_w": 14, "stage_h": 6.5}, {"id": "d4", "floor": 37, "rooms": 5, "sqm": 185, "dir": "דרום מערב", "status": "available", "label": "PH-37", "hotspot": "-9.575 115.94 -9.575", "hnormal": "-0.707 0 -0.707", "uorbit": "225deg 72deg 112m", "stage_x": 24, "stage_y": 16.4, "stage_w": 14, "stage_h": 6.5}], "comps": [{"name": "ASHIRA שדה דב", "ppsqm": 75000, "dist_m": 310}, {"name": "Rainbow תל אביב", "ppsqm": 76000, "dist_m": 210}], "official_url": "", "orbit": "-30deg 70deg 229m", "target": "0m 50m 0m", "model_generic": true, "article_html": "\n<h2 dir=\"rtl\">DIMRI YAMA שדה דב - תמצית הפרויקט ושורה תחתונה</h2>\n<p dir=\"rtl\">DIMRI YAMA הוא אחד הפרויקטים הבולטים ברובע שדה דב בתל אביב, הן בגלל המיקום בקו ראשון לחוף הים והן בגלל מבנה העסקה שממנה הגיע הפרויקט לידי היזם הנוכחי. הפרויקט משווק על ידי י.ח דמרי, באמצעות החברה י.ח דמרי בשדה דב בע\"מ, והוא ממוקם במתחם אשכול, ברחוב אבן גבירול 220, בין חוף הים, פארק הירקון והמרחב העירוני החדש של צפון תל אביב.</p>\n<p dir=\"rtl\">השורה התחתונה לרוכש היא שמדובר בפרויקט יוקרה משמעותי, בהיקף של 458 יחידות דיור, בארבעה מבנים, עם שילוב בין מגדלים גבוהים לבנייה מרקמית נמוכה יותר. שני המגדלים מתוכננים לגובה של 39 ו-16 קומות, לצד שני מבנים מרקמיים בני 8 עד 9 קומות. השילוב הזה יוצר פרויקט שאינו רק מגדל מגורים יחיד, אלא מתחם מגורים מלא, עם מעטפת ירוקה, גן פנימי משותף ומערך מתקנים רחב.</p>\n<p dir=\"rtl\">המחיר שפורסם מתחיל מ-3.75 מיליון שקל. לפי הנתונים שנמסרו, המכירה המוקדמת החלה והבנייה החלה. מבחינת רוכש, המשמעות היא שהפרויקט כבר עבר משלב רעיוני לשלב מסחרי ומעשי, אך עדיין נדרש לבחון בזהירות את חוזה המכר, לוחות הזמנים, הבטוחות, המפרט, מנגנוני ההצמדה, דמי הניהול העתידיים וההשלכות המיסויות.</p>\n<p dir=\"rtl\">הייחוד של DIMRI YAMA אינו מסתכם רק במיקום ובתכנון. ביולי 2024 דמרי רכשה את פרויקט הבנייה בשדה דב מחברת חנן מור במסגרת הסדר חוב, תמורת כ-1.1 מיליארד שקל. זהו נתון מהותי, משום שרוכש דירה על הנייר צריך להבין לא רק מי מוכר לו את הדירה היום, אלא גם מה רציפות הזכויות בפרויקט, אילו התחייבויות עברו ליזם החדש, ומה נבדק במסגרת המעבר בין היזמים.</p>\n<p dir=\"rtl\">לצד זאת, פורסם בכלי תקשורת כי כמעט מחצית מהדירות שדמרי מכרה נרכשו על ידי בעל השליטה בחברה. נתון כזה אינו הופך את הפרויקט לטוב או רע בפני עצמו, אך הוא מחייב הסתכלות צרכנית זהירה: מה שיעור המכירות לצדדים שלישיים, מה טיב העסקאות, איך הדבר מוצג בדוחות ובפרסומים, והאם תמונת הביקוש שהרוכש רואה משקפת ביקוש חיצוני מלא או גם עסקאות בעלי עניין.</p>\n\n<h2 dir=\"rtl\">הנתונים: דירות, קומות ובניינים</h2>\n<table dir=\"rtl\">\n<thead dir=\"rtl\">\n<tr dir=\"rtl\">\n<th dir=\"rtl\">פרמטר</th>\n<th dir=\"rtl\">נתון</th>\n<th dir=\"rtl\">משמעות לרוכש</th>\n</tr>\n</thead>\n<tbody dir=\"rtl\">\n<tr dir=\"rtl\">\n<td dir=\"rtl\">שם הפרויקט</td>\n<td dir=\"rtl\">DIMRI YAMA שדה דב</td>\n<td dir=\"rtl\">מותג פרויקט יוקרה ברובע שדה דב</td>\n</tr>\n<tr dir=\"rtl\">\n<td dir=\"rtl\">יזם</td>\n<td dir=\"rtl\">י.ח דמרי, באמצעות י.ח דמרי בשדה דב בע\"מ</td>\n<td dir=\"rtl\">יש לבדוק את זהות החברה המוכרת בחוזה, לא רק את שם הקבוצה</td>\n</tr>\n<tr dir=\"rtl\">\n<td dir=\"rtl\">מיקום</td>\n<td dir=\"rtl\">רחוב אבן גבירול 220, מתחם אשכול, רובע שדה דב</td>\n<td dir=\"rtl\">קו ראשון לחוף ובקרבת פארק הירקון</td>\n</tr>\n<tr dir=\"rtl\">\n<td dir=\"rtl\">מספר יחידות דיור</td>\n<td dir=\"rtl\">458 יחידות דיור</td>\n<td dir=\"rtl\">פרויקט רחב היקף, עם חשיבות לניהול, תחזוקה ודמי ניהול</td>\n</tr>\n<tr dir=\"rtl\">\n<td dir=\"rtl\">מספר מבנים</td>\n<td dir=\"rtl\">4 מבנים</td>\n<td dir=\"rtl\">מתחם מגורים מלא, לא בניין בודד</td>\n</tr>\n<tr dir=\"rtl\">\n<td dir=\"rtl\">מגדלים</td>\n<td dir=\"rtl\">2 מגדלים בני 39 ו-16 קומות</td>\n<td dir=\"rtl\">פערי גובה, נוף, חשיפה לרוח, מעליות ותחזוקה</td>\n</tr>\n<tr dir=\"rtl\">\n<td dir=\"rtl\">מבנים מרקמיים</td>\n<td dir=\"rtl\">2 מבנים בני 8 עד 9 קומות</td>\n<td dir=\"rtl\">אפשרות לאופי מגורים נמוך יותר בתוך אותו מתחם</td>\n</tr>\n<tr dir=\"rtl\">\n<td dir=\"rtl\">מחיר פתיחה שפורסם</td>\n<td dir=\"rtl\">החל מ-3.75 מיליון שקל</td>\n<td dir=\"rtl\">נקודת כניסה לפרויקט, לא מחיר ממוצע ולא מחיר לכל דירה</td>\n</tr>\n<tr dir=\"rtl\">\n<td dir=\"rtl\">שלב מסחרי</td>\n<td dir=\"rtl\">החלה מכירה מוקדמת</td>\n<td dir=\"rtl\">יש לבדוק תנאי פריסייל, הצמדות, בטוחות ולוחות זמנים</td>\n</tr>\n<tr dir=\"rtl\">\n<td dir=\"rtl\">שלב ביצוע</td>\n<td dir=\"rtl\">הבנייה החלה</td>\n<td dir=\"rtl\">יש לבדוק מה בדיוק בוצע ומה נותר עד למסירה</td>\n</tr>\n</tbody>\n</table>\n<p dir=\"rtl\">טבלת הנתונים מציגה את הסיפור המרכזי של הפרויקט: מיקום נדיר, היקף גדול, יזם מוכר, תכנון יוקרתי, אך גם מורכבות משפטית ועסקית שדורשת בדיקה מסודרת. בפרויקט בהיקף של 458 יחידות דיור, איכות הדירה הפרטית היא רק חלק מהתמונה. הרוכש צריך לבדוק גם את איכות ניהול המתחם, רמת המתקנים, אופי האוכלוסייה הצפויה, התחזוקה העתידית והיכולת לשמור על רמת שירות גבוהה לאורך שנים.</p>\n\n<h2 dir=\"rtl\">מיקום: קו ראשון לחוף, מתחם אשכול ואבן גבירול 220</h2>\n<p dir=\"rtl\">המיקום של DIMRI YAMA הוא אחד מעוגני הערך המרכזיים של הפרויקט. רחוב אבן גבירול 220, בתוך מתחם אשכול ברובע שדה דב, מציב את הפרויקט במרחב שבו נפגשים שלושה נכסים עירוניים נדירים: חוף הים של תל אביב, פארק הירקון והרובע החדש שנבנה על שטחי שדה דב לשעבר.</p>\n<p dir=\"rtl\">קו ראשון לחוף אינו רק ביטוי שיווקי. במונחי נדל\"ן, קרבה ישירה לים משפיעה על תפיסת היוקרה, על הביקוש מצד רוכשי פרימיום, על רמת המחירים ועל הסחירות העתידית. רוכש דירה בפרויקט כזה אינו קונה רק מטרים בנויים, אלא גם חשיפה לנוף, אוויר, אור, קרבה לטיילת ולעתיד העירוני של צפון תל אביב.</p>\n<p dir=\"rtl\">החיבור לפארק הירקון מוסיף רובד נוסף. דירה שנמצאת בין החוף לפארק נהנית ממיקום שאינו מבוסס רק על חיי חוף, אלא גם על נגישות לשטחים ירוקים, מסלולי הליכה, רכיבה ופעילות משפחתית. עבור משפחות, זוגות מבוגרים, משפרי דיור ותושבי חוץ, השילוב בין ים לפארק יכול להיות רכיב משמעותי בהחלטת רכישה.</p>\n<p dir=\"rtl\">מנגד, מיקום כזה דורש בדיקות עומק. יש לבחון את תוכניות הפיתוח סביב הבניין, את שלבי הביצוע של הרובע, את דרכי הגישה בתקופת הבנייה, את עומסי התנועה הצפויים, את פתרונות החניה, ואת השאלה האם הדירה הספציפית נהנית מנוף לים או רק מהשתייכות כללית לפרויקט בקו ראשון. בפרויקט יוקרה, ההבדל בין דירה עם נוף פתוח לדירה עם חשיפה חלקית עשוי להיות מהותי.</p>\n\n<h2 dir=\"rtl\">אדריכלות ועיצוב: רני זיס ו-Kelly Hoppen</h2>\n<p dir=\"rtl\">האדריכלות של DIMRI YAMA נושאת את חתימתו של משרד האדריכלים רני זיס. בפרויקט המשלב 4 מבנים, שני מגדלים ושני מבנים מרקמיים, האדריכלות נדרשת להתמודד עם כמה שכבות במקביל: חזית עירונית, קרבה לים, חיבור לגן פנימי, כניסות לבניינים, פרטיות הדיירים, חלוקת שטחים ציבוריים ויצירת מתחם שאינו מרגיש צפוף למרות היקפו.</p>\n<p dir=\"rtl\">הקונספט שהוצג לפרויקט הוא החופש להיות, עם ארבעה מבנים המוקפים במעטפת ירוקה וגן פנימי משותף. מבחינה צרכנית, המשמעות של קונספט כזה נמדדת לא בסיסמה אלא בפרטים: האם הגן הפנימי נגיש ושימושי, איך הוא מתוחזק, מי משלם על התחזוקה, האם הוא מייצר פרטיות או תנועה רבה מתחת לדירות, ומה היחס בין שטחי הפיתוח לבין מספר הדיירים.</p>\n<p dir=\"rtl\">עיצוב הפנים מיוחס למעצבת הבינלאומית עטורת הפרסים Kelly Hoppen. בפרויקטי יוקרה, שם של מעצב או מעצבת יכול לחזק את המיצוב, אך הרוכש צריך לבדוק מה בדיוק כלול בדירה, בלובי, בחללים המשותפים ובמפרט. יש הבדל בין השראה עיצובית, עיצוב חללים ציבוריים, בחירת חומרים, עיצוב דירות לדוגמה, לבין התחייבות חוזית מפורטת במפרט המכר.</p>\n<p dir=\"rtl\">לכן, בבדיקת הפרויקט יש לבקש לראות את המפרט הטכני ולא להסתפק בהדמיות. יש לבדוק את סוגי החיפויים, מערכות המיזוג, דלתות, חלונות, זכוכית, ריצוף, מטבח, כלים סניטריים, פתרונות הצללה, תשתיות חשמל ותקשורת, וכן את רמת הגמר בשטחים המשותפים. בפרויקט המתומחר כמוצר יוקרה, המפרט הוא מסמך כלכלי ומשפטי, לא נספח טכני שולי.</p>\n\n<h2 dir=\"rtl\">תמהיל הדירות והמרפסות</h2>\n<p dir=\"rtl\">לפי הנתונים שנמסרו, DIMRI YAMA כולל מגוון דירות יוקרה עם מרפסות ונוף לים. התמהיל המדויק של מספרי חדרים, שטחי דירות, שטחי מרפסות ופיזור הדירות בין המבנים הוא נתון שיש לבחון מול מסמכי השיווק והמפרט של כל דירה. ברובע שדה דב, ובמיוחד בקו ראשון לחוף, התמהיל משפיע על קהל היעד ועל רמת הסחירות העתידית.</p>\n<p dir=\"rtl\">מרפסת בדירת יוקרה תל אביבית אינה רק תוספת שימושית. היא חלק מחוויית המגורים וחלק ממנגנון התמחור. יש לבדוק את שטח המרפסת, עומקה, כיוון האוויר, מידת החשיפה לשמש, הקרבה לדירות סמוכות, קשר עין עם שטחים ציבוריים, והאם הנוף לים פתוח, צדי, חלקי או תלוי בקומה.</p>\n<p dir=\"rtl\">בפרויקט עם שני מגדלים בגבהים שונים, 39 ו-16 קומות, לצד שני מבנים מרקמיים בני 8 עד 9 קומות, קיים פער טבעי בין סוגי הדירות. דירה במגדל גבוה עשויה להציע חוויית נוף אחרת מדירה במבנה נמוך יותר. דירה במבנה מרקמי עשויה להתאים לרוכש שמעדיף תחושה אינטימית יותר, פחות תלות במעליות ופחות גובה, אך ייתכן שהנוף והחשיפה יהיו שונים.</p>\n<p dir=\"rtl\">הבחירה הנכונה אינה בהכרח הדירה הגבוהה ביותר או היקרה ביותר. רוכש צריך למפות את הצרכים שלו: מגורי קבע, דירת נופש עירונית, השקעה, מגורים למשפחה, דירה לתושב חוץ או נכס לשימור הון. לכל שימוש יש משקל שונה לנוף, מרפסת, חניה, מחסן, קרבה למעלית, קומה, כיווני אוויר ודמי ניהול.</p>\n\n<h2 dir=\"rtl\">מתקנים ושירותים: בריכות, ספא, יוגה, גן פנימי</h2>\n<p dir=\"rtl\">DIMRI YAMA מציג סל מתקנים רחב: בריכת אינפיניטי, בריכה פנימית, מתחם ספא, סטודיו ויוגה, חדר כושר וגן פנימי משותף. אלה מתקנים שממקמים את הפרויקט בקטגוריית יוקרה, אך עבור רוכש הם מייצרים גם התחייבות כלכלית מתמשכת. מתקנים כאלה דורשים ניקיון, תחזוקה, ביטוח, כוח אדם, מערכות בטיחות, חשמל, מים וניהול שוטף.</p>\n<table dir=\"rtl\">\n<thead dir=\"rtl\">\n<tr dir=\"rtl\">\n<th dir=\"rtl\">מתקן</th>\n<th dir=\"rtl\">תרומה לדייר</th>\n<th dir=\"rtl\">בדיקה צרכנית</th>\n</tr>\n</thead>\n<tbody dir=\"rtl\">\n<tr dir=\"rtl\">\n<td dir=\"rtl\">בריכת אינפיניטי</td>\n<td dir=\"rtl\">חוויית יוקרה ונוף</td>\n<td dir=\"rtl\">מיקום, שעות פעילות, עלויות תחזוקה ובטיחות</td>\n</tr>\n<tr dir=\"rtl\">\n<td dir=\"rtl\">בריכה פנימית</td>\n<td dir=\"rtl\">שימוש עונתי רחב יותר</td>\n<td dir=\"rtl\">אוורור, חימום, ניקוז ותחזוקה</td>\n</tr>\n<tr dir=\"rtl\">\n<td dir=\"rtl\">מתחם ספא</td>\n<td dir=\"rtl\">שירות פרימיום לדיירים</td>\n<td dir=\"rtl\">האם כלול בדמי הניהול ומה רמת השירות</td>\n</tr>\n<tr dir=\"rtl\">\n<td dir=\"rtl\">סטודיו ויוגה</td>\n<td dir=\"rtl\">פעילות פנאי ובריאות בתוך המתחם</td>\n<td dir=\"rtl\">זמינות, קיבולת, רעש ושימושים מותרים</td>\n</tr>\n<tr dir=\"rtl\">\n<td dir=\"rtl\">חדר כושר</td>\n<td dir=\"rtl\">נוחות יומיומית וחיסכון ביציאה החוצה</td>\n<td dir=\"rtl\">ציוד, אחריות, ביטוח, ניקיון ושעות פתיחה</td>\n</tr>\n<tr dir=\"rtl\">\n<td dir=\"rtl\">גן פנימי משותף</td>\n<td dir=\"rtl\">מרחב ירוק לדיירים</td>\n<td dir=\"rtl\">פרטיות, השקיה, גינון, שימוש ילדים ואירועים</td>\n</tr>\n</tbody>\n</table>\n<p dir=\"rtl\">הבדיקה המרכזית אינה האם המתקנים קיימים בהדמיה, אלא כיצד הם מעוגנים במסמכי הפרויקט. יש לברר האם יש תקנון שימוש, האם קיימת חברת ניהול, מה מנגנון קביעת דמי הניהול, מי אחראי לתחזוקה בתקופת הבדק, ומה קורה אם בעתיד הדיירים ירצו לצמצם או לשנות שירותים.</p>\n\n<h2 dir=\"rtl\">מחירים: החל מ-3.75 מיליון והשוואה לאזור</h2>\n<p dir=\"rtl\">המחיר שפורסם ל-DIMRI YAMA מתחיל מ-3.75 מיליון שקל. מחיר פתיחה הוא נתון חשוב, אך הוא אינו מספר שממנו ניתן להסיק באופן אוטומטי את מחיר רוב הדירות בפרויקט. בפרויקטים מסוג זה, המחיר הסופי מושפע מהקומה, מהנוף, מהמבנה שבו נמצאת הדירה, מהשטח, מהמרפסת, מהחניה, מהמחסן, מהמפרט ומהשלב שבו נחתמת העסקה.</p>\n<table dir=\"rtl\">\n<thead dir=\"rtl\">\n<tr dir=\"rtl\">\n<th dir=\"rtl\">סוג השוואה</th>\n<th dir=\"rtl\">מה ידוע לפי הנתונים</th>\n<th dir=\"rtl\">איך רוכש צריך לקרוא את הנתון</th>\n</tr>\n</thead>\n<tbody dir=\"rtl\">\n<tr dir=\"rtl\">\n<td dir=\"rtl\">מחיר פתיחה בפרויקט</td>\n<td dir=\"rtl\">החל מ-3.75 מיליון שקל</td>\n<td dir=\"rtl\">נקודת כניסה בלבד, לא מחיר ממוצע</td>\n</tr>\n<tr dir=\"rtl\">\n<td dir=\"rtl\">מיקום ביחס לרובע</td>\n<td dir=\"rtl\">קו ראשון לחוף, מתחם אשכול</td>\n<td dir=\"rtl\">מיקום פרימיום בתוך רובע חדש</td>\n</tr>\n<tr dir=\"rtl\">\n<td dir=\"rtl\">מיקום ביחס לעיר</td>\n<td dir=\"rtl\">צפון תל אביב, בין הים לפארק הירקון</td>\n<td dir=\"rtl\">שוק בעל ביקוש חזק, אך רגיש מאוד לפרטי הדירה</td>\n</tr>\n<tr dir=\"rtl\">\n<td dir=\"rtl\">שלב מכירה</td>\n<td dir=\"rtl\">מכירה מוקדמת החלה</td>\n<td dir=\"rtl\">יש לבדוק הנחה, הצמדה, פריסת תשלומים ובטוחות</td>\n</tr>\n<tr dir=\"rtl\">\n<td dir=\"rtl\">שלב ביצוע</td>\n<td dir=\"rtl\">הבנייה החלה</td>\n<td dir=\"rtl\">פחות מוקדם מתכנון בלבד, אך עדיין רכישה על הנייר</td>\n</tr>\n<tr dir=\"rtl\">\n<td dir=\"rtl\">רמת מוצר</td>\n<td dir=\"rtl\">בריכות, ספא, יוגה, חדר כושר וגן פנימי</td>\n<td dir=\"rtl\">יוקרה תפעולית שמגדילה גם את חשיבות דמי הניהול</td>\n</tr>\n</tbody>\n</table>\n<p dir=\"rtl\">בהשוואה לאזור, הדרך הנכונה אינה לשאול רק האם המחיר גבוה או נמוך, אלא מה מקבלים מול המחיר. ברובע שדה דב יש חשיבות למגרש, לקו החוף, למרחק מהים, לקומה, לכיוון, למועד המסירה, למפרט ולזהות היזם. מחיר התחלתי עשוי להיראות נגיש יחסית לפרויקט יוקרה, אך דירה ספציפית עם יתרונות נוף, שטח ומיקום פנימי עשויה להיות מוצר אחר לחלוטין.</p>\n<p dir=\"rtl\">רוכש צריך לבקש טבלת מחירים עדכנית לדירות זמינות, פירוט מלא של שטחים, מחיר חניה ומחסן אם אינם כלולים, מנגנון הצמדה, לוח תשלומים, אומדן דמי ניהול והסבר על כל תשלום נוסף. בפרויקט כזה, העלות האמיתית היא מחיר הדירה בתוספת מס רכישה, עלויות מימון, שכר טרחה, הצמדות, שדרוגים, ריהוט, התאמות ודמי ניהול שוטפים.</p>\n\n<h2 dir=\"rtl\">שלב הפרויקט וסיפור הרכישה מחנן מור בהסדר חוב</h2>\n<p dir=\"rtl\">אחד הנתונים המשמעותיים בפרויקט הוא סיפור הקרקע והמעבר בין היזמים. ביולי 2024 דמרי רכשה את פרויקט הבנייה בשדה דב מחברת חנן מור במסגרת הסדר חוב, תמורת כ-1.1 מיליארד שקל. זהו נתון חריג בחשיבותו ביחס לעמוד פרויקט רגיל, משום שהוא מחבר בין שוק המגורים, שוק האשראי, הסדרי חוב וזכויות במקרקעין.</p>\n<p dir=\"rtl\">מבחינת רוכש, הסדר חוב אינו בהכרח סימן אזהרה שמונע רכישה. לעיתים מעבר ליזם חזק ומנוסה יכול לייצב פרויקט, לשפר ודאות ולחזק את יכולת הביצוע. עם זאת, אין להתעלם מהעבר של הפרויקט. צריך להבין אילו זכויות נרכשו, אילו התחייבויות הועברו, האם קיימות זכויות צדדים שלישיים, ומה מצב הרישום והבטוחות.</p>\n<p dir=\"rtl\">העובדה שהבנייה החלה היא נתון חיובי מבחינת מעבר מתכנון לביצוע, אך היא אינה מחליפה בדיקה משפטית. רוכש צריך לוודא שהחברה שמוכרת לו את הדירה היא בעלת הזכויות הדרושות או פועלת מכוח הסכמים תקפים, שהליווי הבנקאי או מנגנון הבטוחות ברור, ושהתשלום מועבר רק בהתאם להוראות ההסכם ולמנגנון ההגנה שנקבע.</p>\n<p dir=\"rtl\">בפרויקט שעבר ידיים במסגרת הסדר חוב, יש מקום לבדוק גם את רציפות הפרויקט מבחינת תכנון, היתר, מפרטים, התחייבויות לרוכשים קודמים אם היו, וכן את היחס בין המצגים השיווקיים של היזם הקודם לבין המצגים של היזם הנוכחי. רוכש חדש צריך להסתמך על המסמכים שעליהם הוא חותם היום, ולא על פרסומים היסטוריים.</p>\n\n<h2 dir=\"rtl\">היזם: י.ח דמרי</h2>\n<p dir=\"rtl\">י.ח דמרי היא יזמית נדל\"ן ישראלית מוכרת, וב-DIMRI YAMA היא פועלת באמצעות י.ח דמרי בשדה דב בע\"מ. לרוכש דירה, שם קבוצת היזמות חשוב, אך לא מספיק. יש לבדוק מי החברה שמופיעה בחוזה המכר, מי נותן את הבטוחה, מי הגוף המלווה, מי הקבלן המבצע, ומה מערכת היחסים בין החברה הייעודית לבין הקבוצה הרחבה.</p>\n<p dir=\"rtl\">בפרויקטים גדולים מקובל לפעול באמצעות חברות ייעודיות לפרויקט מסוים. זה אינו פסול, אך הוא דורש שקיפות חוזית. הרוכש צריך לדעת מי הצד המשפטי שמוכר לו את הדירה, מה יכולת ההתחייבות שלו, אילו ערבויות ניתנות, ומה קורה במקרה של עיכוב, שינוי תכנוני, מחלוקת על מפרט או בעיה במסירה.</p>\n<p dir=\"rtl\">המעבר מחנן מור לדמרי מציב את דמרי לא רק כיזם משווק, אלא כיזם שנכנס לפרויקט לאחר עסקה גדולה ומשמעותית. לכן בדיקת הרוכש צריכה לכלול גם את נסיבות הרכישה, מסמכי הזכויות, מצב הליווי, התאמת החוזה למציאות הנוכחית, והבחנה בין התחייבויות שהיו בעבר לבין התחייבויות היזם הנוכחי.</p>\n\n<h2 dir=\"rtl\">נקודות תשומת לב צרכניות: מעבר יזם בהסדר חוב ומה זה אומר לרוכש, רכישת דירות על ידי בעל השליטה ועסקאות בעלי עניין</h2>\n<h3 dir=\"rtl\">מעבר יזם במסגרת הסדר חוב</h3>\n<p dir=\"rtl\">כאשר פרויקט עובר מיזם אחד לאחר במסגרת הסדר חוב, הרוכש צריך להסתכל על התמונה בזהירות, אך לא מתוך הנחה אוטומטית שמדובר בבעיה. השאלה אינה רק מי היזם הקודם ומי היזם הנוכחי, אלא מה בדיוק עבר בעסקה, מה מצב הזכויות, מה מצב התכנון, אילו התחייבויות קיימות, ומה ההגנות שניתנות לרוכשים החדשים.</p>\n<p dir=\"rtl\">ב-DIMRI YAMA, הנתון המרכזי הוא רכישה ביולי 2024 מחברת חנן מור תמורת כ-1.1 מיליארד שקל במסגרת הסדר חוב. עבור רוכש, זהו נתון שיש להכניס לרשימת הבדיקות מול עורך דין מקרקעין. יש לבקש לראות כיצד הזכויות בפרויקט מעוגנות, האם קיימת רציפות מלאה מול הרשויות והגוף המלווה, והאם חוזה המכר מתייחס למציאות המשפטית הנוכחית של הפרויקט.</p>\n<h3 dir=\"rtl\">רכישת דירות על ידי בעל השליטה</h3>\n<p dir=\"rtl\">נקודה נוספת שפורסמה בכלי תקשורת היא כי כמעט מחצית מהדירות שדמרי מכרה נרכשו על ידי בעל השליטה בחברה. עסקת בעל עניין אינה בהכרח עסקה פסולה, אך היא מחייבת את הרוכש להבין איך לקרוא את נתוני המכירות. כאשר חברה מציגה מכירות בפרויקט, רוכש צריך לשאול כמה מהן הן עסקאות עם רוכשים חיצוניים, כמה הן עסקאות קשורות, ומה המשמעות הכלכלית של הדבר.</p>\n<p dir=\"rtl\">החשש הצרכני אינו נובע מעצם העובדה שבעל שליטה רוכש דירות, אלא מהאפשרות שרוכש מן הציבור יפרש את קצב המכירות כביקוש חיצוני מלא. לכן כדאי לבקש מהיזם מידע עדכני ככל שניתן על מלאי הדירות, על תנאי המכירה, על שלב הפרויקט ועל ההבדל בין פרסומים שיווקיים לבין נתונים מחייבים בחוזה. בפרויקט יוקרתי, שקיפות היא חלק מהערך.</p>\n\n<h2 dir=\"rtl\">בדיקות משפטיות לפני רכישה על הנייר: חוק המכר, בטוחות, חוזה, מפרט, מועד מסירה, דמי ניהול ומיסוי</h2>\n<h3 dir=\"rtl\">חוק המכר דירות וחוק המכר הבטחת השקעות</h3>\n<p dir=\"rtl\">רכישה בפרויקט כמו DIMRI YAMA היא רכישה על הנייר או בשלבי בנייה, ולכן חוק המכר דירות וחוק המכר הבטחת השקעות עומדים במרכז הבדיקה. הרוכש צריך לוודא שהחוזה כולל מנגנון בטוחות ברור, שהכספים משולמים בהתאם להוראות שנקבעו, ושאין העברה חופשית של כספים שאינה מגובה בבטוחה מתאימה.</p>\n<p dir=\"rtl\">הבדיקה אינה טכנית בלבד. יש להבין האם קיימת ערבות, האם יש ליווי בנקאי, מה זהות הגוף המלווה, איך מתבצעים התשלומים, מה קורה במקרה של עיכוב, ומהם התנאים לשחרור כספים. עורך דין מקרקעין מטעם הרוכש צריך לעבור על מסמכי הליווי, נספחי הבטוחות והוראות התשלום לפני חתימה.</p>\n<h3 dir=\"rtl\">רציפות זכויות אחרי הסדר חוב</h3>\n<p dir=\"rtl\">בפרויקט שנרכש מחנן מור במסגרת הסדר חוב, רציפות הזכויות היא נקודת בדיקה מרכזית. יש לוודא כי החברה המוכרת רשאית למכור את הדירה, שהזכויות בפרויקט עברו בצורה מסודרת, שאין סתירה בין מסמכי הפרויקט לבין חוזה המכר, ושאין התחייבויות קודמות העלולות להשפיע על הרוכש.</p>\n<p dir=\"rtl\">רוכש אינו אמור לבצע בדיקות מורכבות לבד. תפקיד עורך הדין הוא לבדוק את שרשרת הזכויות, את המסמכים הרלוונטיים, את ההסכמים בין הצדדים ואת ההתחייבויות כלפי הרוכש. ככל שהפרויקט גדול יותר ומורכב יותר, כך גדלה החשיבות של בדיקה עצמאית שאינה מסתמכת רק על מצגת מכירה.</p>\n<h3 dir=\"rtl\">חוזה מכר, מפרט ומועד מסירה</h3>\n<p dir=\"rtl\">חוזה המכר הוא המסמך שקובע את זכויות הרוכש, לא ההדמיה ולא השיחה במשרד המכירות. יש לבדוק את מחיר הדירה, לוח התשלומים, מנגנון ההצמדה, מועד המסירה, פיצוי במקרה של איחור, תנאי שינוי תכנון, אפשרות שינוי מפרט, הצמדות, חניה, מחסן, שטחים משותפים וזכויות שימוש במתקנים.</p>\n<p dir=\"rtl\">המפרט הוא אחד המסמכים החשובים ביותר בפרויקט יוקרה. כאשר הפרויקט מציג עיצוב פנים של Kelly Hoppen, בריכות, ספא, סטודיו ויוגה, חדר כושר וגן פנימי, צריך לבדוק מה נכנס לחוזה ומה נשאר ברמת תיאור שיווקי. התחייבות חוזית מפורטת עדיפה על ניסוח כללי שמאפשר פרשנות רחבה מדי.</p>\n<h3 dir=\"rtl\">דמי ניהול ומיסוי</h3>\n<p dir=\"rtl\">בפרויקט עם בריכת אינפיניטי, בריכה פנימית, ספא, חדר כושר, סטודיו ויוגה וגן פנימי, דמי הניהול עשויים להיות רכיב משמעותי בהחלטת הרכישה. יש לבקש אומדן דמי ניהול, להבין מי חברת הניהול, מה תקופת ההתקשרות, אילו שירותים כלולים, האם קיימת אפשרות שינוי, ומה מנגנון קבלת ההחלטות של הדיירים בעתיד.</p>\n<p dir=\"rtl\">בנוסף למחיר הדירה, על הרוכש לבדוק את מס הרכישה, עלויות מימון, עלויות משפטיות, אפשרות הצמדה, עלות שדרוגים ועלות אחזקה. בפרויקט שמחירו מתחיל מ-3.75 מיליון שקל, תכנון מס ותכנון תזרים אינם עניין משני. רוכש שאינו מחשב את כל העלויות עלול לגלות שהפער בין מחיר הפרסום לבין העלות הכוללת משמעותי.</p>\n\n<h2 dir=\"rtl\">שאלות נפוצות</h2>\n<h3 dir=\"rtl\">מי היזם של DIMRI YAMA שדה דב?</h3>\n<p dir=\"rtl\">היזם הוא י.ח דמרי, באמצעות החברה י.ח דמרי בשדה דב בע\"מ. לפני חתימה יש לבדוק את שם החברה המוכרת בחוזה, את הבטוחות שהיא מעניקה ואת הקשר בינה לבין קבוצת דמרי.</p>\n<h3 dir=\"rtl\">כמה דירות יש בפרויקט?</h3>\n<p dir=\"rtl\">הפרויקט כולל 458 יחידות דיור. זהו היקף גדול, ולכן בדיקת הרוכש צריכה לכלול לא רק את הדירה עצמה, אלא גם את המתקנים, הניהול, התחזוקה והשטחים המשותפים.</p>\n<h3 dir=\"rtl\">כמה בניינים יש בפרויקט ומה גובהם?</h3>\n<p dir=\"rtl\">בפרויקט 4 מבנים: שני מגדלים בני 39 ו-16 קומות, ושני מבנים מרקמיים בני 8 עד 9 קומות. ההבדל בין סוגי המבנים עשוי להשפיע על נוף, פרטיות, תחזוקה, שימוש במעליות ואופי המגורים.</p>\n<h3 dir=\"rtl\">מה המחיר ההתחלתי שפורסם?</h3>\n<p dir=\"rtl\">המחיר שפורסם מתחיל מ-3.75 מיליון שקל. יש להתייחס אליו כאל מחיר פתיחה בלבד, ולבדוק את המחיר של הדירה הספציפית, כולל קומה, שטח, מרפסת, נוף, חניה, מחסן, הצמדות ותשלומים נלווים.</p>\n<h3 dir=\"rtl\">איפה נמצא DIMRI YAMA?</h3>\n<p dir=\"rtl\">הפרויקט נמצא ברחוב אבן גבירול 220, במתחם אשכול ברובע שדה דב, בקו ראשון לחוף הים של תל אביב, בין החוף לפארק הירקון.</p>\n<h3 dir=\"rtl\">מה כולל סל המתקנים בפרויקט?</h3>\n<p dir=\"rtl\">לפי הנתונים שנמסרו, הפרויקט כולל בריכת אינפיניטי, בריכה פנימית, מתחם ספא, סטודיו ויוגה, חדר כושר וגן פנימי משותף. יש לבדוק בחוזה ובנספחים מה בדיוק כלול, איך ינוהל המתחם ומה צפויים להיות דמי הניהול.</p>\n<h3 dir=\"rtl\">למה סיפור הרכישה מחנן מור משמעותי לרוכש?</h3>\n<p dir=\"rtl\">ביולי 2024 דמרי רכשה את הפרויקט מחברת חנן מור במסגרת הסדר חוב, תמורת כ-1.1 מיליארד שקל. רוכש צריך לוודא שיש רציפות זכויות, שהחברה המוכרת מוסמכת למכור, ושהבטוחות והליווי הבנקאי ברורים ומעוגנים במסמכים.</p>\n<h3 dir=\"rtl\">מה המשמעות של רכישת דירות על ידי בעל השליטה?</h3>\n<p dir=\"rtl\">דווח כי כמעט מחצית מהדירות שדמרי מכרה נרכשו על ידי בעל השליטה בחברה. מבחינת רוכש, זו נקודה שמצדיקה בדיקה של נתוני המכירות, הביקוש החיצוני, תנאי העסקאות והשקיפות בפרסומים.</p>\n<h3 dir=\"rtl\">האם כדאי לקנות בפריסייל?</h3>\n<p dir=\"rtl\">פריסייל יכול להציע כניסה מוקדמת לפרויקט מבוקש, אך הוא דורש בדיקה קפדנית של מחיר, בטוחות, לוח תשלומים, הצמדות, מפרט, מועד מסירה ודמי ניהול. אין לחתום ללא בדיקה משפטית עצמאית של חוזה המכר וכל נספחיו.</p>\n\n<h2 dir=\"rtl\">שורת סיום והפניות</h2>\n<p dir=\"rtl\">DIMRI YAMA שדה דב הוא פרויקט יוקרה גדול, במיקום נדיר, עם 458 יחידות דיור, 4 מבנים, שני מגדלים בני 39 ו-16 קומות, שני מבנים מרקמיים בני 8 עד 9 קומות, מחיר פתיחה של 3.75 מיליון שקל, ומערך מתקנים רחב הכולל בריכות, ספא, סטודיו ויוגה, חדר כושר וגן פנימי. לצד היתרונות, זהו פרויקט שמחייב בדיקה צרכנית ומשפטית עמוקה בגלל רכישת הפרויקט מחנן מור במסגרת הסדר חוב, העסקה בהיקף של כ-1.1 מיליארד שקל, והדיווחים על רכישת חלק משמעותי מהדירות על ידי בעל השליטה.</p>\n<p dir=\"rtl\">לפני החלטה, כדאי לקרוא על הרובע כולו בעמוד <a dir=\"rtl\" href=\"/sde-dov/\">רובע שדה דב המדריך המלא</a>, להיעזר בבדיקת <a dir=\"rtl\" href=\"/real-estate-lawyer/\">עורך דין מקרקעין</a>, ולחשב את העלות הכוללת באמצעות <a dir=\"rtl\" href=\"/purchase-tax-calculator/\">מחשבון מס רכישה</a>. בפרויקט כזה, ההחלטה הנכונה אינה מבוססת רק על שם היזם, המיקום או ההדמיה, אלא על שילוב בין דירה ספציפית, חוזה מדויק, בטוחות ברורות, מפרט כתוב, תזרים מלא והבנה של כל הסיכונים לפני חתימה.</p>\n<p dir=\"rtl\">מקורות לעיון: אתר דמרי, אתר רובע שדה דב, מדלן, יד2, דיווחים כלכליים על רכישת הקרקע מחנן מור בהסדר חוב ועל מכירת דירות לבעל השליטה בחברה.</p>\n<p dir=\"rtl\"><em>המידע מבוסס על מקורות פומביים והמחשה מקורית. מחיר, זמינות ותנאים מחייבים אישור היזם.</em></p>\n<div class='nadlan-guide'><section class='wrap'><div class='disc       a.hreflang=l;a.className=l===LANG?'on':'';c.appendChild(a);}
    else{const b=document.createElement('button');b.textContent=D.LANG_NAMES[l];
      b.className=l===LANG?'on':'';b.onclick=()=>{LANG=l;const s=window.scrollY;build();window.scrollTo(0,s);};c.appendChild(b);}
  });
}
function renderMods(){
  const c=document.getElementById('modlist');c.innerHTML='';
  MODULES.forEach(([k,lbl])=>{const id='mod_'+k;
    c.insertAdjacentHTML('beforeend',`<label><input type="checkbox" id="${id}" ${ON[k]?'checked':''}><span>${U[lbl]}</span></label>`);
    setTimeout(()=>{const el=document.getElementById(id);if(el)el.onchange=e=>{ON[k]=e.target.checked?1:0;applyMods();};});
  });
}
function applyMods(){MODULES.forEach(([k])=>{const s=document.querySelector(`[data-m="${k}"]`);if(s)s.style.display=ON[k]?'':'none';});}
function renderUnits(){
  const c=document.getElementById('units');c.innerHTML='';
  P.units.forEach(u=>{const el=document.createElement('button');el.className='unit '+statusClass(u.status);el.dataset.id=u.id;
    el.innerHTML=`<span class="dot"></span><span class="meta"><span class="t">${U.rooms} ${u.rooms} · ${U.floor} ${u.floor}</span>
      <span class="s">${u.sqm} ${U.sqm} · ${esc(u.dir)} · ${statusLabel(u.status)}</span></span>
      <span class="p">${nf(est(u))} ₪</span>`;
    el.onclick=()=>select(u.id);c.appendChild(el);});
}
let povPrev=null;
function enterPOV(u){
  const m=document.getElementById('mv2'); if(!m||!u.hotspot) return;
  document.querySelector('.toggle button[data-view="3d"]')?.click();
  povPrev={orbit:m.getAttribute('camera-orbit'),target:m.getAttribute('camera-target'),fov:m.getAttribute('field-of-view')||'30deg'};
  m.autoRotate=false;
  m.cameraTarget=u.hotspot[0]+'m '+u.hotspot[1]+'m '+u.hotspot[2]+'m';
  m.cameraOrbit='0deg 85deg 2m'; m.fieldOfView='75deg';
  document.getElementById('povbar').classList.add('on');
  document.getElementById('stage').scrollIntoView({behavior:'smooth',block:'center'});
}
function exitPOV(){
  const m=document.getElementById('mv2'); if(!m||!povPrev) return;
  m.cameraTarget=povPrev.target; m.cameraOrbit=povPrev.orbit; m.fieldOfView=povPrev.fov;
  document.getElementById('povbar').classList.remove('on'); povPrev=null;
}
function renderPins(){
  const c=document.getElementById('pins');c.innerHTML='';
  const top=P.floors||40;
  P.units.forEach(u=>{const frac=Math.min(.92,Math.max(.06,u.floor/top));
    const p=document.createElement('div');p.className='pin '+statusClass(u.status);p.dataset.id=u.id;
    p.style.insetBlockEnd=(6+frac*80)+'%';
    p.innerHTML=`<button title="${U.floor} ${u.floor}">${u.floor}</button>`;
    p.querySelector('button').onclick=()=>select(u.id);c.appendChild(p);});
}
function select(id){sel=id;const u=P.units.find(x=>x.id===id);
  document.querySelectorAll('.unit').forEach(e=>e.classList.toggle('on',e.dataset.id===id));
  document.querySelectorAll('.mvhot').forEach(e=>e.classList.toggle('on',e.dataset.id===id));
  document.querySelectorAll('.fsq').forEach(e=>e.classList.toggle('on',e.dataset.id===id));
  if(u.uorbit){const m2=document.getElementById('mv2');if(m2){m2.autoRotate=false;m2.cameraOrbit=u.uorbit;}}
  clampMV();
  const pn=document.getElementById('panel');pn.hidden=false;
  pn.innerHTML=`<div class="grid">
    <div><div class="k">${U.floor}</div><div class="v">${u.floor}</div></div>
    <div><div class="k">${U.rooms}</div><div class="v">${u.rooms}</div></div>
    <div><div class="k">${U.sqm}</div><div class="v">${u.sqm}</div></div>
    <div><div class="k">${U.price_l} (${U.est})</div><div class="v" style="color:var(--terra)">${nf(est(u))} ₪</div></div>
    </div>
    <div class="row"><span class="chipbtn">${U.dir}: ${esc(u.dir)}</span><span class="chipbtn">${U.plan}</span>
      <button class="chipbtn" data-act="pov" data-id="${esc(u.id)}" style="cursor:pointer;border-color:var(--gold);color:var(--gold);background:transparent">👁 ${U.pov||U.view}</button>
      <button class="cta">${U.inquire} · ${esc(u.label||u.id)}</button></div>`;
  document.querySelectorAll('.fsq').forEach(e=>{if(!e.dataset.wired){e.dataset.wired=1;e.onclick=()=>{if(!e.classList.contains('is-sold'))select(e.dataset.id);};}});
  const pvb=pn.querySelector('[data-act="pov"]'); if(pvb) pvb.onclick=()=>enterPOV(u);
  const pxe=document.getElementById('povexit'); if(pxe&&!pxe.dataset.wired){pxe.dataset.wired=1;pxe.onclick=exitPOV;}
  const m=document.getElementById('m_price');if(m){m.textContent=nf(est(u))+' ₪';recalcMort();}
}
function wire(){
  const mb=document.getElementById('modbtn'),mp=document.getElementById('modpop');
  mb.onclick=()=>mp.classList.toggle('open');
  document.addEventListener('click',e=>{if(!e.target.closest('#modpop')&&!e.target.closest('#modbtn'))mp.classList.remove('open');});
  document.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.toggle button').forEach(x=>x.classList.toggle('on',x===b));
    document.getElementById('facade').classList.toggle('on',b.dataset.view==='facade');
    document.getElementById('mv2').style.visibility=b.dataset.view==='facade'?'hidden':'visible';
  });
  const eq=document.getElementById('m_eq');if(eq)eq.oninput=recalcMort;
  document.querySelectorAll('.mvhot').forEach(b=>b.addEventListener('click',()=>select(b.dataset.id)));
}
function recalcMort(){const u=P.units.find(x=>x.id===sel);if(!u)return;const price=est(u);
  const eq=+document.getElementById('m_eq').value;document.getElementById('m_eqp').textContent=eq+'%';
  const loan=price*(1-eq/100);const r=0.05/12,n=300;const pay=loan*r/(1-Math.pow(1+r,-n));
  document.getElementById('m_loan').textContent=nf(loan)+' ₪';
  document.getElementById('m_pay').textContent=nf(pay)+' ₪';
}
function initMap(){
  if(!window.mapboxgl){return;}
  mapboxgl.accessToken=D.TOKEN;
  map=new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/light-v11',
    center:[P.lng,P.lat],zoom:14.3,pitch:45,bearing:-15,cooperativeGestures:true});
  map.addControl(new mapboxgl.NavigationControl(),'top-left');
  map.on('load',()=>{
    // 3D buildings
    const layers=map.getStyle().layers;const lbl=layers.find(l=>l.type==='symbol'&&l.layout&&l.layout['text-field']);
    map.addLayer({id:'3db',source:'composite','source-layer':'building',type:'fill-extrusion',minzoom:13,
      paint:{'fill-extrusion-color':'#d8cfbe','fill-extrusion-height':['get','height'],'fill-extrusion-opacity':.6}},lbl&&lbl.id);
    // self marker
    const selfEl=document.createElement('div');selfEl.className='pricepin self';selfEl.textContent=nf(P.ppsqm)+' ₪/מ׳';
    new mapboxgl.Marker(selfEl).setLngLat([P.lng,P.lat]).setPopup(new mapboxgl.Popup().setText(P.name_lat)).addTo(map);
    // comps (real, relative offsets by distance)
    (P.comps||[]).forEach((c,i)=>{const ang=(i*137)*Math.PI/180,d=(c.dist_m||300)/111320;
      const el=document.createElement('div');el.className='pricepin';el.textContent=nf(c.ppsqm)+' ₪';
      new mapboxgl.Marker(el).setLngLat([P.lng+Math.cos(ang)*d/Math.cos(P.lat*Math.PI/180),P.lat+Math.sin(ang)*d])
        .setPopup(new mapboxgl.Popup().setText(c.name)).addTo(map);});
  });
  document.querySelectorAll('#maplayers button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#maplayers button').forEach(x=>x.classList.toggle('on',x===b));
    const s=b.dataset.s;if(s==='satellite')map.setStyle('mapbox://styles/mapbox/satellite-streets-v12');
    else map.setStyle('mapbox://styles/mapbox/light-v11');
  });
}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
build();
</script>
</body>
